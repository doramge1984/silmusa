<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>업무효율을 높이는 스마트도구 활용법 · 행정실무사</title>
<style>
 :root{--blue:#bfa05f;--blue-d:#8a6d2e;--green:#bfa05f;--ink:#1f2733;--line:#e3e8f0;--bg:#f4f6fb;--muted:#6b7688;}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:20px;line-height:1.95;}
 .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px;}
 header.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#121a2e 0%,#1c2842 55%,#243356 100%);color:#eef2f9;padding:32px 24px;border-radius:0 0 18px 18px;border-bottom:2px solid rgba(201,168,76,.55);box-shadow:0 6px 22px rgba(10,18,40,.32);}
 header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%);pointer-events:none;}
 header.top>*{position:relative;z-index:1;}
 header.top .kicker{font-size:15px;letter-spacing:.10em;color:#cdb478;margin:0 0 9px;font-weight:700;}
 header.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.01em;color:#e4c778;text-shadow:0 1px 10px rgba(201,168,76,.18);}
 header.top .sub{margin:11px 0 0;font-size:17px;color:#c3cde0;}
 .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px;}
 .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
 .tab:hover:not(.active){border-color:#9aa4b5;}
 .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(30,50,90,.18);}
 .tab.active[data-tab="home"]{background:#1c2842;border-color:#1c2842;}
 .tab.active[data-tab="1"]{background:#4a6a9c;border-color:#4a6a9c;}
 .tab.active[data-tab="2"]{background:#8a6d2e;border-color:#8a6d2e;}
 .tab.active[data-tab="3"]{background:#6f5c9c;border-color:#6f5c9c;}
 .tab.active[data-tab="4"]{background:#a8842f;border-color:#a8842f;}
 .tab.active[data-tab="5"]{background:#9c5f74;border-color:#9c5f74;}
 .tab.active[data-tab="gift"]{background:linear-gradient(135deg,#c9a84c,#a8842f);border-color:#a8842f;color:#fff;}
 .tab .tab-date{font-size:13px;font-weight:600;opacity:.75;margin-left:3px;}
 .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:0 2px 10px rgba(20,40,90,.05);min-height:340px;}
 .s-title{font-size:33px;margin:2px 0 6px;color:var(--blue-d);font-weight:800;line-height:1.35;}
 .s-sub{margin:0 0 16px;color:var(--muted);font-size:20.5px;}
 .s-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:18px;color:#3c4652;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:8px;}
 h3.blk{font-size:23px;margin:52px 0 18px;padding-left:13px;border-left:5px solid var(--green);}
 .block{border:1px solid var(--line);border-radius:12px;margin-bottom:64px;overflow:hidden;}
 .block-head{display:flex;align-items:center;gap:12px;background:#faf7ef;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s;}
 .block-head:hover{background:#e3ebf9;}
 .block.open .block-head{background:#dfe9fb;border-bottom:1px solid #cdddf5;}
 .block-n{background:var(--blue);color:#fff;font-size:16px;font-weight:800;border-radius:6px;padding:5px 12px;white-space:nowrap;}
 .block-t{font-weight:800;font-size:21px;color:var(--blue-d);flex:1;line-height:1.4;}
 .block-h{font-size:14px;color:var(--muted);font-weight:700;}
 .chev{font-size:20px;color:var(--blue);font-weight:900;transition:transform .2s;line-height:1;}
 .block.open .chev{transform:rotate(180deg);}
 .block-body{display:none;}
 .block.open .block-body{display:block;}
 .block-ul{margin:0;padding:20px 22px 8px 40px;} .block-ul li{margin:16px 0;font-size:19px;line-height:1.75;}
 .item-detail{margin:26px 0;} .item-label{font-weight:800;color:var(--ink);}
 .item-detail.coll{margin:46px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(40,60,100,.09);}
 .item-detail.coll:first-child{margin-top:20px;}
 .item-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:15px 16px;background:#f7f9fd;font-size:19.5px;}
 .item-toggle:hover{background:#faf7ef;}
 .item-detail.coll.open .item-toggle{background:#faf7ef;border-bottom:1px solid var(--line);}
 .item-toggle .ichev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .2s;}
 .item-detail.coll.open .ichev{transform:rotate(180deg);}
 .item-detail.coll .item-body{display:none;padding:6px 14px 10px;}
 .item-detail.coll.open .item-body{display:block;}
 .item-detail.coll-green{border-color:#e4d9b8;}
 .item-detail.coll-green .item-toggle{background:#f7f2e7;}
 .item-detail.coll-green .item-toggle:hover{background:#dff3e8;}
 .item-detail.coll-green.open .item-toggle{background:#dff3e8;border-bottom-color:#e4d9b8;}
 .item-detail.coll-green .item-body{background:#f6fcf9;}
 .item-detail.coll-red{border-color:#f3c4c0;}
 .item-detail.coll-red .item-toggle{background:#fdecec;}
 .item-detail.coll-red .item-toggle:hover{background:#fbdedd;}
 .item-detail.coll-red.open .item-toggle{background:#fbdedd;border-bottom-color:#f3c4c0;}
 .item-detail.coll-red .item-body{background:#fffafa;}
 .steps{margin:12px 0 6px;padding-left:26px;counter-reset:st;}
 .steps li{margin:12px 0;font-size:18px;line-height:1.75;color:#33404f;}
 .item-note{margin:8px 0 2px;font-size:16px;color:#8a94a4;}
 .item-lead{margin:4px 0 10px;font-size:18px;line-height:1.75;color:#33404f;}
 /* roomy: 특정 차시만 간격 넓게 — 내용 바뀔때 2줄+, 큰주제 바뀔때 5줄+ */
 .block.roomy .steps li{margin:46px 0;}
 .block.roomy .steps{margin:26px 0 14px;}
 .block.roomy .item-lead{margin:8px 0 32px;}
 .block.roomy .item-note{margin:40px 0 6px;}
 .block.roomy .item-body{padding:20px 16px 28px;}
 .block.roomy .item-detail.coll{margin:58px 0;}
 .block.roomy .item-detail.coll:first-child{margin-top:22px;}
 .block.roomy .item-detail.coll.open{margin-bottom:120px;}
 .img-slot{border:2px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:26px 16px;text-align:center;color:#8a94a4;font-size:14.5px;margin:10px 0;}
 .img-slot b{display:block;color:#5b6472;font-size:16px;margin-bottom:4px;}
 .doc-img{display:block;max-width:100%;height:auto;margin:14px 0 60px;border:1px solid #e3e8f0;border-radius:12px;box-shadow:0 3px 12px rgba(40,60,100,.10);}
 .setup{margin:8px 0 40px;border:1px solid #d9c9a0;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(40,60,100,.08);}
 .setup-head{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c2842,#2a3a60);color:#e4c778;padding:17px 20px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;flex-wrap:wrap;}
 .setup-head .setup-sub{font-size:14.5px;font-weight:600;color:#b7c2d6;}
 .setup-head .chev{margin-left:auto;color:#e4c778;transition:transform .2s;}
 .setup.open .setup-head .chev{transform:rotate(180deg);}
 .setup-body{display:none;padding:20px 22px;background:#fbfcfe;}
 .setup.open .setup-body{display:block;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .step{border:1px solid #e6ddc3;border-left:4px solid #c9a84c;border-radius:10px;padding:16px 18px 18px;margin:16px 0;background:#fff;}
 .step.step-red{background:#fff5f5;border-color:#f3c4c0;border-left-color:#e05a4a;}
 .step-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#c9a84c,#a8842f);padding:4px 12px;border-radius:20px;margin-bottom:10px;}
 .step-title{font-size:19px;font-weight:800;color:#1f2733;margin-bottom:12px;line-height:1.4;}
 .step-lead{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#3a4250;}
 .click-here{font-size:15px;font-weight:800;color:#c0392b;}
 .mini-toggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#f2f5fb;border:1px solid #dbe4f1;color:#3a4250;border-radius:8px;padding:9px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
 .mini-toggle:hover{border-color:#c9a84c;}
 .mini-toggle .mchev{color:#a8842f;font-size:14px;}
 .mini-body{display:none;margin-top:12px;font-size:16px;line-height:1.75;color:#3a4250;}
 .mini-body.show{display:block;}
 .mini-body ul{margin:8px 0 0;padding-left:22px;} .mini-body li{margin:6px 0;} .mini-body p{margin:0 0 8px;}
 .warn{background:#fff5f5;border:1px solid #f3c4c0;border-radius:8px;padding:11px 14px;color:#a5372f;font-size:15.5px;line-height:1.7;margin-top:12px;}
 .game-flip{margin:36px 0 90px;perspective:1000px;}
 .game-cover{cursor:pointer;border-radius:18px;padding:44px 24px;text-align:center;color:#fff;box-shadow:0 8px 26px rgba(40,60,100,.2);transition:transform .2s;position:relative;overflow:hidden;}
 .game-cover:hover{transform:translateY(-4px);}
 .game-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);pointer-events:none;}
 .game-cover.cov1{background:linear-gradient(140deg,#3b6fe0,#7a5cf0);}
 .game-cover.cov2{background:linear-gradient(140deg,#f0902a,#e0542a);}
 .cover-badge{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.22);padding:5px 15px;border-radius:20px;margin-bottom:12px;}
 .cover-emoji{font-size:66px;line-height:1;margin:6px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));}
 .cover-title{font-size:27px;font-weight:900;margin-bottom:12px;}
 .cover-hint{font-size:16.5px;font-weight:800;opacity:.96;}
 .game-content{display:none;}
 .game-flip.flipped .game-cover{display:none;}
 .game-flip.flipped .game-content{display:block;animation:flipin .5s ease;}
 .game-content .game.arcade{margin:0;}
 @keyframes flipin{0%{transform:perspective(900px) rotateY(-90deg);opacity:0}100%{transform:perspective(900px) rotateY(0);opacity:1}}
 .level-row{display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap;}
 .level-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:12px;padding:10px 18px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .level-btn:hover{background:#e4e9f3;}
 .level-btn.active{background:linear-gradient(135deg,#3b6fe0,#7a5cf0);color:#fff;box-shadow:0 3px 10px rgba(90,92,240,.28);}
 .g1-src{display:none;width:100%;min-height:110px;padding:14px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:16.5px;font-family:inherit;line-height:1.7;margin-bottom:14px;resize:vertical;background:#fbfdff;}
 .g1-src:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .g1-inst{font-size:18px !important;background:linear-gradient(135deg,#f7f2e7,#e3ecfb) !important;border-color:#b9cdef !important;color:#1f3a68 !important;}
 .cap-emoji-only{justify-content:center;}
 .cap-emoji-only .cap-emoji{font-size:96px;}
 .game.arcade{position:relative;border:0;border-radius:18px;padding:26px 24px;margin:24px 0;background:linear-gradient(160deg,#ffffff,#f5f8fd);box-shadow:0 8px 26px rgba(40,60,100,.13);overflow:hidden;}
 .game.arcade::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#bfa05f);}
 .arcade-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px;}
 .arcade-badge{font-size:13px;font-weight:900;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#1c2842,#3b4d78);padding:5px 13px;border-radius:8px;box-shadow:0 2px 6px rgba(28,40,66,.25);}
 .arcade-title{font-size:23px;font-weight:900;color:#1f2733;}
 .arcade-keys{margin-left:auto;}
 .game-desc{margin:2px 0 18px;font-size:16.5px;line-height:1.75;color:#3a4250;}
 .game-hint{font-size:14.5px;font-weight:600;color:#6b7688;}
 .mode-row{display:flex;gap:8px;margin:2px 0 18px;}
 .mode-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:24px;padding:9px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .mode-btn:hover{background:#e4e9f3;}
 .mode-btn.active{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;box-shadow:0 3px 10px rgba(224,114,74,.3);}
 .stage-row{display:flex;align-items:center;gap:12px;margin:10px 0 20px;}
 .dots{display:inline-flex;gap:8px;}
 .dot{width:15px;height:15px;border-radius:50%;background:#dfe4ee;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:.2s;}
 .dot.done{background:linear-gradient(135deg,#bfa05f,#bfa05f);}
 .dot.cur{background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.18);animation:dotpulse 1.1s infinite;}
 @keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
 .stage-label{font-size:14px;font-weight:900;color:#a8842f;letter-spacing:.03em;}
 .g1-target{background:linear-gradient(135deg,#fffdf3,#fff4d0);border:2px dashed #e0c86a;border-radius:16px;padding:24px 18px;font-size:24px;font-weight:800;color:#2a2a2a;text-align:center;margin-bottom:14px;user-select:all;box-shadow:inset 0 2px 10px rgba(224,200,106,.18);}
 .game-start{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;border:0;border-radius:24px;padding:13px 26px;font-size:16.5px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:12px;box-shadow:0 4px 12px rgba(224,114,74,.32);}
 .game-start:hover{filter:brightness(1.05);}
 .game-start.hidden{display:none;}
 .game-input{width:100%;padding:15px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:17px;font-family:inherit;transition:.15s;}
 .game-input:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .paste-zone{min-height:130px;border:2px dashed #b9c6de;border-radius:14px;background:#fbfdff;display:flex;align-items:center;justify-content:center;text-align:center;color:#8a94a4;font-size:16px;padding:16px;cursor:text;transition:.15s;}
 .paste-zone:focus{outline:none;border-color:#f59e0b;background:#fffdf3;}
 .paste-zone img{max-width:100%;max-height:320px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.15);}
 .game-result{margin-top:20px;font-size:18px;font-weight:800;min-height:26px;}
 .game-result.big{font-size:23px;}
 .game-result.ok{color:#bfa05f;} .game-result.bad{color:#e0524a;}
 .best{margin-top:8px;font-size:15.5px;font-weight:800;color:#a8842f;}
 .game-intro{background:linear-gradient(135deg,#fff6e6,#ffeccf);border:1px solid #f2d9a8;border-radius:12px;padding:14px 18px;font-size:16.5px;color:#7a5b12;margin:4px 0 18px;font-weight:600;}
 .cap-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#f7f2e7,#e5ecfb);border:2px solid #b9cdef;border-radius:16px;padding:22px;margin-bottom:10px;box-shadow:0 4px 14px rgba(60,90,160,.12);}
 .cap-emoji{font-size:62px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));}
 .cap-lines{font-size:19px;line-height:1.6;color:#2a2a2a;font-weight:700;}
 .cap-lines .cap-ar{font-size:21px;}
 .cap-note{margin:2px 0 12px;font-size:14.5px;color:#3a4250;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:8px;padding:10px 13px;line-height:1.6;}
 .sheet-embed{width:100%;height:440px;border:1px solid #e3e8f0;border-radius:12px;margin-top:14px;background:#fff;}
 .doc-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:8px;background:#fff;}
 .padlet-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:12px;background:#fff;}
 .embed-note{margin:10px 0 2px;font-size:14.5px;color:#6b7688;line-height:1.6;}
 @media(max-width:560px){.cap-card{flex-direction:column;text-align:center;}.sheet-embed{height:360px;}.doc-embed{height:440px;}.arcade-keys{margin-left:0;width:100%;}}
 .gkeys{margin:6px 0 16px !important;max-width:540px;}
 .faces-btn{margin-top:-44px !important;margin-bottom:52px !important;}
 .check-list{margin:8px 0 4px;display:flex;flex-direction:column;gap:9px;}
 .check-item{background:#f7f2e7;border:1px solid #e4d9b8;border-radius:10px;padding:12px 15px;font-size:16.5px;color:#166b47;font-weight:600;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .tab.active[data-tab="setup"]{background:linear-gradient(135deg,#2a3a60,#1c2842);border-color:#1c2842;color:#e4c778;}
 .tab.active[data-tab="warmup"]{background:linear-gradient(135deg,#e0724a,#d1522a);border-color:#d1522a;color:#fff;}
 .block-body a:not(.copy-btn){color:var(--blue);font-weight:700;word-break:break-all;}
 .copy-btn{display:inline-flex;align-items:center;gap:8px;margin:48px 0 22px;background:#bfa05f;color:#fff !important;text-decoration:none;font-weight:800;font-size:18px;padding:14px 24px;border-radius:10px;box-shadow:0 2px 8px rgba(26,158,106,.25);}
 .copy-btn:hover{background:#8a6d2e;}
 .cta-desc{margin:0 0 12px;font-size:16px;line-height:1.7;color:#48525f;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:13px 16px;}
 .link-btn{display:inline-flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--blue);color:#fff !important;text-decoration:none;font-weight:800;font-size:17.5px;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(26,79,180,.22);}
 .link-btn:hover{background:var(--blue-d);}
 .prompt-wrap{margin:22px 0 6px;border:1px solid #dbe4f1;border-radius:10px;overflow:hidden;}
 .prompt-head{font-weight:800;color:var(--blue-d);font-size:18px;padding:14px 16px;background:#faf7ef;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;}
 .prompt-head:hover{background:#e3ebf9;}
 .pchev{margin-left:auto;font-size:18px;color:var(--blue);transition:transform .2s;}
 .prompt-wrap.open .pchev{transform:rotate(180deg);}
 .prompt-body{display:none;padding:8px 14px 14px;}
 .prompt-wrap.open .prompt-body{display:block;}
 .prompt-inline{margin:12px 0 4px;}
 .tip-wrap{padding:0 !important;overflow:hidden;}
 .tip-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:14px 18px;font-weight:800;}
 .tip-head:hover{filter:brightness(.98);}
 .tip-wrap .pchev{margin-left:auto;color:#d98a12;}
 .tip-body{display:none;padding:0 18px 16px;}
 .tip-wrap.open .tip-body{display:block;}
 .prompt-card{display:flex;align-items:center;gap:12px;background:#f7f9fc;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;margin:12px 0;}
 .prompt-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
 .prompt-text{flex:1;font-size:18px;line-height:1.6;color:var(--ink);}
 .pcopy{flex:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:800;font-size:16px;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;}
 .pcopy:hover{background:var(--blue);color:#fff;}
 .pcopy.done{background:var(--green);border-color:var(--green);color:#fff;}
 @media(max-width:560px){.prompt-card{flex-wrap:wrap}.pcopy{width:100%}}
 .concept{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:18px 22px;margin:8px 0 30px;font-size:18.5px;line-height:1.85;}
 .practice{margin:44px 22px 6px;padding:14px 18px;background:#f7f2e7;border-left:5px solid #bfa05f;border-radius:8px;font-size:18px;line-height:1.75;}
 .tip{margin:36px 22px 20px;padding:13px 18px;background:#fff5e9;border-left:5px solid #d98a12;border-radius:8px;font-size:17px;color:#7a5b12;line-height:1.7;}
 .practice b,.tip b{margin-right:6px;}
 .files-ul{margin:8px 0 0;padding-left:24px;} .files-ul li{margin:9px 0;font-size:18px;line-height:1.6;}
 .fill-box{margin-top:52px;border:1.5px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:22px 22px;}
 .fill-title{font-weight:800;color:var(--blue-d);font-size:18px;margin-bottom:6px;}
 .fill-desc{margin:0;font-size:17.5px;color:var(--muted);line-height:1.7;}
 .home-lead{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:20px 22px;margin:4px 0 30px;font-size:19px;line-height:1.8;}
 .day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
 .day-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;transition:.18s ease;box-shadow:0 2px 10px rgba(40,60,100,.07),inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden;}
 .day-card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;transition:.5s ease;pointer-events:none;}
 .day-card:hover{box-shadow:0 12px 26px rgba(30,50,90,.17),inset 0 1px 0 rgba(255,255,255,.7);transform:translateY(-3px);}
 .day-card:hover::after{opacity:.9;left:120%;}
 .dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
 .dc-no{font-size:16.5px;font-weight:800;color:var(--blue);}
 .dc-date{font-size:15px;color:var(--muted);}
 .dc-title{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.4;}
 .dc-sub{font-size:16.5px;color:var(--muted);line-height:1.55;min-height:44px;}
 .dc-badge{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;}
 .badge-open{background:#e7f7ee;color:#8a6d2e;border:1px solid #e4d9b8;}
 .badge-lock{background:#f1f3f7;color:#8a94a4;border:1px solid #e0e5ee;}
 .day-card.locked .dc-title{color:#5b6472;}
 .day-card.d1{background:linear-gradient(135deg,#eef1f7 0%,#dbe3ef 60%,#c6d3e6 100%);border-color:#adbcd4;border-left:5px solid #4a6a9c;}
 .day-card.d1 .dc-no{color:#3f5c88;}
 .day-card.d2{background:linear-gradient(135deg,#eef4ef 0%,#dae7de 60%,#c4d8ca 100%);border-color:#aac2b3;border-left:5px solid #8a6d2e;}
 .day-card.d2 .dc-no{color:#8a6d2e;}
 .day-card.d3{background:linear-gradient(135deg,#f1eef7 0%,#e2dbee 60%,#cfc4e2 100%);border-color:#bcb0d6;border-left:5px solid #6f5c9c;}
 .day-card.d3 .dc-no{color:#5f4d8a;}
 .day-card.d4{background:linear-gradient(135deg,#f6f0e4 0%,#ece0c7 60%,#ddcca6 100%);border-color:#cbb890;border-left:5px solid #a8842f;}
 .day-card.d4 .dc-no{color:#8a6a25;}
 .day-card.d5{background:linear-gradient(135deg,#f5eef1 0%,#e9dae0 60%,#d8bfc9 100%);border-color:#cbafba;border-left:5px solid #9c5f74;}
 .day-card.d5 .dc-no{color:#844f63;}
 .day-card.dgift{background:linear-gradient(135deg,#efe4c2 0%,#dcc689 50%,#c9a84c 100%);border-color:#b8912f;border-left:5px solid #a8842f;}
 .day-card.dgift .dc-no{color:#6e5518;}
 .day-card.dgift .dc-title,.day-card.dgift .dc-sub,.day-card.dgift .dc-date{color:#54410f;}
 .lock-screen{text-align:center;padding:44px 16px;}
 .lock-screen .big{font-size:60px;margin-bottom:10px;}
 .lock-screen h2{font-size:27px;margin:0 0 8px;color:var(--blue-d);line-height:1.4;}
 .lock-screen p{color:var(--muted);font-size:18.5px;margin:0 0 24px;}
 .pw-row{display:flex;gap:10px;justify-content:center;max-width:400px;margin:0 auto;}
 .pw-row input{flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;}
 .pw-row input:focus{outline:none;border-color:var(--blue);}
 .pw-row button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:15px 26px;font-size:18px;font-weight:700;cursor:pointer;}
 .pw-row button:hover{background:var(--blue-d);}
 .pw-err{color:#c0392b;font-size:16px;margin-top:14px;min-height:20px;}
 .backhome{display:inline-block;margin-bottom:18px;font-size:17px;color:var(--blue);cursor:pointer;font-weight:700;}
 footer{margin-top:34px;text-align:center;color:var(--muted);font-size:14px;}
 .admin-hint{margin-top:10px;font-size:14px;color:#9aa6b6;}
 .gift-table{width:100%;border-collapse:collapse;font-size:18px;margin:6px 0 10px;}
 .gift-table th,.gift-table td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;}
 .gift-table th{background:#faf7ef;font-weight:800;color:var(--blue-d);}
 .gift-table td:first-child{white-space:nowrap;}
 kbd{display:inline-block;background:#1f2733;color:#fff;border-radius:6px;padding:5px 11px;font-size:16px;font-weight:700;font-family:inherit;white-space:nowrap;}
 .gift-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:6px 0 10px;}
 .gift-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:#fff;transition:.15s;}
 .gift-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(20,50,120,.08);}
 .gc-emoji{font-size:24px;flex:none;}
 .gc-body{display:flex;flex-direction:column;flex:1;min-width:0;}
 .gc-title{font-weight:800;color:var(--ink);font-size:17.5px;line-height:1.35;}
 .gc-url{color:var(--muted);font-size:15px;word-break:break-all;}
 .gc-ext{color:var(--blue);font-size:18px;flex:none;font-weight:800;}
 .gem-intro{background:#eef6ff;border:1px solid #d3e6fb;border-radius:10px;padding:14px 16px;font-size:17.5px;line-height:1.75;margin:6px 0 14px;}
 .gem-step{display:flex;gap:14px;align-items:flex-start;margin:14px 0;font-size:18px;line-height:1.7;}
 .gem-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
 .gem-note{margin-top:16px;background:#fff8e8;border:1px solid #f0dfae;border-radius:10px;padding:14px 16px;font-size:17px;color:#7a5b12;line-height:1.75;}
 h3.gift-blk{margin-top:96px;}
 h3.gift-blk:first-of-type{margin-top:48px;}
 .gift-closing{margin-top:96px;text-align:center;background:#f7f2e7;border:1px solid #e4d9b8;border-radius:14px;padding:28px 20px;font-size:18.5px;line-height:1.85;color:#166b47;}
 .gift-closing .gc-icon{font-size:42px;margin-bottom:6px;}
 .instructor{margin:2px 0 96px;}
 .ins-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#141d33 0%,#1e2b4a 60%,#26365c 100%);border:1px solid #33436a;border-top:3px solid #c9a84c;border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(12,20,44,.22);}
 .ins-banner::after{content:"";position:absolute;top:-40%;right:-4%;width:36%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0),rgba(201,168,76,.16) 50%,rgba(255,255,255,0));transform:skewX(-16deg);pointer-events:none;}
 .ins-kicker{position:relative;z-index:1;font-size:13px;letter-spacing:.14em;color:#cdb478;font-weight:800;margin-bottom:8px;}
 .ins-name{position:relative;z-index:1;font-size:28px;font-weight:800;color:#e4c778;line-height:1.15;}
 .ins-name span{font-size:17px;color:#aeb9cf;font-weight:600;margin-left:9px;font-style:italic;}
 .ins-chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;}
 .ins-chip{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#dce4f1;border-radius:22px;padding:8px 15px;font-size:14.5px;font-weight:600;}
 .ins-chip b{color:#e4c778;}
 .ins-div{position:relative;z-index:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),rgba(201,168,76,0));margin:18px 0;}
 .ins-contact{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;}
 .ins-pill{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#e4c778 !important;border-radius:22px;padding:9px 16px;font-size:15px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
 .ins-pill:hover{background:rgba(201,168,76,.16);}
 .ins-cta{background:linear-gradient(135deg,#e0c375,#c9a84c);border-color:#c9a84c;color:#1c2842 !important;}
 .ins-cta:hover{filter:brightness(1.05);background:linear-gradient(135deg,#e7ce86,#d0af52);}
 .ins-toggle{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6ddc3;border-radius:12px;padding:15px 20px;font-size:16.5px;font-weight:800;color:#3a4250;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(40,60,100,.06);transition:.15s;}
 .ins-toggle:hover{border-color:#c9a84c;}
 .ins-plus{color:#c9a84c;font-size:22px;font-weight:800;line-height:1;transition:transform .2s;}
 .instructor.open .ins-plus{transform:rotate(45deg);}
 .ins-tag{margin-left:auto;font-size:13px;font-weight:800;color:#a8842f;background:#f7edcf;border:1px solid #eaddb0;border-radius:16px;padding:5px 12px;}
 .ins-more{display:none;}
 .instructor.open .ins-more{display:block;}
 .ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 34px;margin-top:12px;background:linear-gradient(140deg,#141d33,#1e2b4a 60%,#243356);border:1px solid #33436a;border-radius:14px;padding:24px 26px;}
 .ins-col.ins-wide{grid-column:1 / -1;}
 .ins-col h4{margin:0 0 10px;font-size:16px;color:#e4c778;border-bottom:1px solid #3a4a70;padding-bottom:7px;font-weight:800;}
 .ins-col ul{margin:0;padding-left:18px;}
 .ins-col li{margin:7px 0;font-size:15.5px;line-height:1.6;color:#ccd6e6;}
 .ins-col li b{color:#ecd693;font-weight:700;}
 @media(max-width:560px){.ins-grid{grid-template-columns:1fr;}.ins-col.ins-wide{grid-column:auto;}}
 @media(max-width:560px){header.top h1{font-size:26px}.panel{padding:22px 16px}.s-title{font-size:28px}.block-t{font-size:19px}.block-ul li{font-size:18px}.item-toggle{font-size:18px}.steps li{font-size:17px}.gift-table{font-size:16px}.gift-cards{grid-template-columns:1fr}}

/* ===== 마장 캘린더(cal-embed) 스코프 스타일 ===== */
.cal-embed * { margin: 0; padding: 0; box-sizing: border-box; }
.cal-embed body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #F8F9FA;
            color: #202124;
            min-height: 100vh;
            zoom: 1.6;
        }
.cal-embed .header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1a2c45 60%, #0f3460 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35);
        }
.cal-embed .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 52px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
.cal-embed .logo-wrap { display: flex; align-items: center; gap: 14px; }
.cal-embed .g-dots { display: flex; gap: 5px; }
.cal-embed .g-dot {
            width: 11px; height: 11px; border-radius: 50%;
        }
.cal-embed .header-title {
            font-size: 27px; font-weight: 700; letter-spacing: -0.3px;
        }
.cal-embed .header-sub {
            font-size: 15px; opacity: 0.6; font-weight: 300; margin-top: 2px;
        }
.cal-embed .gemini-badge {
            background: linear-gradient(135deg, #bfa05f, #8B5CF6);
            padding: 7px 18px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
.cal-embed .tab-nav {
            display: flex;
            padding: 0 52px;
            overflow-x: auto;
            scrollbar-width: none;
        }
.cal-embed .tab-nav::-webkit-scrollbar { display: none; }
.cal-embed .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 15px 22px;

            border-bottom: 3px solid transparent;

            cursor: pointer;
            white-space: nowrap;

.cal-embed .tab-btn:hover { color: white; background: rgba(255,255,255,0.07); }
.cal-embed .tab-btn.active { color: white; border-bottom-color: #bfa05f; }
.cal-embed .tab-emoji { font-size: 18px; }
.cal-embed .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 44px 28px 80px;
        }
.cal-embed .tab-content { display: none; }
.cal-embed .tab-content.active {
            animation: fadeUp .3s ease;
        }
@keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
.cal-embed .section-header { margin-bottom: 32px; }
.cal-embed .s-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
.cal-embed .s-title {
            font-size: 37px;

        }

            box-shadow: 0 1px 6px rgba(0,0,0,0.08);

.cal-embed .bg-red { background: #EA4335; }

.cal-embed .t-green { background: #E6F4EA; color: #8a6d2e; }

/* ===== 골드 프리미엄 테마 (내용·토글 그대로, 외형만) ===== */

.chev,.block.open .chev{color:#B8901F;}

.foot-inq{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:800;color:#23303f;background:#f7f1e1;border:1.4px solid #d8c48f;border-radius:999px;padding:6px 16px;}

.tabs{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#c9ac66,#bfa05f);width:100vw;margin:0 calc(50% - 50vw) 16px;padding:11px 18px 9px max(14px,calc(50vw - 526px));box-shadow:0 6px 14px -8px rgba(10,18,40,.30);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;gap:7px;}

.tabs::-webkit-scrollbar-thumb{background:#c8cfdb;border-radius:3px;}
.tab{flex:0 0 auto;white-space:nowrap;padding:9px 11px;font-size:15px;gap:5px;border-radius:11px;}
.tab[data-tab="c1"]{background:#fff1f0;border:1.6px solid #e5484d;color:#c0303a;font-weight:800;}
.tab[data-tab="c1"].active{background:#e5484d;border-color:#e5484d;color:#fff;}

.mini-toggle.mt-hot{background:#fff1f0 !important;border:1.6px solid #e5484d !important;color:#c0303a !important;font-weight:800 !important;box-shadow:0 3px 10px rgba(229,72,77,.18);}
.mini-toggle.mt-hot .mchev{color:#e5484d;}
.pc-label.pcl-hot{color:#c0303a;font-weight:800;}
header.top.hero-big{position:relative;overflow:hidden;padding:60px 44px 56px;border-radius:0 0 22px 22px;
  background:radial-gradient(ellipse at 78% 16%, #2d3f58 0%, #1c2836 56%, #121a28 100%);border-bottom:3px solid #bfa05f;}
header.top.hero-big::before{display:none;}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0;}
.hero-orb.a{width:360px;height:360px;right:-70px;top:-130px;background:#2c3e57;opacity:.6;}
.hero-orb.b{width:190px;height:190px;left:-60px;bottom:-90px;background:#27374b;opacity:.55;}
.hero-ico{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#e0c778,#bfa05f);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(191,160,95,.42);margin-bottom:24px;}
.hero-ico svg{width:42px;height:42px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.hero-tag{display:inline-block;border:1px solid rgba(217,199,155,.5);color:#ecdcb2;background:rgba(255,255,255,.06);
  padding:8px 20px;border-radius:999px;font-size:18px;font-weight:700;letter-spacing:.02em;margin-bottom:20px;}
header.top .hero-h1{margin:0;font-size:clamp(30px, 5vw, 64px);white-space:nowrap;line-height:1.1;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fbeec2 0%,#ecd396 40%,#c8a865 70%,#a07f3d 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 16px rgba(191,160,95,.4));}
.hero-sub{margin:24px 0 0;font-size:21px;color:#cdd6e2;}
.hero-sub b{color:#ecdcb2;font-weight:700;}

<script>
const P={"insHtml": "<div class=\"instructor\"><div class=\"ins-banner\"><div class=\"ins-kicker\">INSTRUCTOR · 강사</div><div class=\"ins-name\">이애진 <span>Lee Ae-jin</span></div><div class=\"ins-chips\"><span class=\"ins-chip\">구글 공식 PD 파트너사 · <b>FlowDX 대표</b></span><span class=\"ins-chip\">구글 공식 트레이너 (Google Certified Trainer)</span><span class=\"ins-chip\">🎓 서울대학교 정보문화학(ICT)</span></div><div class=\"ins-div\"></div><div class=\"ins-contact\"><a class=\"ins-pill\" href=\"https://flowdx.kr\" target=\"_blank\" rel=\"noopener\">🌐 flowdx.kr</a><a class=\"ins-pill\" href=\"mailto:ai@flowdx.kr\">✉ ai@flowdx.kr</a><a class=\"ins-pill\" href=\"tel:01023198419\">☎ 010-2319-8419</a><a class=\"ins-pill ins-cta\" href=\"https://capable-tarsier-97affe.netlify.app/\" target=\"_blank\" rel=\"noopener\">🔗 프로필 보기</a></div></div><button class=\"ins-toggle\" onclick=\"this.closest('.instructor').classList.toggle('open')\"><span class=\"ins-plus\">+</span> 강사 상세 이력 보기<span class=\"ins-tag\">학력 · 경력 · 저서</span></button><div class=\"ins-more\"><div class=\"ins-grid\"><div class=\"ins-col\"><h4>🎓 학력 · 자격</h4><ul><li>서울대학교 정보문화학(ICT)</li><li>Google Certified Trainer (구글 공식 트레이너)</li><li>Gemini Certified Educator (제미나이 에듀케이터)</li><li>ADsP · 데이터 분석 준전문가</li></ul></div><div class=\"ins-col\"><h4>📰 언론 보도 · 공식 성과</h4><ul><li>중앙뉴스타임스(2025.11) · 인천시교육청 교육연수원 직무연수</li><li>인천광역시교육청(2025.12) · 초·중등 교실수업혁명 직무연수 운영</li><li>미디어투데이(2025.07) · 파주교육지원청 AI 소통 역량 강화·실무 적용</li></ul></div><div class=\"ins-col ins-wide\"><h4>🏫 교육 · 행정 혁신 주요 경력</h4><ul><li>구글 코리아 <b>제미나이 아카데미 주강사</b></li><li>전국 학교장·교감 대상 <b>AI 리터러시 리더십 연수 200회+</b></li><li>대학 교직원·교수·학생 대상 AI 행정 혁신 연수</li><li>경기도교육연구원 박사급 연구원 대상 정책연구 AI 활용 연수</li><li>5~9급 교육행정직 공무원 <b>AI 정책보고서 연수</b></li><li>한국과학창의재단 ‘찾아가는 학교컨설팅’ 코디네이터·주강사</li><li>대원외고 등 특목고 AI 연수 및 영재교육연구소 강사 양성 연수</li></ul></div><div class=\"ins-col\"><h4>💼 산업 현장 실무</h4><ul><li><b>FlowDX 대표</b> — AI 비즈니스 모델링·공공기관 DX 전환 컨설팅 총괄</li><li>Ebay·G마켓·옥션 해외 플랫폼 개발 프로젝트 기획 참여</li><li>Nexon·Ebay 등 글로벌 기업 주요 프로젝트 기획·개발</li></ul></div><div class=\"ins-col\"><h4>📚 주요 저서</h4><ul><li>『HTML, CSS, JavaScript를 배우는 마법코딩학교』</li><li>『AI시대, 보고서가 당신의 무기가 된다』</li><li>『AI 기반 문화콘텐츠 기획』</li></ul></div></div></div></div>", "setup": "<h2 class=\"s-title\">🛠️ 시작 전 환경 세팅</h2><p class=\"s-sub\">연수 전에 미리 준비하세요 — 크롬 · 구글계정 + 3주차 노트북(윈도우11) 체크업.</p><p class=\"setup-intro\">연수를 매끄럽게 진행하려면 <b>크롬 브라우저</b>와 <b>구글 개인계정</b>이 필요합니다. 아래 <b>6단계</b>를 미리 준비해 주세요.</p><div class=\"step\"><div class=\"step-badge\">STEP 1</div><div class=\"step-title\">크롬 브라우저가 없다면? 크롬 설치!</div><a class=\"link-btn\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 설치하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">크롬 설치 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>브라우저는 인터넷을 여는 창입니다. 대표적으로 크롬(Chrome)과 엣지(Edge)가 있어요. 이 연수에서는 구글 AI인 <b>제미나이와 가장 잘 맞는 크롬</b>을 사용합니다. 이 과정은 크롬(Chrome) 기준으로 진행합니다.</p><ul><li>위 ‘크롬 설치하기’ 버튼을 누릅니다</li><li>Chrome 다운로드 → 설치 파일 실행</li><li>설치가 끝나면 크롬을 <b>기본 브라우저</b>로 설정</li></ul><div class=\"img-slot\"><b>🖼️ 크롬 설치 화면</b>이미지를 주시면 여기에 넣어드릴게요</div></div></div><div class=\"step\"><div class=\"step-badge\">STEP 2</div><div class=\"step-title\">구글 개인계정이 생각이 안 난다면? 비밀번호 찾기</div><p class=\"step-lead\">이미 구글 계정이 있는 분은 새로 만들 필요가 없습니다. 연수 전, 구글 개인계정과 비밀번호를 꼭 준비해 주세요. “내 계정이 있었나? 비밀번호가 뭐였지?” 싶다면 아래 방법으로 찾으면 됩니다.</p><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">계정·비밀번호 찾는 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>아래 문서에서 계정·비밀번호 찾는 방법을 바로 볼 수 있어요. ※ 문서가 안 보이면 <a href=\"https://docs.google.com/document/d/1zk-GCD-GLRBhJscZznerKDfF-yRc9gPwibIvD8ofIFc/edit?tab=t.0\" target=\"_blank\" rel=\"noopener\">여기</a>를 눌러 새 창으로 열어 주세요.</p><iframe class=\"doc-embed\" src=\"https://docs.google.com/document/d/1zk-GCD-GLRBhJscZznerKDfF-yRc9gPwibIvD8ofIFc/preview\" loading=\"lazy\" title=\"계정·비밀번호 찾기 문서\"></iframe></div></div><div class=\"step\"><div class=\"step-badge\">STEP 3</div><div class=\"step-title\">🗂️ 구글 드라이브 용량이 부족하다면? 용량 확보</div><a class=\"link-btn\" href=\"https://drive.google.com/drive/quota\" target=\"_blank\" rel=\"noopener\">🔗 대용량 파일 바로 찾기 (drive.google.com/drive/quota)</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">3단계 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>연수 중 <b>파일 업로드·노트북LM 실습</b>을 위해 드라이브 여유 공간을 미리 확보해 두면 좋아요.</p><ul><li><b>1단계 · 대용량 파일 찾기</b> — 주소창에 <kbd>drive.google.com/drive/quota</kbd> 입력 → 내 드라이브에서 <b>용량 큰 파일부터</b> 순서대로 나와요.</li><li><b>2단계 · 휴지통으로 버리기</b> — 필요 없는 대용량 파일 선택 → <b>우클릭 → ‘휴지통으로 이동’</b>.</li><li><b>3단계 · 휴지통 비우기 ★필수</b> — 왼쪽 <b>‘휴지통’</b> → 우측 상단 <b>‘휴지통 비우기’ → ‘영구 삭제’</b>. 이 작업을 해야 <b>즉시</b> 여유 용량이 늘어나요.</li></ul></div></div><div class=\"step step-red\"><div class=\"step-badge\">STEP 4</div><div class=\"step-title\">구글계정이 없다면? 구글계정 만들기</div><a class=\"link-btn\" href=\"https://accounts.google.com/signup\" target=\"_blank\" rel=\"noopener\">✏️ 구글 가입하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">가입 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>구글 계정이 아예 없다면 새로 만듭니다. <b>학교·기관 계정이 아닌 개인 계정</b>으로 만드는 것이 중요해요.</p><ul><li>위 ‘구글 가입하기’ 버튼 클릭</li><li>이름 → 생년월일·성별 → 원하는 아이디(이메일) 입력</li><li>비밀번호 설정 후 휴대폰 본인인증 → 가입 완료</li><li>만든 아이디와 비밀번호를 꼭 <b>메모</b>해 둡니다</li></ul><div class=\"warn\">📱 가입 중 <b>‘보안문자 · 인증코드’</b> 단계가 나오면 본인 <b>휴대폰으로 SMS 인증</b>이 필요해요 — 휴대폰을 꼭 준비하세요. <b>한 전화번호로는 계정을 몇 개까지만</b> 인증돼서 강사 번호로 여러 개는 만들 수 없어요. 인증이 막히면 아래 <b>STEP 5 임시계정</b>을 쓰시면 됩니다. (가능하면 <b>연수 전 집에서 미리</b> 만들어 오시길 권장!)</div><div class=\"warn\">⚠️ 가입 시 입력한 아이디(이메일)와 비밀번호는 앞으로 <b>AI 로그인에 계속</b> 쓰입니다. 잊지 않도록 적어 두세요.</div></div></div><div class=\"step\"><div class=\"step-badge\">STEP 5</div><div class=\"step-title\">오늘만 사용하실 임시 구글계정 공유</div><p class=\"step-lead\">구글 계정 준비가 어려우시면, 아래 시트에서 오늘만 사용하는 임시 계정을 받아 쓰세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">📄 임시 구글계정 시트 열기</a> <span class=\"click-here\">👈 여기를 클릭!</span><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">임시계정 사용 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>※ 화면에서 바로 보이지 않으면 위 ‘시트 열기’ 버튼으로 열어 주세요. (이름 작성은 시트를 직접 열어야 가능합니다.)</p><ul><li>시트의 <b>C열</b>에 본인 이름(또는 닉네임)을 적습니다.</li><li>그 줄의 아이디·비밀번호로 로그인해 사용합니다.</li></ul><div class=\"warn\">⚠️ 이 계정은 <b>기관 계정</b>이라, AI 활용 시 개인계정과 달리 일부 기능이 막힐 수 있습니다. 가능하면 <b>개인 구글계정</b> 사용을 권장합니다.</div><div class=\"img-slot\"><b>🖼️ 임시계정 시트 화면</b>이미지를 주시면 여기에 넣어드릴게요</div></div><iframe class=\"sheet-embed\" src=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/preview?gid=0\" loading=\"lazy\" title=\"임시 구글계정 시트\"></iframe><p class=\"embed-note\">👀 아래에서 계정을 바로 확인할 수 있어요. <b>이름 작성·로그인은 위 ‘시트 열기’ 버튼</b>으로 직접 열어야 가능합니다.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 6</div><div class=\"step-title\">🖥️ 윈도우 11 · 크롬 확인</div><p class=\"step-lead\">원활한 실습을 위해 아래 <b>2가지</b>를 미리 확인해 주세요.</p><div class=\"check-list\"><div class=\"check-item\">✅ <b>윈도우 11</b>로 업데이트되어 있나요?</div><div class=\"check-item\">✅ <b>크롬 브라우저</b>가 설치되어 있나요? <span class=\"game-hint\">(STEP 1 참고)</span></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">윈도우 11 업데이트 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p><b>① 내 윈도우 버전 확인</b> — <kbd>⊞Win</kbd>+<kbd>R</kbd> → <b>winver</b> 입력 → Enter. (또는 설정 → 시스템 → 정보)</p><img class=\"doc-img\" src=\"winver.png\" alt=\"winver 실행 화면 — Windows 11 버전 확인\" style=\"max-width:460px;margin:12px 0 8px;\"><p style=\"margin-top:2.4em\"><b>② 윈도우 11로 업데이트</b> (윈도우 10이라면)</p><ul><li><kbd>⊞Win</kbd>+<kbd>I</kbd>로 <b>설정</b> → <b>업데이트 및 보안 → Windows 업데이트</b></li><li style=\"list-style:none;margin:8px 0 2px -1.2em;\"><img class=\"doc-img\" src=\"winupdate.png\" alt=\"Windows 업데이트 화면\" style=\"max-width:660px;margin:6px 0 4px;\"></li><li><b>업데이트 확인</b> → “Windows 11로 업그레이드” 안내가 뜨면 <b>다운로드 및 설치</b></li><li>안내가 없으면 <b>Windows 11 설치 도우미</b> 이용 → <a href=\"https://www.microsoft.com/software-download/windows11\" target=\"_blank\" rel=\"noopener\">microsoft.com/software-download/windows11</a></li><li>업데이트는 시간이 걸리니 <b>전원 연결 + 넉넉한 시간</b>에 미리 진행하세요</li></ul><div class=\"warn\">⚠️ PC 사양(TPM 2.0 · 지원 CPU 등)이 안 되면 윈도우 11 업데이트가 <b>불가</b>할 수 있어요. 그런 경우 윈도우 10 그대로 오셔도 되지만, <b>연수 전에 미리 알려</b> 주세요.</div></div></div>", "warmup": "<h2 class=\"s-title\">🔥 워밍업 게임</h2><p class=\"s-sub\">본격 시작 전, 가볍게 손을 푸는 시간! 게임 카드를 <b>뒤집어</b> 단축키를 재미있게 익혀요.</p><div class=\"game-intro\">🏆 <b>도전 모드</b>에서 5개를 가장 빨리 끝낸 분은 강사에게 화면을 보여주세요 — 작은 선물이 기다려요! 🎁</div><div class=\"game-flip\"><div class=\"game-cover cov1\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 1</div><div class=\"cover-emoji\">📋</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 1</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 1</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 1</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><p class=\"game-desc\" id=\"g1desc\">문장을 <b>드래그 → Ctrl+C</b>로 복사하고, 칸을 클릭해 <b>Ctrl+V</b>! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g1mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g1mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g1dots\"></span><span class=\"stage-label\" id=\"g1p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g1t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g1srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g1src\" spellcheck=\"false\" oninput=\"g1srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g1s\" onclick=\"g1start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g1iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g1i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g1paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g1r\"></div><div class=\"best\" id=\"g1b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov3\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 2</div><div class=\"cover-emoji\">🅰️</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 2</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 2</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 2</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>A</kbd> · <kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd> · <kbd>Delete</kbd></span></div><p class=\"game-desc\" id=\"g3desc\">원본 전체를 <b>Ctrl+A</b>로 선택해 <b>복사·붙여넣기</b> 하거나, <b>Ctrl+A → Delete</b>로 싹 지우기! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g3mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g3mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g3dots\"></span><span class=\"stage-label\" id=\"g3p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g3t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g3srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g3src\" spellcheck=\"false\" oninput=\"g3srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g3s\" onclick=\"g3start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g3iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g3i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g3paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g3r\"></div><div class=\"best\" id=\"g3b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov2\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 3</div><div class=\"cover-emoji\">📸</div><div class=\"cover-title\">화면 캡처</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 3</span><span class=\"arcade-title\">화면 캡처</span><span class=\"arcade-keys\"><kbd>⊞Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></span></div><p class=\"game-desc\">아래 <b>이모지</b>를 캡처해서 칸에 <b>Ctrl+V</b>! 이모지가 바뀌며 <b>5장</b> 도전 📸 <span class=\"game-hint\">캡처 키는 브라우저가 못 봐서, 붙여넣기까지 해야 성공!</span></p><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#c0392b\">(윈도우10은 안 돼요)</b></span></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div><img class=\"doc-img gkeys\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\"><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g2mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g2mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g2dots\"></span><span class=\"stage-label\" id=\"g2p\">STAGE 1 / 5</span></div><div class=\"cap-card cap-emoji-only\"><div class=\"cap-emoji\" id=\"g2emoji\">🌏</div></div><button class=\"game-start hidden\" id=\"g2s\" onclick=\"g2start()\">🚩 5장 도전 시작!</button><div class=\"paste-zone\" id=\"g2z\" contenteditable=\"true\" onpaste=\"g2paste(event)\">여기 클릭 → 캡처 이미지 Ctrl+V</div><div class=\"game-result\" id=\"g2r\"></div><div class=\"best\" id=\"g2b\"></div></div></div></div>", "gift": "<h2 class=\"s-title\">🎁 작은 선물들</h2>\n<p class=\"s-sub\">연수에서 바로 써먹는 작은 선물들을 모았어요. 앞으로 자료가 더 추가됩니다.</p>\n\n<h3 class=\"blk gift-blk\">⌨️ 알아두면 편한 크롬 단축키</h3>\n<table class=\"gift-table\"><thead><tr><th>단축키</th><th>기능</th><th>활용 팁</th></tr></thead><tbody><tr><td><kbd>Ctrl + J</kbd></td><td>받은 파일 빨리 찾기</td><td><b>다운로드 목록</b>이 바로 열려요 — 폴더 뒤질 필요 없이 방금 받은 첨부파일·양식을 찾아요.</td></tr><tr><td><kbd>Ctrl + H</kbd></td><td>방문 기록(History) 열기</td><td>이전에 방문했던 사이트를 빠르게 찾을 때 유용해요.</td></tr><tr><td><kbd>Ctrl + Shift + T</kbd></td><td>닫은 탭 다시 열기</td><td>실수로 창을 닫았을 때 당황 금지! 여러 번 누르면 순차적으로 되살아나요.</td></tr><tr><td><kbd>Ctrl + Shift + B</kbd></td><td>북마크바 표시/숨기기</td><td>화면을 넓게 써야 할 때 숨기는 ‘화면 다이어트’ 필수 기능.</td></tr><tr><td><kbd>Ctrl + Shift + V</kbd></td><td>서식 없이 붙여넣기</td><td>웹사이트의 글꼴·색상을 무시하고 텍스트만 깔끔하게 붙여넣어요.</td></tr><tr><td><kbd>Shift + Enter</kbd></td><td>프롬프트 창 내 줄바꿈</td><td>전송하지 않고 다음 줄로 넘어갈 때 사용해요.</td></tr><tr><td><kbd>Ctrl + L</kbd></td><td>주소창으로 바로 이동</td><td>마우스 없이 커서를 주소창으로 옮겨 바로 입력해요.</td></tr><tr><td><kbd>Ctrl + F</kbd></td><td>페이지 안에서 찾기</td><td>긴 페이지에서 원하는 단어를 바로 찾아 이동해요.</td></tr><tr><td><kbd>Ctrl + P</kbd></td><td>웹페이지를 PDF로 저장·인쇄</td><td>인쇄창에서 대상을 <b>‘PDF로 저장’</b> 선택 → 공문·증빙·신청완료 화면을 그대로 보관해요.</td></tr><tr><td><kbd>Ctrl + +</kbd> / <kbd>Ctrl + -</kbd></td><td>글자 크게 / 작게</td><td>화면 글자가 작을 때 크기 조절 (Ctrl + 0 = 원래대로).</td></tr></tbody></table>\n\n<h3 class=\"blk gift-blk\">🌐 알아두면 좋은 유용한 사이트</h3>\n<div class=\"gift-cards\"><a class=\"gift-card\" href=\"https://donue.co.kr/service/signature\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">✍️</span><span class=\"gc-body\"><span class=\"gc-title\">무료 전자서명·도장 만들기</span><span class=\"gc-url\">donue.co.kr/service/signature</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://workspace.google.com/labs-sign-up/join\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">🧪</span><span class=\"gc-body\"><span class=\"gc-title\">구글 실험실 (Workspace Labs)</span><span class=\"gc-url\">workspace.google.com/labs-sign-up/join</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://www.ilovepdf.com/ko\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">📄</span><span class=\"gc-body\"><span class=\"gc-title\">아이러브PDF — PDF 합치기·분할·압축·변환</span><span class=\"gc-url\">ilovepdf.com/ko</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://dashboard.blaze.today\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">⚡</span><span class=\"gc-body\"><span class=\"gc-title\">Blaze (Text Blaze) — 자주 쓰는 문장·답변을 단축어로</span><span class=\"gc-url\">dashboard.blaze.today</span></span><span class=\"gc-ext\">↗</span></a></div>\n\n<h3 class=\"blk gift-blk\">🧩 크롬 확장 프로그램</h3>\n<div class=\"gift-cards\"><a class=\"gift-card\" href=\"https://chromewebstore.google.com/search/AdGuard\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">🛡️</span><span class=\"gc-body\"><span class=\"gc-title\">AdGuard 광고차단기</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://chromewebstore.google.com/search/QR%20Code%20Generator\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">🔳</span><span class=\"gc-body\"><span class=\"gc-title\">QR 코드 제너레이터</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://chromewebstore.google.com/search/Allow%20Copy\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">📋</span><span class=\"gc-body\"><span class=\"gc-title\">복사 허용 (Allow Copy+)</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://chromewebstore.google.com/search/Joois\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">🔗</span><span class=\"gc-body\"><span class=\"gc-title\">Joois QuickShortener — 단축주소 만들기</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-ext\">↗</span></a><a class=\"gift-card\" href=\"https://chromewebstore.google.com/search/Bitly\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">🔗</span><span class=\"gc-body\"><span class=\"gc-title\">Bitly — 단축주소·QR 만들기</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-ext\">↗</span></a></div>\n\n<h3 class=\"blk gift-blk\">🛡️ 안전하게 쓰기 — 이것만은 꼭</h3><div class=\"safe-grid\"><div class=\"safe-card sc-r\"><b>🔴 개인정보 입력 금지</b><span>학생·학부모 이름·주민번호·연락처, 계좌·카드번호는 AI에 넣지 않기</span></div><div class=\"safe-card sc-o\"><b>🟠 팩트체크</b><span>AI는 그럴듯하게 틀려요 — 금액·법령·날짜는 사람이 반드시 확인</span></div><div class=\"safe-card sc-y\"><b>🟡 저작권·중립</b><span>생성물 저작권 유의 · 정치적 중립·차별표현 조심</span></div></div><div class=\"safe-one\">💡 <b>한 문장 원칙</b> — 시스템 처리·최종 판단은 <b>사람</b>이, 읽고·쓰고·정리·계산은 <b>AI</b>가.</div><div class=\"gift-closing\"><div class=\"gc-icon\">🌱</div><b>오늘 연수 정말 수고 많으셨습니다!</b><br>현장에서 막히는 부분이 생기면 언제든 편하게 연락 주세요. 함께 해결해 드리겠습니다. 😊</div>", "gemini": "<h2 class=\"s-title\">✨ 크롬 속 제미나이 (Gemini in Chrome)</h2><p class=\"s-sub\">크롬 화면 옆에 붙어 요약·번역·정리를 도와주는 AI 비서</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⓪ 할루시네이션 제어 — 제미나이 지침 설정<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">제미나이에 아래 <b>지침</b>을 먼저 붙여넣으면, 근거 없는 답(<b>할루시네이션</b>)을 줄이고 <b>검증·출처·검색</b>까지 챙겨줘요. <span style=\"color:#c0303a\"><b>[OO님]</b></span> 자리에 본인 호칭을 넣어 쓰세요.</p><div class=\"prompt-card\"><span class=\"prompt-text\">나를 [OO님]이라고 불러줘.<br>1. 정확성 우선: 확실한 근거가 없으면 “현재 데이터로는 확인할 수 없습니다”라고 정직하게 답변할 것. 추측은 금지한다.<br>2. 검증 절차: 답변을 내놓기 전, 반드시 내부적으로 사실 관계를 먼저 나열하고(Chain of Thought) 그 논리적 흐름에 따라 단계별로 설명할 것.<br>3. 링크 첨부: 언급한 수치나 법령, 학술 자료는 가급적 확인할 수 있는 공식 URL을 함께 제시할 것.<br>4. 최신 검색: 근거가 되는 문서나 데이터가 부족하다면, 추측하지 말고 검색 도구(Google Search)를 활용해서 확인해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 제미나이 in 크롬이란?<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">크롬 브라우저 <b>안에</b> 제미나이가 들어와, 창을 따로 안 켜도 <b>화면 옆에 붙어</b> 도와줘요.</p><ol class=\"steps\"><li>지금 보는 <b>웹페이지·PDF 요약</b></li><li><b>영문 자료 → 한국어</b> 요약·번역</li><li>여러 <b>탭 한꺼번에 비교</b>, <b>유튜브 영상 요약</b></li><li><b>Gmail 초안·캘린더 일정</b>까지 연동</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 켜는 법 (활성화) — <kbd>Alt</kbd>+<kbd>G</kbd><span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>⋮</b>(점 세 개) → <b>설정</b></li><li>맨 아래 <b>Chrome 정보</b> → 최신 버전으로 자동 업데이트</li><li>업데이트되면 <b>‘AI 혁신’</b> 메뉴가 생겨요 → <b>‘크롬의 Gemini’ 켜기</b></li><li>단축키 <kbd>Alt</kbd>+<kbd>G</kbd> → 화면 옆에 제미나이 창이 <b>열렸다 닫혔다</b></li></ol><div class=\"lens-note\">💡 ‘AI 혁신’이 안 보이면 크롬이 아직 구버전이에요 — 업데이트 후 크롬을 껐다 켜세요. 📌 <b>개인 구글 계정</b>으로 로그인해 실습하세요(기관·관리되는 프로필은 정책상 막혀 있을 수 있어요).</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ [실습 준비] 예시 가정통신문 내려받기 📄<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"dl-wrap\"><div class=\"dl-lead\">📄 아래 <b>예시 가정통신문</b>을 먼저 내려받으세요 <span class=\"dl-sub\">(실제 학교 정보는 모두 지운 예시용 파일)</span></div><a class=\"dl-btn\" href=\"gpdf1.pdf\" download=\"예시_가정통신문(캠프안내).pdf\">⬇ 예시① 캠프 안내문</a><a class=\"dl-btn\" href=\"gpdf2.pdf\" download=\"예시_가정통신문(공사안내).pdf\">⬇ 예시② 공사·후문 안내문</a></div><ol class=\"steps\"><li>내려받은 <b>PDF를 크롬으로 열기</b></li><li>그 탭에서 <kbd>Alt</kbd>+<kbd>G</kbd> <b>혹은 ‘제미나이에게 물어보기’ 누르기</b> → 제미나이 창 열기</li></ol><div class=\"lens-note\">아래 <b>4-1(문서 1개)</b> → <b>4-2(문서 2개 비교)</b> 순서로 해보세요. 프롬프트는 모두 <b>복사</b> 버튼으로 가져갈 수 있고, <span class=\"lab-badge\">🔬 실습</span> 표시는 <b>다 함께 해볼 대표 프롬프트</b>예요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④-1 [1단계] 문서 <b>1개</b>로 제미나이 활용<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\"><b>예시① 캠프 안내문</b> 하나만 열고 <kbd>Alt</kbd>+<kbd>G</kbd> → 아래 활동을 해보세요.</p><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">A</span>학부모 발송용 문자(SMS·e알리미) 초안</div><div class=\"act-d\">전문을 안 읽는 학부모용으로 <b>핵심 행동정보만</b> 뽑아 모바일 단문으로.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">왼쪽 가정통신문에서 학부모가 꼭 알아야 할 핵심(신청 기간·방법·유의사항)만 뽑아, e알리미·SMS로 보낼 200자 이내 안내 문자 초안을 정중하게 작성해 줘. 구글폼 링크가 들어갈 자리는 [링크]로 표시해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 문자를 100자 이내 초간단 버전으로도 만들어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">같은 내용을 조금 더 친근한 톤(존댓말 유지)으로 바꿔 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">B</span>전화 문의 대비 FAQ 만들기</div><div class=\"act-d\">발송 직후 쏟아질 문의를 미리 예측 → <b>일관된 답변 매뉴얼</b> 1분 완성.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">이 가정통신문이 배포됐을 때 학부모가 가장 많이 물어볼 예상 질문 3가지와 그 답변(FAQ)을, 문서에 있는 내용만 근거로 작성해 줘. 문서에 없는 내용은 추측하지 말고 “학교로 문의 필요”라고 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 FAQ를 5개로 늘리고, 행정실 직원이 전화로 바로 읽을 수 있게 구어체로 다듬어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">C</span>일정표를 스프레드시트용 표로 추출</div><div class=\"act-d\">PDF 속 표를 <b>구글 시트에 바로 붙여넣게</b> 구조화.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">문서 하단의 캠프 프로그램 운영 일정 표를, 구글 스프레드시트에 바로 붙여넣을 수 있게 표 형식으로 추출해 줘. 강좌번호·대상학년·인원·프로그램명·일자(요일 구분)를 각각 열로 나눠 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 표를 CSV(쉼표로 구분) 형식으로도 출력해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">D</span>다문화 가정용 외국어 요약본</div><div class=\"act-d\">번역기 창 안 켜고 <b>화면에서 바로</b> 다국어 안내문 준비.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">왼쪽 가정통신문에서 인사말을 뺀 “운영 계획(1~5번)” 항목의 핵심만 베트남어와 영어로 각각 번역해 줘. 학교 공식 안내문에 맞는 정중한 톤을 유지해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">같은 내용을 중국어와 러시아어로도 번역해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"lens-note\">※ <b>스캔(사진) 형태 PDF</b>는 인식이 약할 수 있어요 → 안 되면 <b>캡처 도구로 텍스트 복사</b> 후 붙여넣기.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④-2 [2단계] 문서 <b>2개</b>를 열고 <b>비교</b>까지 ⭐<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">예시①·②를 <b>각각 다른 탭</b>에 열고 → 제미나이 창에서 <b>‘탭 추가’</b>로 두 탭을 함께 선택하면, 두 문서를 <b>한꺼번에</b> 읽어요.</p><div class=\"lens-note\">💡 예시① <b>캠프(8/3~8/7)</b>가 예시② <b>공사기간(7/25~9/20)</b>과 겹쳐요 → “두 일정이 물릴 때” 생기는 안전 이슈를 제미나이가 실제로 찾아냅니다.</div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">A</span>정보 교차검증 + 안전 안내 문자 생성</div><div class=\"act-d\">서로 다른 문서의 일정을 겹쳐 보고 <b>안전 문제를 사전 차단</b>.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">지금 열려 있는 두 PDF를 모두 읽어 줘. 첫 번째 문서의 “캠프 일정”과 두 번째 문서의 “운동장 공사 기간”을 겹쳐 봤을 때 생길 수 있는 학생 안전 문제를 분석하고, 그 분석을 근거로 캠프 신청자에게 보낼 “후문 이용·안전 유의사항 안내” 문자 초안을 200자 이내로 작성해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 분석에서 나온 위험요소를 표로 정리하고, 항목별 대응책도 한 줄씩 붙여 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">B</span>복합 상황 전화 응대 스크립트</div><div class=\"act-d\">두 사안을 엮은 문의에도 <b>당황 없이 일관되게</b> 답하는 대본.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">두 가정통신문이 모두 배포된 상황이야. 한 학부모가 “우리 아이가 8월 4일에 캠프를 가는데 학교 공사 중이라 안전이 걱정돼요. 정문으로 들어가면 안 되나요?”라고 전화로 물었을 때, 행정실무사가 친절하고 전문적으로 안내할 전화 응대 스크립트를 작성해 줘. 두 번째 문서의 공사 개요와 협조사항을 근거로 구성해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 스크립트를 신입 직원도 그대로 읽을 수 있게 인사말·본론·마무리 3단계로 나눠 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">C</span>모바일 친화 통합 e알리미 작성</div><div class=\"act-d\">비슷한 시기 여러 안내문을 <b>하나로 병합·요약</b>해 피로도 감소.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">🔬 실습</span><span class=\"prompt-text\">두 가정통신문의 핵심을 하나로 합쳐서 이번 주 학부모용 통합 e알리미 안내문을 작성해 줘. 소제목은 “1. 캠프 신청 안내(대상·기한·링크)”와 “2. 학교 공사로 인한 후문 이용 당부” 두 개로 나누고, 모바일에서 읽기 쉽게 짧게 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">위 통합 안내문을 베트남어·영어 버전으로도 만들어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 웹페이지·영문 자료 요약<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>긴 기사·공문을 연 상태에서 <kbd>Alt</kbd>+<kbd>G</kbd></li><li>아래처럼 요청</li></ol><div class=\"prompt-card\"><span class=\"prompt-text\">이 글에서 핵심만 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">이 웹페이지 한국어로 요약하고 시사점 3개만 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ Gmail·캘린더 연동<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>제미나이 창에서 바로 요청 (계정 연결·권한 허용 필요)</li></ol><div class=\"prompt-card\"><span class=\"prompt-text\">이 내용 그대로 이메일 초안 만들어 줘. 수신자는 ○○○.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">다음 주 월요일 오전 9시 일정으로 구글 캘린더에 추가해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 자주 쓰는 프롬프트를 ‘내 스킬’로 저장<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>제미나이 입력창에 <kbd>/</kbd> 입력 → <b>내 스킬 목록</b>이 떠요</li><li>공문서 작성·정중한 메일처럼 자주 쓰는 프롬프트를 저장 → <b>클릭 한 번</b>으로 불러쓰기</li><li><b>＋ 기능 추가</b>로 새 스킬 만들기</li></ol><div class=\"lens-note\">💡 <b>참고</b> — 이 기능(Skills)은 크롬 <b>언어가 ‘영어(미국)’</b>이고 순차 배포 중이라, 한국어로 설정된 크롬에선 아직 안 보일 수 있어요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ (옵션) 유튜브 요약 · 이미지 편집<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>긴 유튜브 영상을 연 상태에서 <b>“요약하고 타임라인별로 정리해 줘”</b></li><li>웹페이지 이미지를 골라 <b>“화이트톤으로 바꿔줘”</b> <i>(이미지 생성은 Pro 모델 필요)</i></li></ol></div></li></ul></div></div>", "notebook": "<h2 class=\"s-title\">📓 노트북LM (NotebookLM)</h2><p class=\"s-sub\">내가 올린 자료로만 답하는 나만의 AI 비서 — 법령·지침·매뉴얼을 넣고 물어보기</p><div class=\"block open\" id=\"d3-step4\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">STEP 3</span><span class=\"block-t\">노트북LM 기본 — 전용 도서관으로 내 문서 다루기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><p class=\"a3-intro\">오직 <b>내가 올린 자료로만</b> 답하는 NotebookLM으로 ‘내 문서 기반 나만의 AI 비서’를 만듭니다. 💡 공통 업무는 지원이(G-ONE)에게, <b>보안·내 업무 문서는 내 챗봇(NotebookLM)</b>에게 맡깁니다.</p><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\" id=\"d3-4-1\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📚 궁극의 무기 — 당신만의 ‘전용 도서관’ NotebookLM<span class=\"ichev\">▾</span></div><div class=\"item-body\"><img class=\"a3-img\" src=\"ai3img/nlm-library.png\" alt=\"nlm-library.png\" loading=\"lazy\"><div class=\"item-lead\">NotebookLM은 오직 내가 업로드한 자료로만 답변을 생성하는 <b>출처 기반(Source-Grounding) AI</b>입니다.</div><ol class=\"steps\"><li><b>강력한 보안과 정확성</b> — 내 문서에 없는 내용은 지어내지 않아 환각이 거의 없고, 업로드 자료를 <b>AI 학습에 절대 활용하지 않아</b> 보안이 안전</li><li><b>압도적 대용량</b> — 노트북 1개당 최대 50개 소스, 소스당 최대 50만 단어. PDF·구글문서·슬라이드·URL·유튜브·텍스트 지원, 현재 무료</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com\" target=\"_blank\" rel=\"noopener\">📓 NotebookLM 열기</a></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">[구축하는 핵심 순서] — 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>NotebookLM 접속 → <b>[새 노트북]</b> 생성</li><li>내 업무 자료(운영 지침·행정 규정·작년 기안문 등)를 소스로 업로드</li><li>질문 입력 → AI가 업로드 자료에만 근거해 답하고 <b>출처 위치를 인용</b>으로 표시</li><li>문서 내용을 마인드맵·오디오 개요(팟캐스트)·FAQ 등으로 자동 정리·활용</li></ol></div></div></li><li class=\"item-detail coll\" id=\"d3-4-2\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📝 노트북LM 예시 ① — 작년 기안문 마스터 AI<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">작년 결재 문서와 운영 지침만 넣어두면, “작년 기안문 참고해서 올해 ○○ 계획서 써줘” 한마디에 <b>예산 과목·법령 근거까지 반영한 초안</b>을 몇 초 만에 만들어 줍니다.</div><ol class=\"steps\"><li><b>‘전임자 파일 찾기’의 종말</b> — 옛날 파일(K-에듀파인·USB·공유폴더) 뒤지던 시간 절약</li><li><b>기안문 교정 스트레스 해소</b> — AI가 초안을 행정실 스타일(법령 근거·서식)로 1차로 잡아줌</li><li><b>감사 대비·규정 준수</b> — 검증된 우리 부서 자료 안에서만 답을 찾아 정확도 상승</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com/notebook/4937ceff-a1bd-49ae-812d-a89aa54637ae\" target=\"_blank\" rel=\"noopener\">📓 예시 노트북 열어보기 — 작년 기안문 마스터</a></div><img class=\"a3-img\" src=\"ai3img/notebooklm-guide.png\" alt=\"notebooklm-guide.png\" loading=\"lazy\"><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📋 학교 행정실 맞춤형 공문서 작성 프롬프트 (6종) — 복사해서 실습<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"pc-label\">1 · 사후조치 — 시설물 파손·변상 요청</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">업로드된 6번 기안문의 ‘허가 조건’을 참고해 줘. ‘지역 배드민턴 동호회’가 지난 토요일 체육관 대관 중 ‘출입문 유리창 및 네트 지주대’를 파손했어. 학교 시설 개방 조례를 근거로, 원상복구를 요구하는 내부 결재용 기안문과 외부 단체 발송용 공문(시행문) 초안을 분리해서 작성해 줘. 5월 25일까지 조치 기한과 미이행 시 허가 취소 불이익을 포함해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">2 · 관재 — 불용 처리 및 신규 구매 동시</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">올해 ‘노후 교육용 태블릿 PC 30대’를 불용 처리하고 ‘최신형 노트북 30대’를 새로 사려고 해. 10번 기안문을 참고해 태블릿 폐기 계획안을, 5번 기안문을 참고해 대당 80만 원 신규 노트북 구매 계획 기안문을 각각 분리해서 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">3 · 예산/행정 — 기존 계획 답습·조정</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">3번 기안문(학교운영위원회 개최 공고)을 참고해 줘. 이번 제251회 임시회에서는 ‘2026학년도 제2차 추가경정 예산(안)’을 심의해. 지난 1차보다 예산 10% 증액, ‘교육환경 개선비’ 비중을 대폭 높인 내용을 주요 안건으로 포함해 임시회 개최 공고 기안문 초안을 새로 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">4 · 구매 — 반복되는 물품 구매</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">5번 기안문(학교 물품 구매 보고)을 참고해 줘. 올해는 ‘과학실 학생용 태블릿 PC 20대’, 대당 50만 원, 예산 과목은 ‘학교회계-정보화교육-자산취득비’야. 기존과 동일한 법령을 근거로 기안문 초안을 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">5 · 행정/안전 — 점검 결과를 기안문으로</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">8번 기안문(학교 환경위생 측정 결과) 형식을 참고해 ‘2026학년도 하반기 정기 공기질 측정 결과 보고’ 기안문을 써줘. 모든 교실 ‘적합’이지만 ‘과학실 이산화탄소 수치가 다소 높아 환기 지도 필요’를 유지 관리 부분에 반영해 초안을 잡아줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">6 · 복무/수당 — 규정 준수 사전 검토</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">2번 기안문(교육공무직원 연장근무 명령)을 참고해 줘. 학부모 총회 준비로 교무실무사 2명에게 주말(토) 5시간 연장근무를 명령하려고 해. 근로기준법상 주 52시간 제한, 휴일 연장근무 가산율(1.5배)에 맞게 수당 산출 내역을 포함해 기안문 초안을 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></div></li><li class=\"item-detail coll coll-green\" id=\"d3-4-3\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🗄️ 노트북LM 예시 ② — 스마트 행정 아카이브<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">‘기안문 마스터’가 글을 대신 써주는 <b>손발</b>이라면, ‘스마트 행정 아카이브’는 흩어진 규정·매뉴얼·지침을 1초 만에 찾아 근거까지 짚어주는 <b>두뇌</b>입니다.</div><ol class=\"steps\"><li><b>“지침서가 법전보다 두꺼운데”</b> — 수백 페이지를 Ctrl+F로 헤매던 탐색 시간 제거</li><li><b>“징계 감액 비율이 어떻게 되더라?”</b> — 복잡한 규정도 근거·출처(페이지)까지 짚어줌</li><li><b>업무 인수인계·신규 자립 지원</b> — 아카이브 링크 하나로 신규도 고난도 급여·복무 처리</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com/notebook/1a9c3f2b-955d-4edb-8f17-84f uot;네, 선생님. 문의하신 규정을 찾아보았습니다.&quot;와 같이 동료를 존중하는 서두로 시작하십시오.<br>2. 답변의 원칙<br>- 철저한 팩트 체크: 외부 지식이나 추측을 섞지 말고, 오직 현재 노트북의 &#x27;소스&#x27; 탭 파일 내용으로만 답변하십시오.<br>- 가독성 중심: 복잡한 절차나 조건은 번호·표(Table) 형식으로 한눈에 정리하십시오.<br>- 정보 부재 시: &quot;죄송합니다, 선생님. 현재 규정집 내에서는 해당 내용을 확인할 수 없습니다.&quot;라고 정중히 안내하십시오.<br>3. 고정 출력 양식 (답변 하단 필수)<br>모든 답변 후 구분선을 긋고 아래를 기재하십시오.<br>- 참조 규정: [정확한 규정 명칭 및 조항]<br>- 근거 파일: [파일명]<br>- 💡 행정비서의 한마디: [실무 조언이나 &quot;오늘도 힘내세요!&quot; 같은 격려 1~2문장]</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com\" target=\"_blank\" rel=\"noopener\">📓 NotebookLM 열기</a></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>채팅창 우측 상단 <b>채팅 설정(⚙️)</b> → <b>[맞춤]</b> 선택 → 위 지침 입력 → <b>[저장]</b></li></ol><img class=\"a3-img\" src=\"ai3img/notebook-instruction-set.png\" alt=\"notebook-instruction-set.png\" loading=\"lazy\"></div></div></li><li class=\"item-detail coll coll-green\" id=\"d3-5-3\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🎨 디자인 프롬프트 예시<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">시각자료를 만들 때, 프롬프트 끝에 <b>스타일 키워드</b>를 붙이면 분위기가 확 바뀝니다.</div><div class=\"a3-tip\">💡 사용법 — “…를 <b>[칠판 스타일(교육용 슬라이드)]</b>로 만들어줘”처럼 원하는 키워드를 프롬프트 끝에 덧붙이세요. <span style=\"color:#8A6D1A\">(아래 키워드를 클릭하면 복사됩니다)</span></div><div class=\"kw-wrap\"><span class=\"kw-chip\" onclick=\"copyKw(this)\">페이퍼 컷아웃 아트 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">포토리얼리스틱 매크로 레고 디오라마</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">SaaS 대시보드 인포그래픽</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">환상적인 수채화</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">화이트보드 전략 회의형 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">핸드드로잉 노트북 필기</span><span class=\"kw-chip\" onclick=\
