<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AI 스마트도구 활용법 · 교육공무직원 역량향상과정</title>
<style>
 :root{--blue:#bfa05f;--blue-d:#8a6d2e;--green:#bfa05f;--ink:#1f2733;--line:#e3e8f0;--bg:#f4f6fb;--muted:#6b7688;}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:20px;line-height:1.95;}
 .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px;}
 header.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#121a2e 0%,#1c2842 55%,#243356 100%);color:#eef2f9;padding:32px 24px;border-radius:0 0 18px 18px;border-bottom:2px solid rgba(201,168,76,.55);box-shadow:0 6px 22px rgba(10,18,40,.32);}
 header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%);pointer-events:none;}
 header.top>*{position:relative;z-index:1;}
 header.top .kicker{font-size:15px;letter-spacing:.10em;color:#cdb478;margin:0 0 9px;font-weight:700;}
 header.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.01em;color:#e4c778;text-shadow:0 1px 10px rgba(201,168,76,.18);}
 header.top .sub{margin:11px 0 0;font-size:17px;color:#c3cde0;}
 .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px;}
 .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
 .tab:hover:not(.active){border-color:#9aa4b5;}
 .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(30,50,90,.18);}
 .tab.active[data-tab="home"]{background:#1c2842;border-color:#1c2842;}
 .tab.active[data-tab="1"]{background:#4a6a9c;border-color:#4a6a9c;}
 .tab.active[data-tab="2"]{background:#8a6d2e;border-color:#8a6d2e;}
 .tab.active[data-tab="3"]{background:#6f5c9c;border-color:#6f5c9c;}
 .tab.active[data-tab="4"]{background:#a8842f;border-color:#a8842f;}
 .tab.active[data-tab="5"]{background:#9c5f74;border-color:#9c5f74;}
 .tab.active[data-tab="gift"]{background:linear-gradient(135deg,#c9a84c,#a8842f);border-color:#a8842f;color:#fff;}
 .tab .tab-date{font-size:13px;font-weight:600;opacity:.75;margin-left:3px;}
 .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:0 2px 10px rgba(20,40,90,.05);min-height:340px;}
 .s-title{font-size:33px;margin:2px 0 6px;color:var(--blue-d);font-weight:800;line-height:1.35;}
 .s-sub{margin:0 0 16px;color:var(--muted);font-size:20.5px;}
 .s-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:18px;color:#3c4652;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:8px;}
 h3.blk{font-size:23px;margin:52px 0 18px;padding-left:13px;border-left:5px solid var(--green);}
 .block{border:1px solid var(--line);border-radius:12px;margin-bottom:64px;overflow:hidden;}
 .block-head{display:flex;align-items:center;gap:12px;background:#faf7ef;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s;}
 .block-head:hover{background:#e3ebf9;}
 .block.open .block-head{background:#dfe9fb;border-bottom:1px solid #cdddf5;}
 .block-n{background:var(--blue);color:#fff;font-size:16px;font-weight:800;border-radius:6px;padding:5px 12px;white-space:nowrap;}
 .block-t{font-weight:800;font-size:21px;color:var(--blue-d);flex:1;line-height:1.4;}
 .block-h{font-size:14px;color:var(--muted);font-weight:700;}
 .chev{font-size:20px;color:var(--blue);font-weight:900;transition:transform .2s;line-height:1;}
 .block.open .chev{transform:rotate(180deg);}
 .block-body{display:none;}
 .block.open .block-body{display:block;}
 .block-ul{margin:0;padding:20px 22px 8px 40px;} .block-ul li{margin:16px 0;font-size:19px;line-height:1.75;}
 .item-detail{margin:26px 0;} .item-label{font-weight:800;color:var(--ink);}
 .item-detail.coll{margin:46px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(40,60,100,.09);}
 .item-detail.coll:first-child{margin-top:20px;}
 .item-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:15px 16px;background:#f7f9fd;font-size:19.5px;}
 .item-toggle:hover{background:#faf7ef;}
 .item-detail.coll.open .item-toggle{background:#faf7ef;border-bottom:1px solid var(--line);}
 .item-toggle .ichev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .2s;}
 .item-detail.coll.open .ichev{transform:rotate(180deg);}
 .item-detail.coll .item-body{display:none;padding:6px 14px 10px;}
 .item-detail.coll.open .item-body{display:block;}
 .item-detail.coll-green{border-color:#e4d9b8;}
 .item-detail.coll-green .item-toggle{background:#f7f2e7;}
 .item-detail.coll-green .item-toggle:hover{background:#dff3e8;}
 .item-detail.coll-green.open .item-toggle{background:#dff3e8;border-bottom-color:#e4d9b8;}
 .item-detail.coll-green .item-body{background:#f6fcf9;}
 .item-detail.coll-red{border-color:#f3c4c0;}
 .item-detail.coll-red .item-toggle{background:#fdecec;}
 .item-detail.coll-red .item-toggle:hover{background:#fbdedd;}
 .item-detail.coll-red.open .item-toggle{background:#fbdedd;border-bottom-color:#f3c4c0;}
 .item-detail.coll-red .item-body{background:#fffafa;}
 .steps{margin:12px 0 6px;padding-left:26px;counter-reset:st;}
 .steps li{margin:12px 0;font-size:18px;line-height:1.75;color:#33404f;}
 .item-note{margin:8px 0 2px;font-size:16px;color:#8a94a4;}
 .item-lead{margin:4px 0 10px;font-size:18px;line-height:1.75;color:#33404f;}
 /* roomy: 특정 차시만 간격 넓게 — 내용 바뀔때 2줄+, 큰주제 바뀔때 5줄+ */
 .block.roomy .steps li{margin:46px 0;}
 .block.roomy .steps{margin:26px 0 14px;}
 .block.roomy .item-lead{margin:8px 0 32px;}
 .block.roomy .item-note{margin:40px 0 6px;}
 .block.roomy .item-body{padding:20px 16px 28px;}
 .block.roomy .item-detail.coll{margin:58px 0;}
 .block.roomy .item-detail.coll:first-child{margin-top:22px;}
 .block.roomy .item-detail.coll.open{margin-bottom:120px;}
 .img-slot{border:2px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:26px 16px;text-align:center;color:#8a94a4;font-size:14.5px;margin:10px 0;}
 .img-slot b{display:block;color:#5b6472;font-size:16px;margin-bottom:4px;}
 .doc-img{display:block;max-width:100%;height:auto;margin:14px 0 60px;border:1px solid #e3e8f0;border-radius:12px;box-shadow:0 3px 12px rgba(40,60,100,.10);}
 .setup{margin:8px 0 40px;border:1px solid #d9c9a0;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(40,60,100,.08);}
 .setup-head{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1c2842,#2a3a60);color:#e4c778;padding:17px 20px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;flex-wrap:wrap;}
 .setup-head .setup-sub{font-size:14.5px;font-weight:600;color:#b7c2d6;}
 .setup-head .chev{margin-left:auto;color:#e4c778;transition:transform .2s;}
 .setup.open .setup-head .chev{transform:rotate(180deg);}
 .setup-body{display:none;padding:20px 22px;background:#fbfcfe;}
 .setup.open .setup-body{display:block;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .step{border:1px solid #e6ddc3;border-left:4px solid #c9a84c;border-radius:10px;padding:16px 18px 18px;margin:46px 0;background:#fff;}
 .step.step-red{background:#fff5f5;border-color:#f3c4c0;border-left-color:#e05a4a;}
 .step-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#c9a84c,#a8842f);padding:4px 12px;border-radius:20px;margin-bottom:10px;}
 .step-title{font-size:19px;font-weight:800;color:#1f2733;margin-bottom:12px;line-height:1.4;}
 .step-lead{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#3a4250;}
 .click-here{font-size:15px;font-weight:800;color:#c0392b;}
 .mini-toggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#f2f5fb;border:1px solid #dbe4f1;color:#3a4250;border-radius:8px;padding:9px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
 .mini-toggle:hover{border-color:#c9a84c;}
 .mini-toggle .mchev{color:#a8842f;font-size:14px;}
 .mini-body{display:none;margin-top:12px;font-size:16px;line-height:1.75;color:#3a4250;}
 .mini-body.show{display:block;}
 .mini-body ul{margin:8px 0 0;padding-left:22px;} .mini-body li{margin:6px 0;} .mini-body p{margin:0 0 8px;}
 .warn{background:#fff5f5;border:1px solid #f3c4c0;border-radius:8px;padding:11px 14px;color:#a5372f;font-size:15.5px;line-height:1.7;margin-top:12px;}
 .game-flip{margin:36px 0 90px;perspective:1000px;}
 .game-cover{cursor:pointer;border-radius:18px;padding:44px 24px;text-align:center;color:#fff;box-shadow:0 8px 26px rgba(40,60,100,.2);transition:transform .2s;position:relative;overflow:hidden;}
 .game-cover:hover{transform:translateY(-4px);}
 .game-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);pointer-events:none;}
 .game-cover.cov1{background:linear-gradient(140deg,#3b6fe0,#7a5cf0);}
 .game-cover.cov2{background:linear-gradient(140deg,#f0902a,#e0542a);}
 .cover-badge{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.22);padding:5px 15px;border-radius:20px;margin-bottom:12px;}
 .cover-emoji{font-size:66px;line-height:1;margin:6px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));}
 .cover-title{font-size:27px;font-weight:900;margin-bottom:12px;}
 .cover-hint{font-size:16.5px;font-weight:800;opacity:.96;}
 .game-content{display:none;}
 .game-flip.flipped .game-cover{display:none;}
 .game-flip.flipped .game-content{display:block;animation:flipin .5s ease;}
 .game-content .game.arcade{margin:0;}
 @keyframes flipin{0%{transform:perspective(900px) rotateY(-90deg);opacity:0}100%{transform:perspective(900px) rotateY(0);opacity:1}}
 .level-row{display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap;}
 .level-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:12px;padding:10px 18px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .level-btn:hover{background:#e4e9f3;}
 .level-btn.active{background:linear-gradient(135deg,#3b6fe0,#7a5cf0);color:#fff;box-shadow:0 3px 10px rgba(90,92,240,.28);}
 .g1-src{display:none;width:100%;min-height:110px;padding:14px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:16.5px;font-family:inherit;line-height:1.7;margin-bottom:14px;resize:vertical;background:#fbfdff;}
 .g1-src:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .g1-inst{font-size:18px !important;background:linear-gradient(135deg,#f7f2e7,#e3ecfb) !important;border-color:#b9cdef !important;color:#1f3a68 !important;}
 .cap-emoji-only{justify-content:center;}
 .cap-emoji-only .cap-emoji{font-size:96px;}
 .game.arcade{position:relative;border:0;border-radius:18px;padding:26px 24px;margin:24px 0;background:linear-gradient(160deg,#ffffff,#f5f8fd);box-shadow:0 8px 26px rgba(40,60,100,.13);overflow:hidden;}
 .game.arcade::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#bfa05f);}
 .arcade-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px;}
 .arcade-badge{font-size:13px;font-weight:900;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#1c2842,#3b4d78);padding:5px 13px;border-radius:8px;box-shadow:0 2px 6px rgba(28,40,66,.25);}
 .arcade-title{font-size:23px;font-weight:900;color:#1f2733;}
 .arcade-keys{margin-left:auto;}
 .game-desc{margin:2px 0 18px;font-size:16.5px;line-height:1.75;color:#3a4250;}
 .game-hint{font-size:14.5px;font-weight:600;color:#6b7688;}
 .mode-row{display:flex;gap:8px;margin:2px 0 18px;}
 .mode-btn{background:#eef1f7;border:2px solid transparent;color:#3a4250;border-radius:24px;padding:9px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .mode-btn:hover{background:#e4e9f3;}
 .mode-btn.active{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;box-shadow:0 3px 10px rgba(224,114,74,.3);}
 .stage-row{display:flex;align-items:center;gap:12px;margin:10px 0 20px;}
 .dots{display:inline-flex;gap:8px;}
 .dot{width:15px;height:15px;border-radius:50%;background:#dfe4ee;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:.2s;}
 .dot.done{background:linear-gradient(135deg,#bfa05f,#bfa05f);}
 .dot.cur{background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.18);animation:dotpulse 1.1s infinite;}
 @keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
 .stage-label{font-size:14px;font-weight:900;color:#a8842f;letter-spacing:.03em;}
 .g1-target{background:linear-gradient(135deg,#fffdf3,#fff4d0);border:2px dashed #e0c86a;border-radius:16px;padding:24px 18px;font-size:24px;font-weight:800;color:#2a2a2a;text-align:center;margin-bottom:14px;user-select:all;box-shadow:inset 0 2px 10px rgba(224,200,106,.18);}
 .game-start{background:linear-gradient(135deg,#f59e0b,#e0724a);color:#fff;border:0;border-radius:24px;padding:13px 26px;font-size:16.5px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:12px;box-shadow:0 4px 12px rgba(224,114,74,.32);}
 .game-start:hover{filter:brightness(1.05);}
 .game-start.hidden{display:none;}
 .game-input{width:100%;padding:15px 16px;border:2px solid #cfd8e6;border-radius:12px;font-size:17px;font-family:inherit;transition:.15s;}
 .game-input:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .paste-zone{min-height:130px;border:2px dashed #b9c6de;border-radius:14px;background:#fbfdff;display:flex;align-items:center;justify-content:center;text-align:center;color:#8a94a4;font-size:16px;padding:16px;cursor:text;transition:.15s;}
 .paste-zone:focus{outline:none;border-color:#f59e0b;background:#fffdf3;}
 .paste-zone img{max-width:100%;max-height:320px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.15);}
 .game-result{margin-top:20px;font-size:18px;font-weight:800;min-height:26px;}
 .game-result.big{font-size:23px;}
 .game-result.ok{color:#bfa05f;} .game-result.bad{color:#e0524a;}
 .best{margin-top:8px;font-size:15.5px;font-weight:800;color:#a8842f;}
 .game-intro{background:linear-gradient(135deg,#fff6e6,#ffeccf);border:1px solid #f2d9a8;border-radius:12px;padding:14px 18px;font-size:16.5px;color:#7a5b12;margin:4px 0 18px;font-weight:600;}
 .cap-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#f7f2e7,#e5ecfb);border:2px solid #b9cdef;border-radius:16px;padding:22px;margin-bottom:10px;box-shadow:0 4px 14px rgba(60,90,160,.12);}
 .cap-emoji{font-size:62px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));}
 .cap-lines{font-size:19px;line-height:1.6;color:#2a2a2a;font-weight:700;}
 .cap-lines .cap-ar{font-size:21px;}
 .cap-note{margin:2px 0 12px;font-size:14.5px;color:#3a4250;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:8px;padding:10px 13px;line-height:1.6;}
 .sheet-embed{width:100%;height:440px;border:1px solid #e3e8f0;border-radius:12px;margin-top:14px;background:#fff;}
 .doc-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:8px;background:#fff;}
 .padlet-embed{width:100%;height:520px;border:1px solid #e3e8f0;border-radius:12px;margin-top:12px;background:#fff;}
 .embed-note{margin:10px 0 2px;font-size:14.5px;color:#6b7688;line-height:1.6;}
 @media(max-width:560px){.cap-card{flex-direction:column;text-align:center;}.sheet-embed{height:360px;}.doc-embed{height:440px;}.arcade-keys{margin-left:0;width:100%;}}
 .gkeys{margin:6px 0 16px !important;max-width:540px;}
 .faces-btn{margin-top:-44px !important;margin-bottom:52px !important;}
 .check-list{margin:8px 0 4px;display:flex;flex-direction:column;gap:9px;}
 .check-item{background:#f7f2e7;border:1px solid #e4d9b8;border-radius:10px;padding:12px 15px;font-size:16.5px;color:#166b47;font-weight:600;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#33404f;background:#f7f2e7;border:1px solid #d7e5fb;border-radius:10px;padding:14px 16px;}
 .tab.active[data-tab="setup"]{background:linear-gradient(135deg,#2a3a60,#1c2842);border-color:#1c2842;color:#e4c778;}
 .tab.active[data-tab="warmup"]{background:linear-gradient(135deg,#e0724a,#d1522a);border-color:#d1522a;color:#fff;}
 .block-body a:not(.copy-btn){color:var(--blue);font-weight:700;word-break:break-all;}
 .copy-btn{display:inline-flex;align-items:center;gap:8px;margin:48px 0 22px;background:#bfa05f;color:#fff !important;text-decoration:none;font-weight:800;font-size:18px;padding:14px 24px;border-radius:10px;box-shadow:0 2px 8px rgba(26,158,106,.25);}
 .copy-btn:hover{background:#8a6d2e;}
 .cta-desc{margin:0 0 12px;font-size:16px;line-height:1.7;color:#48525f;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:13px 16px;}
 .link-btn{display:inline-flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--blue);color:#fff !important;text-decoration:none;font-weight:800;font-size:17.5px;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(26,79,180,.22);}
 .link-btn:hover{background:var(--blue-d);}
 .prompt-wrap{margin:22px 0 6px;border:1px solid #dbe4f1;border-radius:10px;overflow:hidden;}
 .prompt-head{font-weight:800;color:var(--blue-d);font-size:18px;padding:14px 16px;background:#faf7ef;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;}
 .prompt-head:hover{background:#e3ebf9;}
 .pchev{margin-left:auto;font-size:18px;color:var(--blue);transition:transform .2s;}
 .prompt-wrap.open .pchev{transform:rotate(180deg);}
 .prompt-body{display:none;padding:8px 14px 14px;}
 .prompt-wrap.open .prompt-body{display:block;}
 .prompt-inline{margin:12px 0 4px;}
 .tip-wrap{padding:0 !important;overflow:hidden;}
 .tip-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:14px 18px;font-weight:800;}
 .tip-head:hover{filter:brightness(.98);}
 .tip-wrap .pchev{margin-left:auto;color:#d98a12;}
 .tip-body{display:none;padding:0 18px 16px;}
 .tip-wrap.open .tip-body{display:block;}
 .prompt-card{display:flex;align-items:center;gap:12px;background:#f7f9fc;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px;margin:12px 0;}
 .prompt-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
 .prompt-text{flex:1;font-size:18px;line-height:1.6;color:var(--ink);}
 .pcopy{flex:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:800;font-size:16px;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;}
 .pcopy:hover{background:var(--blue);color:#fff;}
 .pcopy.done{background:var(--green);border-color:var(--green);color:#fff;}
 @media(max-width:560px){.prompt-card{flex-wrap:wrap}.pcopy{width:100%}}
 .concept{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:18px 22px;margin:8px 0 30px;font-size:18.5px;line-height:1.85;}
 .practice{margin:44px 22px 6px;padding:14px 18px;background:#f7f2e7;border-left:5px solid #bfa05f;border-radius:8px;font-size:18px;line-height:1.75;}
 .tip{margin:36px 22px 20px;padding:13px 18px;background:#fff5e9;border-left:5px solid #d98a12;border-radius:8px;font-size:17px;color:#7a5b12;line-height:1.7;}
 .practice b,.tip b{margin-right:6px;}
 .files-ul{margin:8px 0 0;padding-left:24px;} .files-ul li{margin:9px 0;font-size:18px;line-height:1.6;}
 .fill-box{margin-top:52px;border:1.5px dashed #b9c6de;border-radius:12px;background:#fbfdff;padding:22px 22px;}
 .fill-title{font-weight:800;color:var(--blue-d);font-size:18px;margin-bottom:6px;}
 .fill-desc{margin:0;font-size:17.5px;color:var(--muted);line-height:1.7;}
 .home-lead{background:#eef6ff;border:1px solid #d3e6fb;border-radius:12px;padding:20px 22px;margin:4px 0 30px;font-size:19px;line-height:1.8;}
 .day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
 .day-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;transition:.18s ease;box-shadow:0 2px 10px rgba(40,60,100,.07),inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden;}
 .day-card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;transition:.5s ease;pointer-events:none;}
 .day-card:hover{box-shadow:0 12px 26px rgba(30,50,90,.17),inset 0 1px 0 rgba(255,255,255,.7);transform:translateY(-3px);}
 .day-card:hover::after{opacity:.9;left:120%;}
 .dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
 .dc-no{font-size:16.5px;font-weight:800;color:var(--blue);}
 .dc-date{font-size:15px;color:var(--muted);}
 .dc-title{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.4;}
 .dc-sub{font-size:16.5px;color:var(--muted);line-height:1.55;min-height:44px;}
 .dc-badge{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;}
 .badge-open{background:#e7f7ee;color:#8a6d2e;border:1px solid #e4d9b8;}
 .badge-lock{background:#f1f3f7;color:#8a94a4;border:1px solid #e0e5ee;}
 .day-card.locked .dc-title{color:#5b6472;}
 .day-card.d1{background:linear-gradient(135deg,#eef1f7 0%,#dbe3ef 60%,#c6d3e6 100%);border-color:#adbcd4;border-left:5px solid #4a6a9c;}
 .day-card.d1 .dc-no{color:#3f5c88;}
 .day-card.d2{background:linear-gradient(135deg,#eef4ef 0%,#dae7de 60%,#c4d8ca 100%);border-color:#aac2b3;border-left:5px solid #8a6d2e;}
 .day-card.d2 .dc-no{color:#8a6d2e;}
 .day-card.d3{background:linear-gradient(135deg,#f1eef7 0%,#e2dbee 60%,#cfc4e2 100%);border-color:#bcb0d6;border-left:5px solid #6f5c9c;}
 .day-card.d3 .dc-no{color:#5f4d8a;}
 .day-card.d4{background:linear-gradient(135deg,#f6f0e4 0%,#ece0c7 60%,#ddcca6 100%);border-color:#cbb890;border-left:5px solid #a8842f;}
 .day-card.d4 .dc-no{color:#8a6a25;}
 .day-card.d5{background:linear-gradient(135deg,#f5eef1 0%,#e9dae0 60%,#d8bfc9 100%);border-color:#cbafba;border-left:5px solid #9c5f74;}
 .day-card.d5 .dc-no{color:#844f63;}
 .day-card.dgift{background:linear-gradient(135deg,#efe4c2 0%,#dcc689 50%,#c9a84c 100%);border-color:#b8912f;border-left:5px solid #a8842f;}
 .day-card.dgift .dc-no{color:#6e5518;}
 .day-card.dgift .dc-title,.day-card.dgift .dc-sub,.day-card.dgift .dc-date{color:#54410f;}
 .lock-screen{text-align:center;padding:44px 16px;}
 .lock-screen .big{font-size:60px;margin-bottom:10px;}
 .lock-screen h2{font-size:27px;margin:0 0 8px;color:var(--blue-d);line-height:1.4;}
 .lock-screen p{color:var(--muted);font-size:18.5px;margin:0 0 24px;}
 .pw-row{display:flex;gap:10px;justify-content:center;max-width:400px;margin:0 auto;}
 .pw-row input{flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;}
 .pw-row input:focus{outline:none;border-color:var(--blue);}
 .pw-row button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:15px 26px;font-size:18px;font-weight:700;cursor:pointer;}
 .pw-row button:hover{background:var(--blue-d);}
 .pw-err{color:#c0392b;font-size:16px;margin-top:14px;min-height:20px;}
 .backhome{display:inline-block;margin-bottom:18px;font-size:17px;color:var(--blue);cursor:pointer;font-weight:700;}
 footer{margin-top:34px;text-align:center;color:var(--muted);font-size:14px;}
 .admin-hint{margin-top:10px;font-size:14px;color:#9aa6b6;}
 .gift-table{width:100%;border-collapse:collapse;font-size:18px;margin:6px 0 10px;}
 .gift-table th,.gift-table td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;}
 .gift-table th{background:#faf7ef;font-weight:800;color:var(--blue-d);}
 .gift-table td:first-child{white-space:nowrap;}
 kbd{display:inline-block;background:#1f2733;color:#fff;border-radius:6px;padding:5px 11px;font-size:16px;font-weight:700;font-family:inherit;white-space:nowrap;}
 .gift-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:6px 0 10px;}
 .gift-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:#fff;transition:.15s;}
 .gift-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(20,50,120,.08);}
 .gc-emoji{font-size:24px;flex:none;}
 .gc-body{display:flex;flex-direction:column;flex:1;min-width:0;}
 .gc-title{font-weight:800;color:var(--ink);font-size:17.5px;line-height:1.35;}
 .gc-url{color:var(--muted);font-size:15px;word-break:break-all;}
 .gc-ext{color:var(--blue);font-size:18px;flex:none;font-weight:800;}
 .gem-intro{background:#eef6ff;border:1px solid #d3e6fb;border-radius:10px;padding:14px 16px;font-size:17.5px;line-height:1.75;margin:6px 0 14px;}
 .gem-step{display:flex;gap:14px;align-items:flex-start;margin:14px 0;font-size:18px;line-height:1.7;}
 .gem-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
 .gem-note{margin-top:16px;background:#fff8e8;border:1px solid #f0dfae;border-radius:10px;padding:14px 16px;font-size:17px;color:#7a5b12;line-height:1.75;}
 h3.gift-blk{margin-top:96px;}
 h3.gift-blk:first-of-type{margin-top:48px;}
 .gift-closing{margin-top:96px;text-align:center;background:#f7f2e7;border:1px solid #e4d9b8;border-radius:14px;padding:28px 20px;font-size:18.5px;line-height:1.85;color:#166b47;}
 .gift-closing .gc-icon{font-size:42px;margin-bottom:6px;}
 .instructor{margin:2px 0 96px;}
 .ins-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#141d33 0%,#1e2b4a 60%,#26365c 100%);border:1px solid #33436a;border-top:3px solid #c9a84c;border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(12,20,44,.22);}
 .ins-banner::after{content:"";position:absolute;top:-40%;right:-4%;width:36%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0),rgba(201,168,76,.16) 50%,rgba(255,255,255,0));transform:skewX(-16deg);pointer-events:none;}
 .ins-kicker{position:relative;z-index:1;font-size:13px;letter-spacing:.14em;color:#cdb478;font-weight:800;margin-bottom:8px;}
 .ins-name{position:relative;z-index:1;font-size:28px;font-weight:800;color:#e4c778;line-height:1.15;}
 .ins-name span{font-size:17px;color:#aeb9cf;font-weight:600;margin-left:9px;font-style:italic;}
 .ins-chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;}
 .ins-chip{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#dce4f1;border-radius:22px;padding:8px 15px;font-size:14.5px;font-weight:600;}
 .ins-chip b{color:#e4c778;}
 .ins-div{position:relative;z-index:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),rgba(201,168,76,0));margin:18px 0;}
 .ins-contact{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;}
 .ins-pill{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#e4c778 !important;border-radius:22px;padding:9px 16px;font-size:15px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
 .ins-pill:hover{background:rgba(201,168,76,.16);}
 .ins-cta{background:linear-gradient(135deg,#e0c375,#c9a84c);border-color:#c9a84c;color:#1c2842 !important;}
 .ins-cta:hover{filter:brightness(1.05);background:linear-gradient(135deg,#e7ce86,#d0af52);}
 .ins-toggle{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e6ddc3;border-radius:12px;padding:15px 20px;font-size:16.5px;font-weight:800;color:#3a4250;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(40,60,100,.06);transition:.15s;}
 .ins-toggle:hover{border-color:#c9a84c;}
 .ins-plus{color:#c9a84c;font-size:22px;font-weight:800;line-height:1;transition:transform .2s;}
 .instructor.open .ins-plus{transform:rotate(45deg);}
 .ins-tag{margin-left:auto;font-size:13px;font-weight:800;color:#a8842f;background:#f7edcf;border:1px solid #eaddb0;border-radius:16px;padding:5px 12px;}
 .ins-more{display:none;}
 .instructor.open .ins-more{display:block;}
 .ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 34px;margin-top:12px;background:linear-gradient(140deg,#141d33,#1e2b4a 60%,#243356);border:1px solid #33436a;border-radius:14px;padding:24px 26px;}
 .ins-col.ins-wide{grid-column:1 / -1;}
 .ins-col h4{margin:0 0 10px;font-size:16px;color:#e4c778;border-bottom:1px solid #3a4a70;padding-bottom:7px;font-weight:800;}
 .ins-col ul{margin:0;padding-left:18px;}
 .ins-col li{margin:7px 0;font-size:15.5px;line-height:1.6;color:#ccd6e6;}
 .ins-col li b{color:#ecd693;font-weight:700;}
 @media(max-width:560px){.ins-grid{grid-template-columns:1fr;}.ins-col.ins-wide{grid-column:auto;}}
 @media(max-width:560px){header.top h1{font-size:26px}.panel{padding:22px 16px}.s-title{font-size:28px}.block-t{font-size:19px}.block-ul li{font-size:18px}.item-toggle{font-size:18px}.steps li{font-size:17px}.gift-table{font-size:16px}.gift-cards{grid-template-columns:1fr}}

/* ===== 마장 캘린더(cal-embed) 스코프 스타일 ===== */
.cal-embed * { margin: 0; padding: 0; box-sizing: border-box; }
.cal-embed body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #F8F9FA;
            color: #202124;
            min-height: 100vh;
            zoom: 1.6;
        }
.cal-embed .header {
            background: linear-gradient(135deg, #0d1b2a 0%, #1a2c45 60%, #0f3460 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35);
        }
.cal-embed .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 52px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
.cal-embed .logo-wrap { display: flex; align-items: center; gap: 14px; }
.cal-embed .g-dots { display: flex; gap: 5px; }
.cal-embed .g-dot {
            width: 11px; height: 11px; border-radius: 50%;
        }
.cal-embed .header-title {
            font-size: 27px; font-weight: 700; letter-spacing: -0.3px;
        }
.cal-embed .header-sub {
            font-size: 15px; opacity: 0.6; font-weight: 300; margin-top: 2px;
        }
.cal-embed .gemini-badge {
            background: linear-gradient(135deg, #bfa05f, #8B5CF6);
            padding: 7px 18px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
.cal-embed .tab-nav {
            display: flex;
            padding: 0 52px;
            overflow-x: auto;
            scrollbar-width: none;
        }
.cal-embed .tab-nav::-webkit-scrollbar { display: none; }
.cal-embed .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 15px 22px;

            border-bottom: 3px solid transparent;

            cursor: pointer;
            white-space: nowrap;

.cal-embed .tab-btn:hover { color: white; background: rgba(255,255,255,0.07); }
.cal-embed .tab-btn.active { color: white; border-bottom-color: #bfa05f; }
.cal-embed .tab-emoji { font-size: 18px; }
.cal-embed .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 44px 28px 80px;
        }
.cal-embed .tab-content { display: none; }
.cal-embed .tab-content.active {
            animation: fadeUp .3s ease;
        }
@keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
.cal-embed .section-header { margin-bottom: 32px; }
.cal-embed .s-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
.cal-embed .s-title {
            font-size: 37px;

        }

            box-shadow: 0 1px 6px rgba(0,0,0,0.08);

.cal-embed .bg-red { background: #EA4335; }

.cal-embed .t-green { background: #E6F4EA; color: #8a6d2e; }

/* ===== 골드 프리미엄 테마 (내용·토글 그대로, 외형만) ===== */

.chev,.block.open .chev{color:#B8901F;}

.foot-inq{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:800;color:#23303f;background:#f7f1e1;border:1.4px solid #d8c48f;border-radius:999px;padding:6px 16px;}

.tabs{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#c9ac66,#bfa05f);width:100vw;margin:0 calc(50% - 50vw) 16px;padding:11px 18px 9px max(14px,calc(50vw - 526px));box-shadow:0 6px 14px -8px rgba(10,18,40,.30);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;gap:7px;}

.tabs::-webkit-scrollbar-thumb{background:#c8cfdb;border-radius:3px;}
.tab{flex:0 0 auto;white-space:nowrap;padding:9px 11px;font-size:15px;gap:5px;border-radius:11px;}
.tab[data-tab="c1"]{background:#fff1f0;border:1.6px solid #e5484d;color:#c0303a;font-weight:800;}
.tab[data-tab="c1"].active{background:#e5484d;border-color:#e5484d;color:#fff;}

.mini-toggle.mt-hot{background:#fff1f0 !important;border:1.6px solid #e5484d !important;color:#c0303a !important;font-weight:800 !important;box-shadow:0 3px 10px rgba(229,72,77,.18);}
.mini-toggle.mt-hot .mchev{color:#e5484d;}
.pc-label.pcl-hot{color:#c0303a;font-weight:800;}
header.top.hero-big{position:relative;overflow:hidden;padding:60px 44px 56px;border-radius:0 0 22px 22px;
  background:radial-gradient(ellipse at 78% 16%, #2d3f58 0%, #1c2836 56%, #121a28 100%);border-bottom:3px solid #bfa05f;}
header.top.hero-big::before{display:none;}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0;}
.hero-orb.a{width:360px;height:360px;right:-70px;top:-130px;background:#2c3e57;opacity:.6;}
.hero-orb.b{width:190px;height:190px;left:-60px;bottom:-90px;background:#27374b;opacity:.55;}
.hero-ico{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#e0c778,#bfa05f);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(191,160,95,.42);margin-bottom:24px;}
.hero-ico svg{width:42px;height:42px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.hero-tag{display:inline-block;border:1px solid rgba(217,199,155,.5);color:#ecdcb2;background:rgba(255,255,255,.06);
  padding:8px 20px;border-radius:999px;font-size:18px;font-weight:700;letter-spacing:.02em;margin-bottom:20px;}
header.top .hero-h1{margin:0;font-size:clamp(30px, 5vw, 64px);white-space:nowrap;line-height:1.1;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fbeec2 0%,#ecd396 40%,#c8a865 70%,#a07f3d 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 16px rgba(191,160,95,.4));}
.hero-sub{margin:24px 0 0;font-size:21px;color:#cdd6e2;}
.hero-sub b{color:#ecdcb2;font-weight:700;}

const P={"insHtml": "<div class=\"instructor\"><div class=\"ins-banner\"><div class=\"ins-kicker\">INSTRUCTOR · 강사</div><div class=\"ins-name\">이애진 <span>Lee Ae-jin</span></div><div class=\"ins-chips\"><span class=\"ins-chip\">구글 공식 PD 파트너사 · <b>FlowDX 대표</b></span><span class=\"ins-chip\">구글 공식 트레이너 (Google Certified Trainer)</span><span class=\"ins-chip\">🎓 서울대학교 정보문화학(ICT)</span></div><div class=\"ins-div\"></div><div class=\"ins-contact\"><a class=\"ins-pill\" href=\"https://flowdx.kr\" target=\"_blank\" rel=\"noopener\">🌐 flowdx.kr</a><a class=\"ins-pill\" href=\"mailto:ai@flowdx.kr\">✉ ai@flowdx.kr</a><a class=\"ins-pill\" href=\"tel:01023198419\">☎ 010-2319-8419</a><a class=\"ins-pill ins-cta\" href=\"https://capable-tarsier-97affe.netlify.app/\" target=\"_blank\" rel=\"noopener\">🔗 프로필 보기</a></div></div><button class=\"ins-toggle\" onclick=\"this.closest('.instructor').classList.toggle('open')\"><span class=\"ins-plus\">+</span> 강사 상세 이력 보기<span class=\"ins-tag\">학력 · 경력 · 저서</span></button><div class=\"ins-more\"><div class=\"ins-grid\"><div class=\"ins-col\"><h4>🎓 학력 · 자격</h4><ul><li>서울대학교 정보문화학(ICT)</li><li>Google Certified Trainer (구글 공식 트레이너)</li><li>Gemini Certified Educator (제미나이 에듀케이터)</li><li>ADsP · 데이터 분석 준전문가</li></ul></div><div class=\"ins-col\"><h4>📰 언론 보도 · 공식 성과</h4><ul><li>중앙뉴스타임스(2025.11) · 인천시교육청 교육연수원 직무연수</li><li>인천광역시교육청(2025.12) · 초·중등 교실수업혁명 직무연수 운영</li><li>미디어투데이(2025.07) · 파주교육지원청 AI 소통 역량 강화·실무 적용</li></ul></div><div class=\"ins-col ins-wide\"><h4>🏫 교육 · 행정 혁신 주요 경력</h4><ul><li>구글 코리아 <b>제미나이 아카데미 주강사</b></li><li>전국 학교장·교감 대상 <b>AI 리터러시 리더십 연수 200회+</b></li><li>대학 교직원·교수·학생 대상 AI 행정 혁신 연수</li><li>경기도교육연구원 박사급 연구원 대상 정책연구 AI 활용 연수</li><li>5~9급 교육행정직 공무원 <b>AI 정책보고서 연수</b></li><li>한국과학창의재단 ‘찾아가는 학교컨설팅’ 코디네이터·주강사</li><li>대원외고 등 특목고 AI 연수 및 영재교육연구소 강사 양성 연수</li></ul></div><div class=\"ins-col\"><h4>💼 산업 현장 실무</h4><ul><li><b>FlowDX 대표</b> — AI 비즈니스 모델링·공공기관 DX 전환 컨설팅 총괄</li><li>Ebay·G마켓·옥션 해외 플랫폼 개발 프로젝트 기획 참여</li><li>Nexon·Ebay 등 글로벌 기업 주요 프로젝트 기획·개발</li></ul></div><div class=\"ins-col\"><h4>📚 주요 저서</h4><ul><li>『HTML, CSS, JavaScript를 배우는 마법코딩학교』</li><li>『AI시대, 보고서가 당신의 무기가 된다』</li><li>『AI 기반 문화콘텐츠 기획』</li></ul></div></div></div></div>", "setup": "<div class=\"setup-wrap\"><h2 class=\"s-title\">🛠️ 시작 전 환경 세팅</h2><p class=\"s-sub\">연수 당일, 계정 만드느라 첫 시간을 쓰지 않으려면.</p><p class=\"setup-intro\">실습에는 <b>크롬 브라우저</b>와 <b>구글 개인계정</b>이 필요합니다. 아래 <b>8단계</b>를 미리 마쳐 두시면 첫 시간부터 바로 실습에 들어갑니다.</p><div class=\"step\"><div class=\"step-badge\">STEP 1</div><div class=\"step-title\">크롬 브라우저가 없다면? 크롬 설치</div><p class=\"step-lead\">이 연수는 <b>크롬(Chrome)</b> 기준으로 진행합니다. 엣지에서는 실습 중 일부 기능이 <b>아예 나타나지 않아요.</b></p><a class=\"link-btn\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 설치하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">다운로드한 뒤 설치하는 방법 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol><li>‘크롬 설치하기’ 버튼 → 열린 화면에서 <b>‘Chrome 다운로드’</b>를 누릅니다<img class=\"doc-img\" src=\"setup-chrome-1.jpg\" alt=\"크롬 다운로드 페이지에서 Chrome 다운로드 버튼 위치\" loading=\"lazy\" style=\"max-width:640px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">빨간 네모 안의 파란 버튼을 누르세요</p></li><li>파일을 저장하는 창이 뜨면 이름은 그대로 두고 <b>‘저장’</b>을 누릅니다<img class=\"doc-img\" src=\"setup-chrome-2.jpg\" alt=\"ChromeSetup.exe 저장 창에서 저장 버튼 위치\" loading=\"lazy\" style=\"max-width:520px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">이 창이 뜨지 않고 바로 다운로드되면 다음 단계로 넘어가세요</p></li><li>화면 오른쪽 위(또는 아래)에 뜨는 <b>다운로드 표시</b>에서 <b>ChromeSetup.exe</b>를 누릅니다<img class=\"doc-img\" src=\"setup-chrome-3.jpg\" alt=\"크롬 오른쪽 위 다운로드 아이콘과 ChromeSetup.exe 위치\" loading=\"lazy\" style=\"max-width:420px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">오른쪽 위 <b>다운로드 아이콘(↓)</b>을 누르면 목록이 열려요. 안 보이면 파일 탐색기 → 다운로드 폴더에서 ChromeSetup을 더블클릭하세요</p></li><li>“이 앱이 디바이스를 변경할 수 있도록 허용하시겠어요?” 창이 뜨면 <b>‘예’</b></li><li>설치는 알아서 진행돼요. 잠시 기다리면 <b>크롬 창이 저절로</b> 열립니다</li><li>작업표시줄에 크롬이 없다면: 크롬이 열린 상태에서 아래 아이콘을 <b>마우스 오른쪽 클릭 → ‘작업 표시줄에 고정’</b></li></ol></div><div class=\"warn\" style=\"background:#F3FAF6;border-color:#CDEBDD;color:#245c48\">💡 <b>이미 크롬이 있는지 모르겠다면?</b> 윈도우 <b>시작 버튼</b>을 누르고 <b>chrome</b>을 입력해 보세요. ‘Google Chrome’이 나오면 설치할 필요가 없어요.</div></div><div class=\"step\"><div class=\"step-badge\">STEP 2</div><div class=\"step-title\">쓰시던 구글 개인계정에 로그인할 수 있는지 확인</div><p class=\"step-lead\">다음 단계에서 저장공간을 확인하려면 먼저 <b>쓰시던 개인계정으로 로그인</b>이 되어야 해요. 크롬에서 로그인이 되는지 확인해 주세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/document/d/1_QaoP-NXLLwTEMxNYzS6BBeE23NgRc3zVpjamgeSRys/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">🔑 기존 아이디·비밀번호 찾기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📷 찾는 방법 그림으로 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><img class=\"doc-img\" src=\"setup-account-find.jpg\" alt=\"구글 계정 아이디·비밀번호 찾는 방법 화면 안내\" loading=\"lazy\" style=\"max-width:760px;margin:10px 0 6px;\"></div><button class=\"mini-toggle\" style=\"margin-top:10px\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📱 휴대전화 번호로 내 구글 계정(이메일) 찾기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>“이 번호로 만든 계정이 있었던 것 같은데…” 싶을 때, <b>구글 공식 방법</b>으로 찾을 수 있어요.</p><ol><li><b>이메일 찾기 페이지 열기</b> — 구글 로그인 화면의 아이디 입력칸 아래 <b>［이메일을 잊으셨나요?］</b>를 누르거나 아래 버튼을 누르세요.<br><a class=\"link-btn\" href=\"https://accounts.google.com/signin/v2/usernamerecovery\" target=\"_blank\" rel=\"noopener\">🔍 구글 이메일 찾기</a></li><li><b>휴대전화 번호 입력</b> — 계정에 연결했던 번호를 입력하고 <b>［다음］</b> <span style=\"color:#7b8494\">(국가 번호가 <b>+82</b>인지 확인)</span></li><li><b>인증 코드 입력</b> — 휴대전화 문자로 온 <b>6자리 코드</b>를 입력합니다.</li><li><b>이름 입력 → 계정 확인</b> — 계정에 등록했던 <b>성·이름</b>을 정확히 입력하면, 그 번호로 가입된 <b>구글 이메일 목록</b>이 나타나요.</li><li><b>비밀번호가 기억 안 나면</b> — 찾은 이메일로 로그인 화면에서 <b>［비밀번호 찾기］</b> → 휴대전화 인증 후 새 비밀번호를 설정하세요.<br><a class=\"link-btn\" href=\"https://accounts.google.com/signin/recovery\" target=\"_blank\" rel=\"noopener\">🔑 구글 비밀번호 찾기(계정 복구)</a></li></ol><p style=\"color:#7b8494\">💡 이름은 가입할 때 적은 그대로(성·이름 칸 구분)여야 찾아져요. 번호를 바꾼 뒤 계정에 새 번호를 등록하지 않았다면 이 방법으로는 찾기 어려워요.</p></div><div class=\"warn\">❌ <b>기관계정(goedu 등)</b>으로는 제미나이 등 일부 AI 실습이 막힐 수 있어요. 실습은 반드시 <b>개인계정</b>으로 진행합니다.</div></div><div class=\"step\"><div class=\"step-badge\">STEP 3</div><div class=\"step-title\">그 계정의 드라이브 저장공간 확인</div><div class=\"warn\">⚠️ <b>쓰시던 계정은 드라이브가 가득 찬 경우가 많아요.</b> 구글 포토에 휴대폰 사진이 자동 백업되면서 저장공간을 다 쓰면, 연수 중 실습이 <b>아예 되지 않습니다.</b></div><a class=\"link-btn\" href=\"https://drive.google.com/drive/u/0/quota\" target=\"_blank\" rel=\"noopener\">💾 내 저장공간 확인하기</a><div class=\"check-list\" style=\"margin:3em 0\"><div class=\"check-item\">✅ <b>여유가 넉넉하다면</b> — 대략 <b>5GB 이상</b> 남아 있으면 이 계정으로 실습하세요. STEP 4는 건너뛰세요.</div><div class=\"check-item\">🆕 <b>거의 다 찼다면</b> — STEP 4에서 <b>연수용 새 계정</b>을 하나 만들어 오세요. <b>사진은 지우지 않으셔도 됩니다.</b></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">드라이브가 꽉 차면 왜 실습이 안 되나요? · 사진 정리는?<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>휴대폰 사진이 구글 포토에 자동 백업되면서 저장공간(15GB)을 다 쓰고 계신 분이 많습니다. 저장공간이 없으면 연수에서 자료를 만드실 때 <b>에러</b>가 납니다. 사진을 지우실 필요 없이, <b>연수용 계정</b>을 하나 새로 만들어 오시면 됩니다.</p><p>💡 사진을 정리하고 싶으시다면 구글 포토에서만 지우고 휴대폰에는 남기는 방법이 있어요. 다만 <b>휴대폰 백업을 끈 상태</b>를 유지해야 하고, 백업을 다시 켜면 사진이 다시 올라가거나 휴대폰 사본이 지워질 수 있어요. 지운 사진은 휴지통에 30일간 남아 있어요. <b>연수 준비로 하실 필요는 없고</b>, 여유 있을 때 공식 안내를 보며 천천히 해 주세요.</p><a class=\"link-btn\" href=\"https://photos.google.com/storage\" target=\"_blank\" rel=\"noopener\">📸 구글 포토 저장용량 관리 — 사진 정리하기</a> <a class=\"link-btn\" href=\"https://support.google.com/photos/answer/6128858?co=GENIE.Platform%3Dandroid&oco=1\" target=\"_blank\" rel=\"noopener\">🔗 구글 포토 공식 안내: 사진 삭제하기</a></div></div><div class=\"step step-red\"><div class=\"step-badge\">STEP 4</div><div class=\"step-title\">저장공간이 부족한 분만 — 새 구글 계정 만들기</div><p class=\"step-lead\">STEP 3에서 <b>저장공간이 거의 다 찼던 분만</b> 해 주세요. 여유가 넉넉했다면 넘어가시면 됩니다.</p><div class=\"warn\">📅 <b>가입할 때 생년월일을 정확히</b> 입력해 주세요. 잘못 입력해 <b>미성년자로 등록되면 제미나이를 쓸 수 없고</b>, 되돌리려면 신분증 등으로 연령 확인을 해야 할 수 있어요.</div><a class=\"link-btn\" href=\"https://accounts.google.com/signup\" target=\"_blank\" rel=\"noopener\">✏️ 새로운 구글 계정 만들기</a><details class=\"cap-help signup-help\" style=\"margin-top:10px;\"><summary>📷 구글 계정 만들기 — 화면 따라 하기 (15단계)</summary><div class=\"cap-help-body\"><p style=\"margin:6px 0 10px\">위 버튼을 누르면 아래 화면이 차례대로 나옵니다. 눈에 보이는 대로만 따라오시면 돼요.</p><ol class=\"signup-ol\"><li><b>성·이름 입력</b> — 성은 <b>선택사항</b>이라 이름만 적어도 됩니다.<img class=\"doc-img\" src=\"signup-1.png\" alt=\"구글 계정 만들기 – 성과 이름 입력 화면\" loading=\"lazy\"></li><li><b>기본 정보</b> — 생년월일과 성별을 고릅니다. <b style=\"color:#C0392B\">생년월일은 꼭 정확하게!</b> 잘못 넣어 미성년자로 등록되면 제미나이를 쓸 수 없어요.<img class=\"doc-img\" src=\"signup-2.png\" alt=\"구글 계정 만들기 – 생년월일·성별 입력 화면\" loading=\"lazy\"></li><li><b>이메일 주소 만들기</b> — 구글이 <b>추천해 준 주소</b> 중 하나를 고르는 게 가장 편합니다.<img class=\"doc-img\" src=\"signup-3.png\" alt=\"구글 계정 만들기 – 추천 이메일 주소 선택 화면\" loading=\"lazy\"></li><li><b>직접 만들고 싶다면</b> — ［내 Gmail 주소 만들기］에 원하는 주소를 적습니다. 이미 있는 주소라고 나오면 <b>숫자를 바꿔 여러 번</b> 시도하면 됩니다.<img class=\"doc-img\" src=\"signup-4.png\" alt=\"구글 계정 만들기 – 직접 Gmail 주소 입력 화면\" loading=\"lazy\"></li><li><b>안전한 비밀번호 만들기</b> — <b>본인 이름 영어 + 숫자 + 기호</b> 조합이 쉬워요. (예: dldowls1234!) 아래 칸에 <b>똑같이 한 번 더</b> 입력합니다.<img class=\"doc-img\" src=\"signup-5.png\" alt=\"구글 계정 만들기 – 비밀번호 입력 화면\" loading=\"lazy\"></li><li><b>보안문자 입력</b> — 본인 <b>휴대전화 번호</b>를 넣고 ［다음］을 누릅니다.<img class=\"doc-img\" src=\"signup-6.png\" alt=\"구글 계정 만들기 – 휴대전화 번호 입력 화면\" loading=\"lazy\"></li><li><b>받은 코드 확인</b> — 문자로 온 <b>G- 뒤의 6자리 숫자</b>를 그대로 입력합니다.<img class=\"doc-img\" src=\"signup-7.png\" alt=\"구글 계정 만들기 – 인증 코드 입력 화면\" loading=\"lazy\"></li><li><b>복구 이메일 추가</b> — 기존에 쓰던 메일 주소를 적습니다. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"signup-8.png\" alt=\"구글 계정 만들기 – 복구 이메일 추가 화면\" loading=\"lazy\"></li><li><b>복구 연락처 추가</b> — 앞에서 쓴 복구 이메일과 <b>같은 주소</b>를 써도 됩니다. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"signup-9.png\" alt=\"구글 계정 만들기 – 복구 연락처 추가 화면\" loading=\"lazy\"></li><li><b>계정 정보 검토</b> — 만들어진 주소를 확인하고 ［다음］.<img class=\"doc-img\" src=\"signup-10.png\" alt=\"구글 계정 만들기 – 계정 정보 검토 화면\" loading=\"lazy\"></li><li><b>개인 정보 보호 및 약관</b> — 맨 아래 <b>체크 두 칸</b>을 누른 뒤 ［계정 만들기］를 누릅니다.<img class=\"doc-img\" src=\"signup-11.png\" alt=\"구글 계정 만들기 – 약관 동의 화면\" loading=\"lazy\"></li><li><b>완성!</b> — 계정 첫 화면입니다. 노란 박스의 ［복구 전화번호 추가］까지 해 두시면 비밀번호를 잊어도 안전해요.<img class=\"doc-img\" src=\"signup-12.png\" alt=\"구글 계정 만들기 – 계정 완성 후 첫 화면\" loading=\"lazy\"></li><li><b>(선택) 복구 옵션 더 채우기</b> — 앞 화면의 ［복구 전화번호 추가］를 누르면 <b>복구 옵션</b> 화면이 나옵니다. 복구 이메일 옆 <b>✏️</b>를 누르고 주소를 확인한 뒤 ［코드 전송］.<img class=\"doc-img\" src=\"signup-13.png\" alt=\"구글 계정 – 복구 옵션에서 복구 이메일 확인 창\" loading=\"lazy\"></li><li><b>코드 입력칸이 나타납니다</b> — 이메일로 받은 6자리 숫자를 여기에 넣으면 돼요. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"signup-14.png\" alt=\"구글 계정 – 복구 이메일 인증 코드 입력창\" loading=\"lazy\"></li><li><b>Gmail에서 코드 확인</b> — 복구 이메일의 받은편지함에 온 「<b>복구 이메일 설정 코드</b>」 메일의 <b>6자리 숫자</b>를 그대로 옵겨 넣고 ［인증］을 누릅니다.<img class=\"doc-img\" src=\"signup-15.png\" alt=\"구글 계정 – Gmail에서 받은 복구 코드를 입력하기\" loading=\"lazy\"></li></ol><div class=\"warn\">📝 만드신 <b>아이디와 비밀번호는 꼭 종이에 적어</b> 연수 날 가져오세요.</div></div></details><p class=\"step-lead\" style=\"margin-top:10px\">만드는 데 <b>3~5분</b>이면 됩니다. <b>휴대폰 문자 인증</b>만 하시면 끝나요. 만드신 뒤에는 아이디와 비밀번호를 꼭 적어 두세요.</p><p class=\"setup-note\" style=\"margin-top:2.4em\">💡 계정이 두 개가 되면 연수 중 ‘크롬 프로필 분리’ 실습까지 해볼 수 있어요.</p><p class=\"setup-note\" style=\"margin-bottom:2.6em\">📱 한 전화번호로 인증할 수 있는 계정 수는 제한이 있어요. 막히면 아래 STEP 5 임시계정을 쓰세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 5</div><div class=\"step-title\">계정 준비가 어려운 분만 — 오늘만 쓰는 임시 구글계정</div><p class=\"step-lead\">위 방법으로도 계정 준비가 어려우시면, 아래 시트에서 오늘만 사용하는 임시 계정을 받아 쓰세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">📄 임시 구글계정 시트 열기</a> <span class=\"click-here\">👈 여기를 클릭!</span><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">임시계정 사용 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>※ 화면에서 바로 보이지 않으면 위 ‘시트 열기’ 버튼으로 열어 주세요. (이름 작성은 시트를 직접 열어야 가능합니다.)</p><ul><li>시트의 <b>C열</b>에 본인 이름(또는 닉네임)을 적습니다.</li><li>그 줄의 아이디·비밀번호로 로그인해 사용합니다.</li></ul><div class=\"warn\">⚠️ 이 계정은 <b>기관 계정</b>이라, AI 활용 시 개인계정과 달리 일부 기능이 막힐 수 있습니다. 가능하면 <b>개인 구글계정</b> 사용을 권장합니다.</div></div><iframe class=\"sheet-embed\" src=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/preview?gid=0\" loading=\"lazy\" title=\"임시 구글계정 시트\"></iframe><p class=\"embed-note\">👀 아래에서 계정을 바로 확인할 수 있어요. <b>이름 작성·로그인은 위 ‘시트 열기’ 버튼</b>으로 직접 열어야 가능합니다.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 6</div><div class=\"step-title\">실습에 쓸 계정으로 제미나이 접속해 보기</div><p class=\"step-lead\">로그인한 뒤 질문을 하나 보내서 <b>답이 오는지</b> 확인해 주세요. 특히 <b>새로 만든 계정</b>은 가끔 제미나이가 열리지 않는 경우가 있어요. 연수 당일이 아니라 <b>지금 미리</b> 확인해 주세요.</p><img class=\"doc-img\" src=\"setup-gemini.jpg\" alt=\"제미나이 첫 화면: 입력창에 Gemini에게 물어보기가 보이는 모습\" loading=\"lazy\" style=\"max-width:620px;margin:10px 0 6px;\"><div class=\"warn\" style=\"background:#F3FAF6;border-color:#CDEBDD;color:#245c48\">✅ <b>이 화면이 보이면 성공</b>이에요. 입력창에 “안녕”이라고 보내 보고 답이 오는지 확인해 주세요.</div><a class=\"link-btn\" href=\"https://gemini.google.com/\" target=\"_blank\" rel=\"noopener\">✨ 제미나이 접속해 보기</a><p class=\"step-lead\" style=\"margin-top:10px\">👉 새 계정에서 제미나이가 안 되나요? <b>기존 개인계정</b>으로 실습하시면 됩니다. 기존 계정도 저장공간이 부족하다면 <a href=\"https://open.kakao.com/o/sM6RgUxi\" target=\"_blank\" rel=\"noopener\">카카오톡 오픈채팅</a>으로 미리 문의해 주세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 7</div><div class=\"step-title\">아이디와 비밀번호를 꼭 가지고 오세요</div><div class=\"check-list\"><div class=\"check-item\">🔑 <b>기존 개인계정</b> ID · 비밀번호 <b>(필수)</b></div><div class=\"check-item\">🆕 <b>새 개인계정</b> ID · 비밀번호 (만드신 경우)</div></div><p class=\"step-lead\">※ 비밀번호는 <b>종이나 휴대폰 메모</b>에 적어 오세요. 이 페이지에는 입력하지 마세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 8</div><div class=\"step-title\">🖥️ 노트북 점검 — 윈도우 11 (선택사항)</div><div class=\"check-list\"><div class=\"check-item\">✅ <b>윈도우 11</b>로 업데이트되어 있나요? <span class=\"game-hint\">(윈도우 10으로도 연수는 가능해요)</span></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">윈도우 11 업데이트 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p><b>① 내 윈도우 버전 확인</b> — <kbd>⊞Win</kbd>+<kbd>R</kbd> → <b>winver</b> 입력 → Enter. (또는 설정 → 시스템 → 정보)</p><img class=\"doc-img\" src=\"winver.png\" alt=\"winver 실행 화면 — Windows 11 버전 확인\" style=\"max-width:460px;margin:12px 0 8px;\"><p style=\"margin-top:2.4em\"><b>② 윈도우 11로 업데이트</b> (윈도우 10이라면)</p><ul><li><kbd>⊞Win</kbd>+<kbd>I</kbd>로 <b>설정</b> → <b>업데이트 및 보안 → Windows 업데이트</b></li><li style=\"list-style:none;margin:8px 0 2px -1.2em;\"><img class=\"doc-img\" src=\"winupdate.png\" alt=\"Windows 업데이트 화면\" style=\"max-width:660px;margin:6px 0 4px;\"></li><li><b>업데이트 확인</b> → “Windows 11로 업그레이드” 안내가 뜨면 <b>다운로드 및 설치</b></li><li>안내가 없으면 <b>Windows 11 설치 도우미</b> 이용 → <a href=\"https://www.microsoft.com/software-download/windows11\" target=\"_blank\" rel=\"noopener\">microsoft.com/software-download/windows11</a></li><li>업데이트는 시간이 걸리니 <b>전원 연결 + 넉넉한 시간</b>에 미리 진행하세요</li></ul><div class=\"warn\">⚠️ PC 사양(TPM 2.0 · 지원 CPU 등)이 안 되면 윈도우 11 업데이트가 <b>불가</b>할 수 있어요. 그런 경우 윈도우 10 그대로 오셔도 되지만, <b>연수 전에 미리 알려</b> 주세요.</div></div><div class=\"warn\">⚠️ <b>윈도우 11 업데이트는 연수 당일에 절대 하지 마세요!</b> 한 시간 이상 걸리는 경우가 많아, 당일에 시작하면 연수에 참여하실 수 없어요. <b>늦어도 전날까지</b> 마쳐 주세요.</div><div class=\"warn\">🔌 업데이트 중에는 반드시 <b>전원(충전기)</b>을 연결해 두세요. 도중에 꺼지면 윈도우가 손상될 수 있어요.</div></div><div class=\"step\" style=\"border-style:dashed\"><div class=\"step-title\">📎 준비물</div><div class=\"check-list\"><div class=\"check-item\">🏫 <b>5기 대면</b> — 컴퓨터실 PC 사용 · <b>휴대폰</b>(인증·구글 렌즈 실습용) · 개인 노트북을 쓰신다면 <b>충전기·마우스</b></div></div><p class=\"step-lead\" style=\"margin-top:10px\">준비하시다 막히면 <a href=\"https://open.kakao.com/o/sM6RgUxi\" target=\"_blank\" rel=\"noopener\">💬 카카오톡 오픈채팅방</a>에서 바로 물어보세요.</p></div></div>", "warmup": "<h2 class=\"s-title\">🔥 워밍업 게임</h2><p class=\"s-sub\">본격 시작 전, 가볍게 손을 푸는 시간! 게임 카드를 <b>뒤집어</b> 단축키를 재미있게 익혀요.</p><div class=\"game-flip\"><div class=\"game-cover cov1\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 1</div><div class=\"cover-emoji\">📋</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 1</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 1</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 1</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><p class=\"game-desc\" id=\"g1desc\">문장을 <b>드래그 → Ctrl+C</b>로 복사하고, 칸을 클릭해 <b>Ctrl+V</b>! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g1mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g1mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g1dots\"></span><span class=\"stage-label\" id=\"g1p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g1t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g1srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g1src\" spellcheck=\"false\" oninput=\"g1srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g1s\" onclick=\"g1start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g1iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g1i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g1paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g1r\"></div><div class=\"best\" id=\"g1b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov3\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 2</div><div class=\"cover-emoji\">🅰️</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 2</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 2</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 2</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>A</kbd> · <kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd> · <kbd>Delete</kbd></span></div><p class=\"game-desc\" id=\"g3desc\">원본 전체를 <b>Ctrl+A</b>로 선택해 <b>복사·붙여넣기</b> 하거나, <b>Ctrl+A → Delete</b>로 싹 지우기! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g3mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g3mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g3dots\"></span><span class=\"stage-label\" id=\"g3p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g3t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g3srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g3src\" spellcheck=\"false\" oninput=\"g3srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g3s\" onclick=\"g3start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g3iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g3i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g3paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g3r\"></div><div class=\"best\" id=\"g3b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov2\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 3</div><div class=\"cover-emoji\">📸</div><div class=\"cover-title\">화면 캡처</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 3</span><span class=\"arcade-title\">화면 캡처</span><span class=\"arcade-keys\"><kbd>⊞Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></span></div><p class=\"game-desc\">아래 <b>이모지</b>를 캡처해서 칸에 <b>Ctrl+V</b>! 이모지가 바뀌며 <b>5장</b> 도전 📸 <span class=\"game-hint\">캡처 키는 브라우저가 못 봐서, 붙여넣기까지 해야 성공!</span></p><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#c0392b\">(윈도우10은 안 돼요)</b></span></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div><img class=\"doc-img gkeys\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\"><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g2mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g2mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g2dots\"></span><span class=\"stage-label\" id=\"g2p\">STAGE 1 / 5</span></div><div class=\"cap-card cap-emoji-only\"><div class=\"cap-emoji\" id=\"g2emoji\">🌏</div></div><button class=\"game-start hidden\" id=\"g2s\" onclick=\"g2start()\">🚩 5장 도전 시작!</button><div class=\"paste-zone\" id=\"g2z\" contenteditable=\"true\" onpaste=\"g2paste(event)\">여기 클릭 → 캡처 이미지 Ctrl+V</div><div class=\"game-result\" id=\"g2r\"></div><div class=\"best\" id=\"g2b\"></div></div></div></div>", "gift": "<h2 class=\"s-title\">🎁 작은 선물들</h2>\n<p class=\"s-sub\">연수에서 바로 써먹는 작은 선물들을 모았어요. 앞으로 자료가 더 추가됩니다.</p>\n\n<details class=\"giftsec\" open><summary class=\"giftsec-sum\"><span class=\"gs-t\">⌨️ 알아두면 편한 크롬 단축키</span><span class=\"gs-c\">10개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><table class=\"gift-table\"><thead><tr><th>단축키</th><th>기능</th><th>활용 팁</th></tr></thead><tbody><tr><td><kbd>Ctrl + J</kbd></td><td>받은 파일 빨리 찾기</td><td><b>다운로드 목록</b>이 바로 열려요 — 폴더 뒤질 필요 없이 방금 받은 첨부파일·양식을 찾아요.</td></tr><tr><td><kbd>Ctrl + H</kbd></td><td>방문 기록(History) 열기</td><td>이전에 방문했던 사이트를 빠르게 찾을 때 유용해요.</td></tr><tr><td><kbd>Ctrl + Shift + T</kbd></td><td>닫은 탭 다시 열기</td><td>실수로 창을 닫았을 때 당황 금지! 여러 번 누르면 순차적으로 되살아나요.</td></tr><tr><td><kbd>Ctrl + Shift + B</kbd></td><td>북마크바 표시/숨기기</td><td>화면을 넓게 써야 할 때 숨기는 ‘화면 다이어트’ 필수 기능.</td></tr><tr><td><kbd>Ctrl + Shift + V</kbd></td><td>서식 없이 붙여넣기</td><td>웹사이트의 글꼴·색상을 무시하고 텍스트만 깔끔하게 붙여넣어요.</td></tr><tr><td><kbd>Shift + Enter</kbd></td><td>프롬프트 창 내 줄바꿈</td><td>전송하지 않고 다음 줄로 넘어갈 때 사용해요.</td></tr><tr><td><kbd>Ctrl + L</kbd></td><td>주소창으로 바로 이동</td><td>마우스 없이 커서를 주소창으로 옮겨 바로 입력해요.</td></tr><tr><td><kbd>Ctrl + F</kbd></td><td>페이지 안에서 찾기</td><td>긴 페이지에서 원하는 단어를 바로 찾아 이동해요.</td></tr><tr><td><kbd>Ctrl + P</kbd></td><td>웹페이지를 PDF로 저장·인쇄</td><td>인쇄창에서 대상을 <b>‘PDF로 저장’</b> 선택 → 공문·증빙·신청완료 화면을 그대로 보관해요.</td></tr><tr><td><kbd>Ctrl + +</kbd> / <kbd>Ctrl + -</kbd></td><td>글자 크게 / 작게</td><td>화면 글자가 작을 때 크기 조절 (Ctrl + 0 = 원래대로).</td></tr></tbody></table></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🪟 윈도우 · 터치패드 꿀팁</span><span class=\"gs-c\">13개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">크롬 밖에서도 쓰는 것들이에요. <b>딱 세 개만 익혀도</b> 하루가 달라집니다 — <b>Win+V</b>, <b>Win+←/→</b>, <b>세 손가락</b>.</p>\n<div class=\"gem-note\" style=\"margin:0 0 14px\"><b>⌨️ Win 키</b>는 키보드 왼쪽 아래 <b>창문 모양 ⊞</b> 키예요. (Ctrl과 Alt 사이)</div>\n<table class=\"gift-table\"><thead><tr><th>단축키</th><th>기능</th><th>이럴 때 씁니다</th></tr></thead><tbody>\n<tr><td><kbd>⊞ Win + V</kbd></td><td><b>클립보드 기록</b> — 복사한 것들이 쌓여요</td><td><b>★ 오늘의 최고 꿀팁.</b> 문서 여기저기서 복사할 때, 하나 복사하면 앞엣것이 날아가던 스트레스가 사라집니다. 여러 개 복사해 두고 <b>골라서</b> 붙여넣으세요. (처음 한 번 “사용 설정” 클릭)</td></tr>\n<tr><td><kbd>⊞ Win + ←</kbd> / <kbd>→</kbd></td><td><b>창을 화면 반쪽에</b> 붙이기</td><td>왼쪽에 업무포털, 오른쪽에 한글 문서 — <b>보면서 옮겨 적는</b> 일에 딱. 위/아래 키까지 쓰면 4분할도 됩니다.</td></tr>\n<tr><td><kbd>⊞ Win + .</kbd></td><td>이모지·특수문자 창</td><td>‘ㅇ + 한자’로 ○△□ 찾던 것보다 훨씬 빨라요. <b>※ ☎ ▶ ✓</b> 같은 기호도 여기서.</td></tr>\n<tr><td><kbd>⊞ Win + L</kbd></td><td>화면 잠금</td><td><b>자리 비울 때 3초.</b> 공용 공간에서 내 화면을 지키는 가장 확실한 습관.</td></tr>\n<tr><td><kbd>⊞ Win + Shift + S</kbd></td><td>화면 일부 캡처</td><td>크롬·구글 꿀팁에서 배운 그 캡처예요. <b>캡처 후 글자 복사</b>도 됩니다.</td></tr>\n<tr><td><kbd>⊞ Win + E</kbd></td><td>파일 탐색기 열기</td><td>바탕화면 아이콘 찾아 헤맬 필요 없이 바로.</td></tr>\n<tr><td><kbd>⊞ Win + D</kbd></td><td>바탕화면 보기 / 되돌리기</td><td>창이 열 개쯤 쌓였을 때 한 번에 정리. 다시 누르면 원래대로.</td></tr>\n<tr><td><kbd>F2</kbd></td><td>파일·폴더 <b>이름 바꾸기</b></td><td>우클릭 메뉴를 찾을 필요 없이 바로. <b>여러 개를 한꺼번에</b> 바꾸는 것도 됩니다 → 아래 <b>［F2로 파일 100개 한 번에］</b> 참고</td></tr>\n\n<tr><td><kbd>Alt + Tab</kbd></td><td>열린 창 사이 전환</td><td>꾹 누른 채 Tab을 여러 번 누르면 원하는 창까지 갈 수 있어요.</td></tr>\n</tbody></table>\n<div class=\"gem-note\" style=\"margin-top:16px\">💡 <b>Win + V를 처음 누르면</b> “클립보드 기록을 사용 설정하시겠습니까?” 창이 떠요. <b>［사용 설정］</b>을 한 번만 눌러 주시면 그다음부터 계속 쌓입니다. <b>⚠️ 주민등록번호·비밀번호를 복사했다면</b> 기록에 남으니, 공용 PC에서는 클립보드 창의 <b>［모두 지우기］</b>를 눌러 주세요.</div>\n<details class=\"petog f2box\"><summary class=\"a3-blocktt petog-sum\">🗂️ F2로 파일 100개 이름 한 번에 바꾸기 — 스캔 파일 정리할 때<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"hook\">🖼️ <b>돌봄·특수·행정 선생님께!</b> <b>활동사진 100장 이름 바꾸기</b>, 10초면 끝.</div><div class=\"dotbox\"><div class=\"item-lead\">복합기로 스캔하면 <b>SCAN0001.jpg · SCAN0002.jpg …</b> 처럼 나오죠. 하나씩 고치면 30분, 이 방법이면 <b>10초</b>입니다.</div><div class=\"a3-subtt\">순서</div><ol class=\"steps\"><li>파일 탐색기(<kbd>⊞ Win</kbd>+<kbd>E</kbd>)에서 그 폴더를 엽니다</li><li>바꿀 파일을 <b>모두 선택</b> — 전부라면 <kbd>Ctrl</kbd>+<kbd>A</kbd>, 골라서라면 <kbd>Ctrl</kbd>을 누른 채 클릭</li><li><kbd>F2</kbd>를 누릅니다 — <b>맨 위 파일 이름만</b> 편집 상태가 됩니다 (정상이에요)</li><li>원하는 이름을 치고 <kbd>Enter</kbd> — 예: <b>2026돌봄교실_활동사진</b></li></ol><div class=\"a3-subtt\">결과</div><table class=\"gift-table\"><thead><tr><th>바꾸기 전</th><th>바꾼 뒤</th></tr></thead><tbody><tr><td>SCAN0001.jpg</td><td><b>2026돌봄교실_활동사진.jpg</b></td></tr><tr><td>SCAN0002.jpg</td><td><b>2026돌봄교실_활동사진 (1).jpg</b></td></tr><tr><td>SCAN0003.jpg</td><td><b>2026돌봄교실_활동사진 (2).jpg</b></td></tr><tr><td>SCAN0004.jpg</td><td><b>2026돌봄교실_활동사진 (3).jpg</b></td></tr></tbody></table><div class=\"item-note\">💡 <b>번호는 화면에 보이는 순서대로</b> 붙습니다. 날짜순으로 번호를 매기고 싶다면 <b>먼저 ［수정한 날짜］로 정렬</b>해 두고 F2를 누르세요. 확장자(.jpg·.pdf)는 <b>자동으로 그대로</b> 유지됩니다.</div><div class=\"a3-subtt\">한 개씩 빠르게 바꾸고 싶다면</div><div class=\"a3-tip\">파일 하나를 고르고 <kbd>F2</kbd> → 이름 입력 → <kbd>Tab</kbd>을 누르면 <b>저장되면서 바로 다음 파일</b>의 이름 편집으로 넘어갑니다. 마우스를 한 번도 안 잡고 쭉 바꿀 수 있어요.</div><div class=\"warn\">⚠️ <b>잘못 바꿨다면 당황하지 마세요</b> — <kbd>Ctrl</kbd>+<kbd>Z</kbd>를 누르면 <b>바꾼 이름 전부가 한 번에</b> 원래대로 돌아갑니다. (탐색기를 닫기 전에만 됩니다)</div></div></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">📝 한글(HWP) 실무 꿀팁 — 찾아 바꾸기 · 표 안 깨지게 붙이기</span><span class=\"gs-c\">2개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><div class=\"hook\">📝 <b>모든 직종 공통!</b> 안내문 속 <b>이름·날짜 30군데</b>, 한 번에 바꾸세요.</div><details class=\"tiptog\"><summary>💡 꿀팁 — 한글 ‘찾아 바꾸기’로 반복 작업 한 번에 (익명화·일괄수정)</summary><div class=\"tiptog-body\"><p style=\"margin:0 0 8px\">여러 곳에 있는 같은 단어(이름·연도·학교명 등)를 <b>한 번에</b> 바꾸거나, 문서를 <b>익명화</b>할 때 아주 유용해요.</p><ol class=\"steps\"><li>한글에서 문서 열기 → <kbd>Ctrl</kbd>+<kbd>F2</kbd> (또는 <kbd>Ctrl</kbd>+<kbd>H</kbd>) = <b>찾아 바꾸기</b></li><li><b>찾을 내용</b>에 바꿀 단어, <b>바꿀 내용</b>에 새 단어 입력 → <b>모두 바꾸기</b></li><li>지울 것(전화·주소 등)은 <b>바꿀 내용을 비워두고</b> 모두 바꾸기 → 한 번에 삭제</li><li><b>파일 → 다른 이름으로 저장 → 파일 형식 PDF</b> — 어디서나 열리는 PDF 완성!</li></ol><div class=\"item-note\">예: 가정통신문·안내문·명단처럼 이름·날짜만 바뀌는 문서를 한 번에 수정!</div></div></details><div style=\"height:2.6em\"></div><details class=\"tiptog\"><summary>📄 제미나이로 만든 표·안내문을 <b>한글로 가져오기</b> — 표가 안 깨지게! (HTML 문서 붙이기)</summary><div class=\"tiptog-body\"><p style=\"margin:0 0 8px\">제미나이로 만든 결과를 <b>구글독스로 보내고 → 복사해서 → 한글에 붙여넣을 때</b>, 표가 깨지지 않게 하는 요령이에요.</p><ol class=\"steps\"><li>제미나이 답변 아래 ⋮ → <b>Docs로 내보내기</b></li><li>구글독스에서 <b>전체 선택·복사</b>(<kbd>Ctrl</kbd>+<kbd>A</kbd> → <kbd>Ctrl</kbd>+<kbd>C</kbd>)</li><li>한글에 붙여넣기(<kbd>Ctrl</kbd>+<kbd>V</kbd>) → <b>「HTML 문서 붙이기」 창</b>이 뜨면 <b>「원본 형식 유지」 선택 → [확인]</b></li></ol><div class=\"item-note\">✅ <b>「원본 형식 유지」</b>로 붙여야 <b>표가 안 깨져요.</b> (텍스트 형식으로 붙이면 표가 사라져요)</div><img class=\"a3-img\" style=\"max-width:520px\" src=\"pm-18.png\" alt=\"HTML 문서 붙이기 창\"><div style=\"height:2.6em\"></div><div class=\"a3-subtt\" style=\"margin-top:16px\">🔧 이 창이 안 뜨는 분은 — 다시 물어보게 설정</div><p style=\"margin:0 0 6px;font-size:13.5px;color:#5a6478\">전에 “기본 값으로 설정”을 눌러 창이 더는 안 뜨는 경우, 아래처럼 되돌리면 붙여넣을 때 다시 물어봐요.</p><ol class=\"steps\"><li>한글 상단 <b>[도구] → [환경 설정]</b> (단축키 <kbd>Alt</kbd>+<kbd>F2</kbd>)</li><li>환경 설정 창에서 <b>[코드 형식]</b> 탭 선택</li><li><b>[HTML 문서 붙이기]</b> 항목의 설정을 <b>체크 해제</b> → 이제 붙여넣을 때 다시 물어봐요</li></ol></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🖐️ 노트북 터치패드 — 손가락 세 개면 됩니다</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">마우스를 안 챙긴 날, 이거 하나면 버팁니다. <b>터치패드 위에 손가락 세 개</b>를 올리고 쓸어보세요.</p>\n<div class=\"five-grid\">\n <div class=\"five-card\"><span class=\"five-b\">↑</span><div class=\"five-t\">세 손가락 위로</div><div class=\"five-d\"><b>열린 창 전부 보기</b><br>창이 잔뜩 쌓였을 때 한눈에 펼쳐서 고릅니다. (Win+Tab과 같아요)</div></div>\n <div class=\"five-card\"><span class=\"five-b\">↓</span><div class=\"five-t\">세 손가락 아래로</div><div class=\"five-d\"><b>바탕화면 보기</b><br>다시 아래로 쓸면 원래 창으로 돌아옵니다.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">↔</span><div class=\"five-t\">세 손가락 좌·우로</div><div class=\"five-d\"><b>창 바꾸기</b><br>Alt+Tab을 손가락으로. 한글 ↔ 업무포털 오갈 때 제일 빨라요.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">👆</span><div class=\"five-t\">세 손가락 톡 (탭)</div><div class=\"five-d\"><b>검색창 열기</b><br>파일이든 프로그램이든 이름만 치면 바로 찾아줍니다.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">4</span><div class=\"five-t\">네 손가락 좌·우로</div><div class=\"five-d\"><b>가상 데스크톱 전환</b><br>업무용 화면과 자료 화면을 통째로 나눠 씁니다.<br><b style=\"color:#C0392B\">먼저 바탕화면을 하나 더 만들어야</b> 넘어갈 데가 생겨요 → 아래 설명</div></div>\n <div class=\"five-card\"><span class=\"five-b\">2</span><div class=\"five-t\">두 손가락</div><div class=\"five-d\"><b>스크롤 · 확대/축소</b><br>위아래로 쓸면 스크롤, 오므리고 벌리면 확대·축소.</div></div>\n</div>\n<details class=\"petog\" style=\"margin-top:16px\"><summary class=\"a3-blocktt petog-sum\">🖥️ 네 손가락이 아무 반응이 없다면? — 가상 데스크톱 만들기·문제 해결<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"a3-tip\" style=\"margin-top:16px\"><b>🖥️ 네 손가락이 아무 반응이 없다면</b> — 고장이 아니라, <b>넘어갈 바탕화면이 아직 없어서</b>일 때가 대부분이에요. 가상 데스크톱은 <b>내가 직접 만들어야</b> 생깁니다.<ol class=\"steps\"><li><kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>D</kbd> — <b>새 바탕화면 만들기</b> (화면이 휙 넘어가면 성공)</li><li>이제 <b>네 손가락으로 좌·우</b>를 쓸어 보세요. 키보드로는 <kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd></li><li>지금 몇 개인지 보려면 <kbd>⊞ Win</kbd>+<kbd>Tab</kbd> — 화면 위에 바탕화면 목록이 뜹니다</li><li>필요 없어지면 <kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>F4</kbd> — <b>그 바탕화면만 닫히고 창은 옆으로 옮겨져요</b> (프로그램은 안 꺼집니다)</li></ol></div><div class=\"gem-note\" style=\"margin-top:14px\">💡 <b>그래도 제스처가 안 되면</b> — <b>설정 → Bluetooth 및 장치 → 터치패드</b>에서 <b>［세 손가락 제스처］·［네 손가락 제스처］</b>가 켜져 있는지, 동작이 다른 기능으로 바뀌어 있지 않은지 확인하세요. 거기서 <b>내 마음대로 바꿀 수도</b> 있어요.</div><div class=\"warn\" style=\"margin-top:14px\">⚠️ <b>제스처는 ‘정밀 터치패드’에서만 됩니다.</b> 오래된 노트북이나 제조사 전용 드라이버를 쓰는 기종은 설정을 켜도 안 될 수 있어요. 그럴 땐 <b>키보드 단축키</b>(<kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd>)를 쓰시면 <b>똑같이 됩니다.</b></div></div></details>\n\n<details class=\"petog f2box\"><summary class=\"a3-blocktt petog-sum\">🚫 터치패드가 아예 안 움직인다면 — 다시 켜는 법<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">고장이 아니라 <b>꺼져 있는</b> 경우가 대부분이에요. 손바닥이 자꾸 닿아서 꺼 두셨다가 잊으신 것일 수도 있고요. <b>쉬운 것부터</b> 해보세요.</div><div class=\"a3-subtt\">① 키보드 한 번 — 가장 흔한 원인</div><div class=\"a3-tip\">키보드 맨 윗줄 <kbd>F1</kbd>~<kbd>F12</kbd> 중에 <b>네모에 사선이 그어진 터치패드 그림</b>이 있는 키를 찾으세요. 그 키를 누르거나, <kbd>Fn</kbd>을 함께 누르세요.<br><b>삼성 갤럭시북·LG 그램</b>은 대개 <kbd>Fn</kbd>+<kbd>F5</kbd>, 기종에 따라 F6·F7일 수도 있어요.</div><div class=\"item-note\">💡 껐다 켰다 하는 키라 <b>한 번 더 누르면 다시 꺼집니다.</b> 화면에 잠깐 표시가 뜨는 노트북도 있어요.</div><div class=\"a3-subtt\">② 설정에서 켜기</div><ol class=\"steps\"><li><kbd>⊞ Win</kbd>+<kbd>I</kbd>로 <b>설정</b> 열기</li><li><b>Bluetooth 및 장치 → 터치패드</b></li><li>맨 위 <b>［터치패드］ 스위치를 «켬»</b>으로</li></ol><div class=\"a3-subtt\">③ 마우스를 꽂으면 꺼지는 설정</div><div class=\"a3-tip\">마우스를 연결했을 때만 안 된다면 이 설정 때문이에요.<br>같은 <b>터치패드</b> 화면에서 <b>［터치패드］ 옆 화살표(∨)</b>를 펼쳐 <b>「마우스가 연결되어 있을 때 터치패드 켜 놓기」에 체크</b>하세요.</div><div class=\"warn\">⚠️ <b>마우스도 없어서 클릭을 못 하신다면</b> — 키보드만으로 갑니다.<br><kbd>⊞ Win</kbd>을 누르고 <b>터치패드</b>라고 친 뒤 <kbd>Enter</kbd> → <kbd>Tab</kbd>·<b>방향키</b>로 이동, <kbd>Space</kbd>로 스위치를 켭니다.</div><div class=\"item-note\">🔧 위 셋으로도 안 되면 <b>드라이버 문제</b>일 수 있어요. 연수 중에 붙들지 마시고 <b>마우스로 진행</b>하신 뒤 나중에 제조사 지원센터에서 확인하세요.</div></div></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">⚡ 구글 “.new” 마법 주소 — 주소창에 치면 바로 새 문서</span><span class=\"gs-c\">8개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">파일을 만들려고 드라이브 → 새로 만들기 → … 를 거칠 필요가 없어요. <b>주소창에 아래를 치고 Enter</b>만 하면 그 자리에서 새 문서가 열립니다. 오늘 배운 <b>form.new</b>·<b>doc.new</b>가 바로 이거예요.</p><div class=\"newgrid\"><div class=\"newcard\"><span class=\"nc-emoji\">📄</span><span class=\"nc-addr\">doc.new</span><span class=\"nc-desc\">새 구글 <b>문서</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📊</span><span class=\"nc-addr\">sheet.new</span><span class=\"nc-desc\">새 구글 <b>시트</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🖼️</span><span class=\"nc-addr\">slide.new</span><span class=\"nc-desc\">새 구글 <b>슬라이드</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📝</span><span class=\"nc-addr\">form.new</span><span class=\"nc-desc\">새 구글 <b>설문</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🌐</span><span class=\"nc-addr\">site.new</span><span class=\"nc-desc\">새 구글 <b>사이트</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🗒️</span><span class=\"nc-addr\">keep.new</span><span class=\"nc-desc\">새 <b>킵 메모</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📅</span><span class=\"nc-addr\">cal.new</span><span class=\"nc-desc\">새 <b>캘린더 일정</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🎥</span><span class=\"nc-addr\">meet.new</span><span class=\"nc-desc\"><b>화상회의</b> 바로 열기</span></div></div></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🧩 크롬 확장 프로그램</span><span class=\"gs-c\">8개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><div class=\"gift-cards\"><a class=\"gift-card\" href=\"https://chromewebstore.google.com/detail/rhwp-hwp-%EB%AC%B8%EC%84%9C-%EB%B7%B0%EC%96%B4-%EC%97%90%EB%94%94%ED%84%B0/pgakpjflombjmehnebnbpnalhegaanag\" target=\"_blank\" rel=\"noopener\"><span class=\"gc-emoji\">📄</span><span class=\"gc-body\"><span class=\"gc-title\">rhwp — 크롬에서 한글(HWP) 문서 바로 보기·편집</span><span class=\"gc-url\">chromewebstore.google.com</span></span><span class=\"gc-e
