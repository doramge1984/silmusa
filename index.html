>WRAP UP</div><div class=\"wu-h\">오늘, 여기까지 오셨습니다</div><div class=\"wu-rule\"></div><div class=\"wu-one\">내일 아침, <b>딱 하나만</b> 해보세요.<br><span>하나가 손에 붙으면 그다음은 알아서 따라옵니다.</span></div><div class=\"wu-close\"><p><b>오늘 다 못 따라오셨어도 괜찮습니다.</b></p><p>이 교안은 그대로 남아 있고, 링크는 계속 열려 있어요.<br>자리로 돌아가 천천히 다시 보세요.</p><p>막히면 언제든 물어보세요.</p></div><div class=\"wu-btns\"><a class=\"wu-btn kakao\" href=\"https://open.kakao.com/o/sM6RgUxi\" target=\"_blank\" rel=\"noopener\">💬 카카오톡 오픈채팅으로 문의하기</a><a class=\"wu-btn ghost\" href=\"mailto:ai@flowdx.kr\">✉ ai@flowdx.kr</a><a class=\"wu-btn ghost\" href=\"https://flowdx.kr\" target=\"_blank\" rel=\"noopener\">🌐 flowdx.kr</a></div><div class=\"wu-sign\"><b>이애진</b> · 플로우디엑스(FlowDX) 대표<br><span>구글 공식 PD 파트너사</span><br><span>Google 공식 트레이너 · Gemini Certified Educator</span></div></div>", "gemini": "<div class=\"c1x\"><h2 class=\"s-title\">✨ 크롬 속 제미나이 (Gemini in Chrome)</h2><p class=\"s-sub\">크롬 화면 옆에 붙어 요약·번역·정리를 도와주는 AI 비서</p><div class=\"gmx-hero\"><div class=\"gmx-kick\">✨ 크롬 속 제미나이 · 이 도구는?</div><h2 class=\"gmx-h\">지금 보는 화면 <span class=\"g\">옆에서</span> 묻는 제미나이</h2><p class=\"gmx-desc\">새 창으로 옮기지 않아요. 보던 웹페이지·PDF 그대로, 옆 칸에서 요약·번역·비교를 바로 부탁해요.</p><button class=\"gmx-vbtn\" onclick=\"this.closest('.gmx-hero').classList.toggle('open')\">▶ 1분 설명 보기 · 제미나이 인 크롬이란?</button><div class=\"gmx-vpanel\"><div class=\"gmx-win\"><div class=\"gmx-wbar\"><div class=\"gmx-dots\"><i></i><i></i><i></i></div><div class=\"gmx-url\">우리학교 · 방과후학교 프로그램 신청 안내</div><div class=\"gmx-sp\">✦</div></div><div class=\"gmx-wbody\"><div class=\"gmx-page\"><div class=\"gmx-pt\">방과후학교 프로그램 신청 안내</div><div class=\"gmx-sk\" style=\"width:95%\"></div><div class=\"gmx-sk\" style=\"width:86%\"></div><div class=\"gmx-sk\" style=\"width:92%\"></div><div class=\"gmx-sk\" style=\"width:68%\"></div></div><div class=\"gmx-side\"><div class=\"gmx-ask\">이 안내문 핵심만 3줄로 요약해 줘</div><div class=\"gmx-ans\"><b>⊙</b> 신청 9/1~9/12 오후 5시까지<br><b>⊙</b> 과목당 월 3만 원<br><b>⊙</b> 급여 대상 가정은 무료</div></div></div></div><p class=\"gmx-desc\" style=\"margin-top:12px\">크롬 오른쪽 위 <b>✦ 단추</b> 하나면 열려요. 탭을 옮기지 않아요.</p></div></div><div class=\"gmx-flowwrap\"><div class=\"gmx-flowt\">오늘은 이 순서로 넓혀 갑니다 <small>— 보는 것이 늘어날 뿐, 묻는 방법은 똑같아요</small></div><div class=\"gmx-flow\"><div class=\"gmx-step\"><div class=\"n\">1</div><h4>🌏 다문화 번역</h4><p>가정통신문을 열고 버튼 하나로 영어·베트남어로</p><a href=\"home-letter.html\" target=\"_blank\" rel=\"noopener\">실습 안내문 열기 →</a></div><div class=\"gmx-step\"><div class=\"n\">2</div><h4>🔍 두 안내문 비교</h4><p>@로 다른 탭을 붙여 두 문서를 나란히 비교</p></div><div class=\"gmx-step\"><div class=\"n\">3</div><h4>📋 복무·취업규칙</h4><p>규정에서 날짜·조항을 찾되 꼭 되물어 확인</p></div><div class=\"gmx-step\"><div class=\"n\">4</div><h4>🚀 더 나아가기</h4><p>메일로 온 일정을 구글 캘린더에 바로 등록</p></div></div></div><div class=\"block open\"><div class=\"block-body\"><div class=\"a3-blocktt\">🚀 시작하기</div><p class=\"item-lead\" style=\"margin:0 0 12px\">제미나이 창을 먼저 켜 둡니다.</p><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 제미나이 in 크롬이란?<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">크롬 브라우저 <b>안에</b> 제미나이가 들어와, 창을 따로 안 켜도 <b>화면 옆에 붙어</b> 도와줘요.</p><ol class=\"steps\"><li>지금 보는 <b>웹페이지·PDF 요약</b></li><li><b>영문 자료 → 한국어</b> 요약·번역</li><li>여러 <b>탭 한꺼번에 비교</b>, <b>유튜브 영상 요약</b></li><li><b>Gmail 초안·캘린더 일정</b>까지 연동</li></ol></div></li><li class=\"item-detail coll\" id=\"gm-on\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 켜는 법 (활성화) — 크롬 오른쪽 위 ✨ 버튼<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>⋮</b>(점 세 개) → <b>설정</b></li><li>맨 아래 <b>Chrome 정보</b> → 최신 버전으로 자동 업데이트</li><li>업데이트되면 <b>‘AI 혁신’</b> 메뉴가 생겨요 → <b>‘크롬의 Gemini’ 켜기</b></li><li>크롬 오른쪽 위 <b>✨ Gemini 버튼</b>을 누르면 화면 옆에 제미나이 창이 <b>열렸다 닫혔다</b></li></ol><div class=\"lens-note\">💡 ‘AI 혁신’이 안 보이면 크롬이 아직 구버전이에요 — 업데이트 후 크롬을 껐다 켜세요. 📌 <b>개인 구글 계정</b>으로 로그인해 실습하세요(기관·관리되는 프로필은 정책상 막혀 있을 수 있어요).<br>🙋 <b>그래도 안 뜨면?</b> <b>gemini.google.com</b>을 열고 링크를 붙여넣거나 파일을 올려서 <b>같은 프롬프트</b>를 쓰면 돼요.</div></div></li></ul><div class=\"a3-blocktt\">🗂️ 2단계 업무편 — 문서로 일하기</div><p class=\"item-lead\" style=\"margin:0 0 12px\">생활편에서 쓴 방법 그대로, 이번엔 <b>PDF 문서</b>로 해봐요.</p><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\" id=\"gm-mission\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 🕵️ 업무 미션 — “이 두 안내문, 뭔가 이상해요”<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">📞 <b>행정·돌봄·특수 선생님께!</b> <b>학부모 전화 응대</b>, 대본 한 장이면 떨리지 않아요.</div><div class=\"dl-wrap\"><div class=\"dl-lead\">📄 아래 버튼을 누르면 <b>예시 가정통신문</b>이 <b>새 탭</b>에서 바로 열려요 <span class=\"dl-sub\">(실제 학교 정보는 모두 지운 예시용 파일)</span></div><a class=\"dl-btn\" href=\"예시1_캠프안내문.pdf\" target=\"_blank\" rel=\"noopener\">📄 예시① 캠프 안내문 열기</a><a class=\"dl-btn\" href=\"예시2_공사후문안내문.pdf\" target=\"_blank\" rel=\"noopener\">📄 예시② 공사·후문 안내문 열기</a></div><div class=\"goldbox\"><div class=\"a3-subtt\">⏱️ 30초 퀴즈</div><p class=\"item-lead\" style=\"margin:4px 0 6px\">두 안내문을 <b>30초 동안</b> 훑어보세요. <b>학생 안전 문제</b>가 하나 숨어 있어요. 찾으셨나요?</p><details class=\"tiptog\"><summary>💡 힌트 보기</summary><div class=\"tiptog-body\">두 문서의 <b>날짜</b>를 나란히 놓고 보세요. 못 찾아도 괜찮아요 — 그걸 <b>제미나이가 찾아낼 거예요.</b></div></details></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">①</span>숨은 문제 찾기 ⭐</div><div class=\"act-d\">사람이 놓친 걸 <b>AI가 찾아내는</b> 장면이에요.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">지금 열려 있는 두 PDF를 모두 읽어 줘. 첫 번째 문서의 “캠프 일정”과 두 번째 문서의 “운동장 공사 기간”을 겹쳐 봤을 때 생길 수 있는 학생 안전 문제를 찾아서, 날짜 근거와 함께 알려 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">②</span>학부모 안내 문자 만들기</div><div class=\"act-d\">방금 찾은 문제를 <b>바로 해결</b>로 연결해요.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">방금 찾은 문제를 근거로, 캠프 신청 학부모에게 보낼 “후문 이용·안전 유의사항 안내” 문자를 200자 이내로 정중하게 작성해 줘. 신청 링크가 들어갈 자리는 [링크]로 표시해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act act-cal\"><div class=\"act-h\"><span class=\"act-code\">✉️</span>②-2 선생님들께는 메일로</div><div class=\"act-d\">같은 내용을 <b>받는 사람에 맞게</b> 바꿔요. 학부모는 문자, 선생님은 메일!</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">방금 만든 후문 이용·안전 안내 내용을 바탕으로, 선생님들께 보낼 협조 요청 메일 초안을 Gmail에 만들어 줘. 제목은 “[협조] 캠프 기간 후문 이용 안내”로 하고, 정중하고 짧게 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"item-note\" style=\"margin-top:6px\">⚠️ <b>초안까지만!</b> 받는 사람·내용을 확인한 뒤 <b>보내기는 직접</b> 누르세요.</div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">③</span>전화 문의 대본</div><div class=\"act-d\">전화 응대는 <b>어느 직종이든</b> 겪는 일이죠.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">두 가정통신문이 모두 배포된 상황이야. 한 학부모가 “우리 아이가 8월 4일에 캠프를 가는데 학교 공사 중이라 안전이 걱정돼요. 정문으로 들어가면 안 되나요?”라고 전화로 물었을 때, 교육공무직원이 친절하고 전문적으로 안내할 전화 응대 스크립트를 작성해 줘. 두 번째 문서의 공사 개요와 협조사항을 근거로 구성해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"hook\">🌏 <b>교육복지·상담·돌봄 선생님께!</b> <b>다문화 가정 안내문</b>, 아래 ‘영어·베트남어로’ 버튼 하나면 30초.</div><div class=\"a3-subtt\">🔁 결과를 바꿔 쓰는 한 줄 버튼</div><div class=\"chip-row\"><div class=\"chip\"><span class=\"chip-l\">✂️ 더 짧게</span><span class=\"prompt-text\" hidden>위 결과를 100자 이내로 더 짧게 줄여 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"chip\"><span class=\"chip-l\">😊 더 친근하게</span><span class=\"prompt-text\" hidden>위 결과를 존댓말은 유지하면서 더 친근한 톤으로 바꿔 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"chip\"><span class=\"chip-l\">🌏 영어·베트남어로</span><span class=\"prompt-text\" hidden>위 결과를 영어와 베트남어로 각각 번역해 줘. 정중한 톤을 유지해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"chip\"><span class=\"chip-l\">📊 표로 정리</span><span class=\"prompt-text\" hidden>위 결과를 표로 정리하고, 항목별 대응책도 한 줄씩 붙여 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"chip\"><span class=\"chip-l\">🗣️ 3단계 대본으로</span><span class=\"prompt-text\" hidden>위 내용을 신입 직원도 그대로 읽을 수 있게 인사말·본론·마무리 3단계로 나눠 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"warn\" style=\"background:#F3FAF6;border-color:#CDEBDD;color:#245c48\">🤝 <b>오늘의 한 줄</b> — AI는 <b>대신 써 주는 도구</b>이기 전에, 내가 <b>놓친 걸 찾아 주는 동료</b>예요. 그래서 마지막 확인은 늘 <b>사람</b>이 합니다.</div><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">➕ 더 해보기 — 시간이 남으면<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"a3-subtt\">📩 문서 1개로 안내 문자 (예시①만 열고)</div><div class=\"prompt-card\"><span class=\"prompt-text\">왼쪽 가정통신문에서 학부모가 꼭 알아야 할 핵심(신청 기간·방법·유의사항)만 뽑아, e알리미·SMS로 보낼 200자 이내 안내 문자 초안을 정중하게 작성해 줘. 구글폼 링크가 들어갈 자리는 [링크]로 표시해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">❓ 전화 문의 대비 FAQ</div><div class=\"prompt-card\"><span class=\"prompt-text\">이 가정통신문이 배포됐을 때 학부모가 가장 많이 물어볼 예상 질문 5가지와 그 답변(FAQ)을, 문서에 있는 내용만 근거로 전화로 바로 읽을 수 있게 구어체로 작성해 줘. 문서에 없는 내용은 추측하지 말고 “학교로 문의 필요”라고 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">📋 일정표를 구글 시트용 표로</div><div class=\"prompt-card\"><span class=\"prompt-text\">문서 하단의 캠프 프로그램 운영 일정 표를, 구글 스프레드시트에 바로 붙여넣을 수 있게 표 형식으로 추출해 줘. 강좌번호·대상학년·인원·프로그램명·일자(요일 구분)를 각각 열로 나눠 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">📱 두 안내문을 합친 통합 e알리미</div><div class=\"prompt-card\"><span class=\"prompt-text\">두 가정통신문의 핵심을 하나로 합쳐서 이번 주 학부모용 통합 e알리미 안내문을 작성해 줘. 소제목은 “1. 캠프 신청 안내(대상·기한·링크)”와 “2. 학교 공사로 인한 후문 이용 당부” 두 개로 나누고, 모바일에서 읽기 쉽게 짧게 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></details><div class=\"lens-note\">※ <b>스캔(사진) 형태 PDF</b>는 인식이 약할 수 있어요 → 안 되면 <b>캡처 도구로 텍스트 복사</b> 후 붙여넣기. 탭 추가가 안 되면 PDF마다 따로 요약한 뒤 “앞의 두 내용을 합쳐서 비교해 줘”라고 하세요.</div><div class=\"gm-back\"><button onclick=\"gmTop()\">⬆ 순서표로 돌아가기</button></div></div></li><li class=\"item-detail coll coll-green\" id=\"gm-rule\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ 📜 오전에 배운 복무·취업규칙, 제미나이에게 물어보기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">📜 <b>모든 직종 공통!</b> <b>연차·병가·경조사</b>, 이제 규정집 안 뒤지고 물어보세요.</div><div class=\"goldbox\" style=\"margin:6px 0 20px\"><div class=\"a3-subtt\" style=\"margin-top:14px\">⏱️ 먼저 30초 — AI가 규정을 <b>지어내는</b> 장면 보기</div><div class=\"item-lead\">문서를 열기 <b>전에</b>, 제미나이에 아래 두 개를 차례로 넣어 보세요.</div><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">우리 학교 교육공무직원 복무 내규 제17조 제3항의 내용을 조문 그대로 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"item-note\">👉 <b>“우리 학교”가 어디인지 AI는 모릅니다.</b> 그런데도 조문이 술술 나와요 — <b>통째로 지어낸 것</b>이에요.</div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\">경기도교육청 교육공무직원 취업규칙에서 경조사휴가는 경우별로 며칠인지, 조항 번호와 함께 정확히 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"item-note\">👉 실제로 있는 규정이라 <b>더 위험해요</b> — 맞아 보이는데 <b>일수나 조항 번호가 틀려</b> 있을 수 있어요. 아래에서 원문을 열고 직접 맞춰 보세요.</div><div class=\"warn\">⚠️ <b>그래서 문서를 열어 두고, “문서에 없으면 확인 불가”라고 시켜야 합니다.</b> 이게 아래 실습이에요.</div></div><p class=\"item-lead\">오전 「<b>복무와 취업규칙 이해</b>」 시간 자료(PDF)가 있으면 그걸 여세요. 없으면 아래 <b>경기도교육청 공식 문서</b>로 해봐요.</p><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://www.goe.go.kr/resource/goe/na/bbs_2675/2025/11/ac6345c3-6cf4-41f3-b55f-b68b7a9ed63c.pdf\" target=\"_blank\" rel=\"noopener\">📄 교육공무직원 취업규칙 (2025.11.1. PDF)</a> <a class=\"link-btn\" href=\"https://www.law.go.kr/ordinInfoP.do?ordinId=2011973\" target=\"_blank\" rel=\"noopener\">🌐 교육공무직원 채용 및 운영 조례 (웹)</a></div><ol class=\"steps\"><li>위 버튼 <b>둘 중 하나만</b> 눌러 새 탭으로 열기 <span style=\"color:#7b8494\">(오전 자료 PDF가 있으면 그것 하나를 크롬 창에 끌어다 놓기 · ⑦의 가정통신문과는 별개예요)</span></li><li>그 탭에서 오른쪽 위 <b>✨ 제미나이 창</b> 열기</li><li>아래 프롬프트 복사 → 붙여넣기</li></ol><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">A</span>긴 규정, 핵심만 쏙</div><div class=\"act-d\">수십 쪽짜리 규정도 <b>내가 알아야 할 것만</b> 먼저 뽑아요.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">이 문서에서 교육공무직원이 꼭 알아야 할 핵심 5가지를 쉬운 말로 정리해 줘. 각 항목 끝에 해당 조항 번호를 붙여 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">이 내용을 새로 온 동료에게 카톡으로 알려주듯 3줄로 요약해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act\"><div class=\"act-h\"><span class=\"act-code\">B</span>궁금한 것 물어보기 — 문서 근거로만</div><div class=\"act-d\"><b>질문만 바꿔서</b> 여러 번 써 보세요.</div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요</span><span class=\"prompt-text\">열어 둔 문서에 있는 내용만 근거로 답해 줘. 질문: 연차휴가는 1년에 며칠이고, 어떤 조건이 있어? 답변에는 해당 조항 번호를 함께 알려 주고, 문서에 없는 내용이면 추측하지 말고 “문서에서 확인 불가”라고 답해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">같은 방식으로 답해 줘. 질문: 병가는 며칠까지 쓸 수 있고, 진단서는 언제 필요해?</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-text\">같은 방식으로 답해 줘. 질문: 경조사 휴가는 어떤 경우에 며칠이야? 표로 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"act skill-red\"><div class=\"act-h\"><span class=\"act-code\">/</span>⚡ 스킬로 저장: <b>/문서만근거</b></div><div class=\"act-d\">이 문장을 <b>/문서만근거</b>로 저장하고, 뒤에 질문만 이어서 쓰세요. 예: <b>/문서만근거</b> 병가는 며칠이야?</div><div class=\"prompt-card\"><span class=\"prompt-text\">열어 둔 문서에 있는 내용만 근거로 답해 줘. 답마다 해당 조항이나 쪽수를 붙이고, 문서에 없는 내용은 추측하지 말고 “문서에서 확인 불가”라고 적어 줘. 내 질문은 이 문장 다음에 이어서 쓸게.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"warn\">⚠️ <b>“문서에 없으면 확인 불가”</b> 한 줄이 핵심이에요. 이 말을 빼면 제미나이가 그럴듯한 규정을 <b>지어낼 수</b> 있어요(할루시네이션). 규정은 개정될 수 있으니 <b>최종 판단은 최신 원문과 담당자 확인</b>으로!</div><div class=\"lens-note\">💡 긴 기사·공문도 똑같아요. 연 상태에서 제미나이 창(✨) 열기 → “<b>이 글에서 핵심만 정리해 줘</b>”.</div><div class=\"gm-back\"><button onclick=\"gmTop()\">⬆ 순서표로 돌아가기</button></div></div></li></ul><div class=\"a3-blocktt\">➕ 더 나아가기 (옵션)</div><p class=\"item-lead\" style=\"margin:0 0 12px\">시간이 남거나 연수 끝나고 천천히 해보세요.</p><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑨ 할루시네이션 줄이는 지침 설정<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">제미나이에 아래 <b>지침</b>을 먼저 붙여넣으면, 근거 없는 답(<b>할루시네이션</b>)을 줄이고 <b>검증·출처·검색</b>까지 챙겨줘요. <span style=\"color:#c0303a\"><b>[OO님]</b></span> 자리에 본인 호칭을 넣어 쓰세요.</p><div class=\"prompt-card\"><span class=\"prompt-text\">나를 [OO님]이라고 불러줘.<br>1. 정확성 우선: 확실한 근거가 없으면 “현재 데이터로는 확인할 수 없습니다”라고 정직하게 답변할 것. 추측은 금지한다.<br>2. 검증 절차: 답변을 내놓기 전, 반드시 내부적으로 사실 관계를 먼저 나열하고(Chain of Thought) 그 논리적 흐름에 따라 단계별로 설명할 것.<br>3. 링크 첨부: 언급한 수치나 법령, 학술 자료는 가급적 확인할 수 있는 공식 URL을 함께 제시할 것.<br>4. 최신 검색: 근거가 되는 문서나 데이터가 부족하다면, 추측하지 말고 검색 도구(Google Search)를 활용해서 확인해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑩ 📅 Gmail·캘린더 연동 — 모아보기 · 안 될 때<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">앞 실습 중간중간에 이미 해봤어요. 여기엔 <b>모아보기</b>와 <b>안 될 때 대처법</b>만 정리했어요.</p><div class=\"goldbox\"><div class=\"a3-subtt\">🔁 앞에서 해본 연결</div><ol class=\"steps\"><li><b>⑥ 요리 (조리 직종)</b> — 명절 준비 시간표 → 캘린더</li><li><b>⑦ 업무 미션</b> — 후문 안내 → Gmail 초안</li></ol></div><ol class=\"steps\"><li><b>개인 구글 계정</b>으로 로그인한 크롬에서 제미나이 창(✨) 열기</li><li>처음 요청하면 <b>Google 앱(Gmail·캘린더) 연결</b>을 묻는 창 → <b>허용</b></li><li>제미나이가 “추가할까요?”라고 보여주면 <b>내용 확인 후</b> 승인</li></ol><div class=\"act act-cal\"><div class=\"act-h\"><span class=\"act-code\">📬</span>(옵션) 내 메일함에서 마감일만 뽑기</div><div class=\"act-d\">메일이 많아 놓치는 마감, 표 한 장으로 챙겨요.</div><div class=\"prompt-card\"><span class=\"prompt-text\">내 Gmail에서 최근 일주일 동안 받은 메일 중 “연수”나 “제출”이 들어간 메일을 찾아, 마감일과 해야 할 일만 표로 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"warn\">⚠️ <b>메일은 ‘초안’까지만</b> 만들고, 받는 사람·내용을 확인한 뒤 <b>보내기는 직접</b> 누르세요. 학생·보호자 개인정보는 메일에 넣지 마세요.</div><div class=\"lens-note\">💡 <b>기관 계정</b>이나 관리되는 크롬에서는 연결이 막혀 있을 수 있어요. 안 되면 <b>gemini.google.com</b>에서 같은 문장 앞에 <b>@Gmail</b> · <b>@Google 캘린더</b>를 붙여 보세요. 메뉴 이름·지원 범위는 업데이트로 달라질 수 있어요.</div></div></li></ul></div></div></div>", "canva": "<div class=\"c1x\"><h2 class=\"s-title\">🎨 캔바 코드 — 말로 만드는 '작동하는 도구'</h2><p class=\"s-sub\">코딩 몰라도, 한국어로 설명만 하면 계산기·체크리스트·룰렛 같은 <b>실제 작동하는 웹앱</b>이 만들어져요 (무료 계정 OK)</p><div class=\"gmx-hero\"><div class=\"gmx-kick\">🎨 캔바 코드 · 이 도구는?</div><h2 class=\"gmx-h\">말로 부탁하면 <span class=\"g\">앱</span>이 됩니다</h2><p class=\"gmx-desc\">캔바에 \"이런 걸 만들어 줘\"라고 한국어로 설명하면, 캔바가 코드를 써서 바로 쓸 수 있는 도구를 만들어 줘요. 결과를 보고 \"이건 빼 줘 / 이것도 넣어 줘\"로 계속 다듬으면 돼요 — 이게 바이브코딩이에요.</p><a class=\"gmx-vbtn\" style=\"text-decoration:none\" href=\"https://frgavgas.my.canva.site/coffee-roulette-web-app\" target=\"_blank\" rel=\"noopener\">☕ 강사 완성본 · 커피 주문 정리 &amp; 셔틀 룰렛 열기 →</a></div><div class=\"block open\"><div class=\"block-body\"><div class=\"a3-blocktt\">🚀 시작하기</div><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 캔바 코드(Canva Code)란?<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">캔바에 <b>한국어로 설명</b>만 하면, 캔바가 코드를 써서 <b>실제로 작동하는 위젯·도구</b>를 만들어 줘요. 코딩 지식이 전혀 없어도 되고 <b>무료 계정</b>도 돼요.</p><ol class=\"steps\"><li>만든 결과는 캔바 안에서 쓰거나 <b>웹사이트로 게시</b>해 링크·QR로 나눠요</li><li>입력받은 내용은 <b>캔바 데이터 시트</b>에 모여요 → 그래서 <b>개인정보·성적은 넣지 않도록</b> 안내하세요</li><li>파일로 내보내기는 안 되고, 링크로 공유해요</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 캔바 가입 + Code 켜기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><a class=\"link-btn\" style=\"margin:4px 0\" href=\"https://www.canva.com/\" target=\"_blank\" rel=\"noopener\">🖊️ 캔바 가입하기 (처음이라면 먼저!) ↗</a><a class=\"link-btn\" style=\"margin:4px 0\" href=\"https://www.canva.com/brand/join?token=FndXt3CvV6TNLHwHyFLjTA&amp;brandingVariant=edu&amp;invitationDestinationType=group\" target=\"_blank\" rel=\"noopener\">✉️ 캔바 초대 링크 열기 (가입 다음에 꼭!) ↗</a><div class=\"lens-note\">💡 <b>가입 먼저 → 그다음 초대 링크</b> 순서예요. 가입 전에 초대 링크를 누르면 참여가 안 될 수 있어요. 참여가 안 보이면 캔바 왼쪽 위 계정 이름을 눌러 팀을 바꿔 보세요.</div><ol class=\"steps\"><li><a href=\"https://www.canva.com/\" target=\"_blank\" rel=\"noopener\">www.canva.com</a> 접속 → <b>가입</b> → <b>Google로 계속하기</b>로 개인 Gmail 선택 (오늘 제미나이와 같은 계정이면 편해요)</li><li>Pro 체험 안내가 나오면 <b>건너뛰기</b> — 무료 계정으로 오늘 실습 전부 가능해요</li><li>캔바 홈에서 <b>[Code]</b> 선택 (또는 디자인 안에서 <b>Canva AI → Code</b>)</li><li>아래 부탁문을 복사해 붙여넣고, 결과가 마음에 안 들면 채팅으로 계속 다듬기(\"숫자 더 크게\", \"색을 남색으로\")</li></ol><div class=\"lens-note\">💡 학교·기관 메일 계정은 관리자 설정 때문에 일부 기능이 막혀 있을 수 있어요 — <b>개인 Gmail</b>을 권해요.</div></div></li></ul></div></div><div class=\"block open\"><div class=\"block-body\"><div class=\"a3-blocktt\">☕ 먼저 재미있는 것부터 — 커피 셔틀 룰렛</div><p class=\"item-lead\" style=\"margin:0 0 12px\">첫 실습은 <b>\"와, 이게 진짜 되네?\"</b> 하는 게 좋아요. 이름·메뉴를 입력하면 주문을 자동 정리하고, 룰렛으로 오늘 커피 사러 갈 사람까지 뽑아 줘요.</p><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사하세요 · 커피 셔틀 룰렛</span><span class=\"prompt-text\">이름과 메뉴를 입력하면 목록에 저장되고, 돌림판(룰렛)을 돌려서 오늘 커피 사러 갈 사람을 랜덤으로 뽑아주는 웹앱을 만들어줘. 당첨되면 전체 주문 목록도 정리해서 보여주고, 스마트폰에서도 잘 보이게 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><a class=\"link-btn\" style=\"margin:8px 0\" href=\"https://frgavgas.my.canva.site/coffee-roulette-web-app\" target=\"_blank\" rel=\"noopener\">✅ 강사 완성본 · 커피 주문 정리 &amp; 셔틀 룰렛 열기 ↗</a><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🗣️ 대화하며 완성해 가기 (이게 바이브코딩!)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">처음 결과가 나오면, 그걸 보고 <b>\"이런 기능 추가해 줘 / 이건 빼 줘\"</b>라고 이어서 말하면 원하는 대로 다듬어져요. 실제로 이렇게 완성해 간 순서예요.</p><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 ① 새 접수용 초기화 버튼 추가</span><span class=\"prompt-text\">데이터 시트 어디와 연결이 되는 거야? 그리고 이 커피 접수가 한 건이 끝나고 다음 건을 처리할 때는 데이터를 비우고 새로 시작해야 할 것 같은데, 새 접수용 초기화 버튼 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 ② 메뉴별 개수로 정리 + 메뉴 누르면 신청자 이름 보기</span><span class=\"prompt-text\">룰렛 돌리는 것과 상관없이 전체 주문은 항상 정리되게 해주고, 같은 메뉴는 개수로 볼 수 있게 아래에 정리해줘. 전체 주문 정리에서 아이스 아메리카노처럼 각 메뉴를 누르면, 그 메뉴를 신청한 사람들의 이름이 나오게 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 ③ 자주 쓰는 메뉴는 칩(버튼)으로</span><span class=\"prompt-text\">자주 주문하는 메뉴는 버튼(칩)으로 눌러서 고르게 해 줘. 칩 메뉴: 아이스 아메리카노, 따뜻한 아메리카노, 카페라떼, 바닐라라떼, 콜드브루, 녹차라떼, 아이스티, 안 마셔요. 칩을 누르면 그 메뉴 이름이 아래 입력칸에 바로 채워지게 해 줘. 칩에 없는 메뉴는 직접 쓸 수 있게 해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"lens-note\">💡 <b>원하는 게 있으면 예시와 동작을 적어 주세요.</b> \"메뉴를 칩으로\"만 말하면 AI가 메뉴를 알아서 고르고 동작도 제멋대로 정해요. <b>메뉴 목록</b>과 <b>\"누르면 입력칸에 채워지게\"</b>를 함께 적으면 한 번에 원하는 대로 나와요. 한꺼번에 많이 시키면 하나가 빠질 수 있으니, 결과를 보고 빠진 것만 다시 부탁하세요.</div></div></li></ul></div></div><div class=\"block open\"><div class=\"block-body\"><div class=\"a3-blocktt\">🧰 업무에 바로 쓰는 쉬운 도구 — 한두 줄이면 2~3분</div><p class=\"item-lead\" style=\"margin:0 0 12px\">오늘 몸풀기로 하나 골라 보세요. 부탁문을 복사해 캔바 Code에 붙여넣기만 하면 돼요.</p><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">👥 당번·조 랜덤 뽑기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 당번/조 뽑기</span><span class=\"prompt-text\">이름들을 입력하면 원하는 인원수의 조로 랜덤하게 나눠주는 조 뽑기 웹앱을 만들어줘. 결과는 큰 글씨 카드로 보여주고, 다시 섞기 버튼도 넣어줘. 스마트폰에서도 잘 보이게 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"lens-note\">💡 여러 사람이 각자 휴대폰으로 이름을 넣게 하려면 \"참여자가 자기 이름을 직접 입력하게 해줘\"를, 담당자만 조를 나누게 하려면 \"담당자 비밀번호 [숫자 4자리]로 조 나누기 버튼을 잠가줘\"를 이어서 부탁하세요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🎤 발표·회의 순서 뽑기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 순서 뽑기</span><span class=\"prompt-text\">이름을 입력하면 발표(또는 회의) 순서를 랜덤으로 정해주는 웹앱을 만들어줘. 한 명씩 뽑히는 애니메이션으로 보여주고, 끝난 사람은 표시할 수 있게 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🗳️ 즉석 투표<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 즉석 투표</span><span class=\"prompt-text\">항목을 입력하면 사람들이 눌러서 투표하고 막대그래프로 결과를 보여주는 즉석 투표 웹앱을 만들어줘. 스마트폰에서도 잘 보이게 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⏰ 활동·회의 타이머<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 타이머</span><span class=\"prompt-text\">활동 이름과 시간을 입력하면 활동별로 카운트다운 해주는 타이머 웹앱을 만들어줘. 숫자는 뒤에서도 보이게 아주 크게, 시간이 끝나면 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🗓️ 행사·마감 D-day 안내판<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · D-day</span><span class=\"prompt-text\">시작일과 마감일(또는 행사일)을 입력하면 마감까지 며칠 남았는지 D-day로 크게 보여주고, 진행률 바도 함께 보여주는 안내 웹앱을 만들어줘. 공지용으로 남색+금색 톤으로 깔끔하게.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">✅ 준비물·업무 체크리스트<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 체크리스트</span><span class=\"prompt-text\">해야 할 일을 체크하면 진행률 바가 차오르는 체크리스트 웹앱을 만들어줘. 항목 예: 공문 접수, 품의 작성, 물품 확인, 안내문 발송, 결재 상신. 다 체크하면 축하 화면을 보여줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🖐️ 자주 묻는 질문(FAQ) 안내판<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · FAQ 안내판</span><span class=\"prompt-text\">질문과 답을 넣으면 검색창과, 누르면 펼쳐지는 목록으로 보여주는 FAQ 안내 웹앱을 만들어줘. 질문 예시: 증명서 발급, 교육비 신청, 방과후 신청, 급식 문의, 사무실 위치 (답은 ○○로 비워 둬). 스마트폰에서도 잘 보이게.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🧮 간단 계산기 (개인정보 없이)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 부탁문 · 예산·금액 합산 계산기</span><span class=\"prompt-text\">항목 이름과 금액(또는 수량·단가)을 입력하면 합계를 계산하고 항목별 비율을 막대로 보여주는 웹앱을 만들어줘. 결과 옆에 계산식도 보여주고, 숫자는 화면에서 바꿀 수 있게 해줘. 개인정보(이름)는 받지 마.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"lens-note\">⚠️ 실제 <b>규정 수치·금액 기준</b>은 반드시 확인한 뒤 넣으세요. 캔바 코드는 계산 \"틀\"을 빠르게 만들어 줄 뿐, 규정 자체를 보장하진 않아요.</div></div></li></ul></div></div><div class=\"block open\"><div class=\"block-body\"><div class=\"a3-blocktt\">🔎 강사가 해 보니 · 게시하기 · 주의</div><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⚖️ 같은 부탁문, 도구마다 다른 결과 (제미나이·캔바·클로드)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><p class=\"item-lead\">교육행정직 연수에서 똑같은 <b>시간외수당 계산기</b> 부탁문을 제미나이·캔바·클로드에 그대로 넣어 봤어요. 부탁문이 같아도 결과는 모두 달랐고, 그때는 클로드가 계산 정확도·디자인 모두 가장 완성도가 높았어요.</p><a class=\"link-btn\" style=\"margin:4px 0\" href=\"https://doramge1984.github.io/moneycheck/\" target=\"_blank\" rel=\"noopener\">🟣 클로드 결과 보기 ↗</a><a class=\"link-btn\" style=\"margin:4px 0\" href=\"https://share.gemini.google/v4VqxLrdQMwb\" target=\"_blank\" rel=\"noopener\">🔵 제미나이 결과 ↗</a><a class=\"link-btn\" style=\"margin:4px 0\" href=\"https://yimid.my.canva.site/2026\" target=\"_blank\" rel=\"noopener\">🎨 캔바 결과 ↗</a><div class=\"lens-note\">👉 한 번에 완벽을 기대하지 말고, <b>여러 번 시켜 보고 가장 나은 걸 고르고 다듬는 것</b>이 정상이자 실력이에요. 캔바는 웹앱 특화, 제미나이는 범용, 클로드는 긴 지시를 꼼꼼히 — 뒤의 AI가 서로 달라요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🌐 웹사이트로 게시하고 패들렛에 올리기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>오른쪽 위 <b>웹사이트 게시</b>(고쳤다면 <b>변경 사항 게시</b>)를 누릅니다</li><li>\"웹사이트를 게시했어요\"가 뜨면 <b>웹사이트 URL</b>(○○.my.canva.site/…)을 복사합니다</li><li>패들렛 탭에 \"부서 · 앱 이름\"으로 올려 함께 봐요</li></ol><div class=\"lens-note\">⚠️ 캔바가 <b>\"이 사이트를 여는 모든 사용자가 수집된 데이터에 접근할 수 있어요\"</b>라고 알려 줘요. 주소를 받은 사람은 입력된 내용(이름·주문 등)을 볼 수 있으니 <b>개인정보·성적은 절대 넣지 마세요.</b></div></div></li></ul><div class=\"item-note\">💡 AI가 \"이건 안 돼요\"라고 알려 주는 부분이 곧 그 도구의 한계예요. 꼭 막아야 하면 \"그 버튼도 담당자 모드 안으로 옮겨 줘\"처럼 한 번 더 부탁하세요. 입력된 이름이 캔바 시트에 모이니, 끝나면 <b>데이터를 비워</b> 주세요.</div></div></div></div>", "notebook": "<h2 class=\"s-title\">📓 노트북LM (NotebookLM)</h2><p class=\"s-sub\">내가 올린 자료로만 답하는 나만의 AI 비서 — 법령·지침·매뉴얼을 넣고 물어보기</p><div class=\"block open\" id=\"d3-step4\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">STEP 3</span><span class=\"block-t\">노트북LM 기본 — 전용 도서관으로 내 문서 다루기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><p class=\"a3-intro\">오직 <b>내가 올린 자료로만</b> 답하는 NotebookLM으로 ‘내 문서 기반 나만의 AI 비서’를 만듭니다. 💡 공통 업무는 지원이(G-ONE)에게, <b>보안·내 업무 문서는 내 챗봇(NotebookLM)</b>에게 맡깁니다.</p><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\" id=\"d3-4-1\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📚 궁극의 무기 — 당신만의 ‘전용 도서관’ NotebookLM<span class=\"ichev\">▾</span></div><div class=\"item-body\"><img class=\"a3-img\" src=\"ai3img/nlm-library.png\" alt=\"nlm-library.png\" loading=\"lazy\"><div class=\"item-lead\">NotebookLM은 오직 내가 업로드한 자료로만 답변을 생성하는 <b>출처 기반(Source-Grounding) AI</b>입니다.</div><ol class=\"steps\"><li><b>강력한 보안과 정확성</b> — 내 문서에 없는 내용은 지어내지 않아 환각이 거의 없고, 업로드 자료를 <b>AI 학습에 절대 활용하지 않아</b> 보안이 안전</li><li><b>압도적 대용량</b> — 노트북 1개당 최대 50개 소스, 소스당 최대 50만 단어. PDF·구글문서·슬라이드·URL·유튜브·텍스트 지원, 현재 무료</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com\" target=\"_blank\" rel=\"noopener\">📓 NotebookLM 열기</a></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">[구축하는 핵심 순서] — 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>NotebookLM 접속 → <b>[새 노트북]</b> 생성</li><li>내 업무 자료(운영 지침·행정 규정·작년 기안문 등)를 소스로 업로드</li><li>질문 입력 → AI가 업로드 자료에만 근거해 답하고 <b>출처 위치를 인용</b>으로 표시</li><li>문서 내용을 마인드맵·오디오 개요(팟캐스트)·FAQ 등으로 자동 정리·활용</li></ol></div></div></li><li class=\"item-detail coll\" id=\"d3-4-2\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📝 노트북LM 예시 ① — 작년 기안문 마스터 AI<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">작년 결재 문서와 운영 지침만 넣어두면, “작년 기안문 참고해서 올해 ○○ 계획서 써줘” 한마디에 <b>예산 과목·법령 근거까지 반영한 초안</b>을 몇 초 만에 만들어 줍니다.</div><ol class=\"steps\"><li><b>‘전임자 파일 찾기’의 종말</b> — 옛날 파일(K-에듀파인·USB·공유폴더) 뒤지던 시간 절약</li><li><b>기안문 교정 스트레스 해소</b> — AI가 초안을 행정실 스타일(법령 근거·서식)로 1차로 잡아줌</li><li><b>감사 대비·규정 준수</b> — 검증된 우리 부서 자료 안에서만 답을 찾아 정확도 상승</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com/notebook/4937ceff-a1bd-49ae-812d-a89aa54637ae\" target=\"_blank\" rel=\"noopener\">📓 예시 노트북 열어보기 — 작년 기안문 마스터</a></div><img class=\"a3-img\" src=\"ai3img/notebooklm-guide.png\" alt=\"notebooklm-guide.png\" loading=\"lazy\"><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📋 학교 행정실 맞춤형 공문서 작성 프롬프트 (6종) — 복사해서 실습<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"pc-label\">1 · 사후조치 — 시설물 파손·변상 요청</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">업로드된 6번 기안문의 ‘허가 조건’을 참고해 줘. ‘지역 배드민턴 동호회’가 지난 토요일 체육관 대관 중 ‘출입문 유리창 및 네트 지주대’를 파손했어. 학교 시설 개방 조례를 근거로, 원상복구를 요구하는 내부 결재용 기안문과 외부 단체 발송용 공문(시행문) 초안을 분리해서 작성해 줘. 5월 25일까지 조치 기한과 미이행 시 허가 취소 불이익을 포함해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">2 · 관재 — 불용 처리 및 신규 구매 동시</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">올해 ‘노후 교육용 태블릿 PC 30대’를 불용 처리하고 ‘최신형 노트북 30대’를 새로 사려고 해. 10번 기안문을 참고해 태블릿 폐기 계획안을, 5번 기안문을 참고해 대당 80만 원 신규 노트북 구매 계획 기안문을 각각 분리해서 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">3 · 예산/행정 — 기존 계획 답습·조정</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">3번 기안문(학교운영위원회 개최 공고)을 참고해 줘. 이번 제251회 임시회에서는 ‘2026학년도 제2차 추가경정 예산(안)’을 심의해. 지난 1차보다 예산 10% 증액, ‘교육환경 개선비’ 비중을 대폭 높인 내용을 주요 안건으로 포함해 임시회 개최 공고 기안문 초안을 새로 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">4 · 구매 — 반복되는 물품 구매</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">5번 기안문(학교 물품 구매 보고)을 참고해 줘. 올해는 ‘과학실 학생용 태블릿 PC 20대’, 대당 50만 원, 예산 과목은 ‘학교회계-정보화교육-자산취득비’야. 기존과 동일한 법령을 근거로 기안문 초안을 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">5 · 행정/안전 — 점검 결과를 기안문으로</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">8번 기안문(학교 환경위생 측정 결과) 형식을 참고해 ‘2026학년도 하반기 정기 공기질 측정 결과 보고’ 기안문을 써줘. 모든 교실 ‘적합’이지만 ‘과학실 이산화탄소 수치가 다소 높아 환기 지도 필요’를 유지 관리 부분에 반영해 초안을 잡아줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">6 · 복무/수당 — 규정 준수 사전 검토</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">2번 기안문(교육공무직원 연장근무 명령)을 참고해 줘. 학부모 총회 준비로 교무실무사 2명에게 주말(토) 5시간 연장근무를 명령하려고 해. 근로기준법상 주 52시간 제한, 휴일 연장근무 가산율(1.5배)에 맞게 수당 산출 내역을 포함해 기안문 초안을 써줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></div></li><li class=\"item-detail coll coll-green\" id=\"d3-4-3\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🗄️ 노트북LM 예시 ② — 스마트 행정 아카이브<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">‘기안문 마스터’가 글을 대신 써주는 <b>손발</b>이라면, ‘스마트 행정 아카이브’는 흩어진 규정·매뉴얼·지침을 1초 만에 찾아 근거까지 짚어주는 <b>두뇌</b>입니다.</div><ol class=\"steps\"><li><b>“지침서가 법전보다 두꺼운데”</b> — 수백 페이지를 Ctrl+F로 헤매던 탐색 시간 제거</li><li><b>“징계 감액 비율이 어떻게 되더라?”</b> — 복잡한 규정도 근거·출처(페이지)까지 짚어줌</li><li><b>업무 인수인계·신규 자립 지원</b> — 아카이브 링크 하나로 신규도 고난도 급여·복무 처리</li></ol><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com/notebook/1a9c3f2b-955d-4edb-8f17-84f79651102c\" target=\"_blank\" rel=\"noopener\">📓 예시 노트북 열어보기 — 스마트 행정 아카이브</a></div><img class=\"a3-img\" src=\"ai3img/smart-archive.png\" alt=\"smart-archive.png\" loading=\"lazy\"><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">1️⃣ 교육행정 활용 ‘기초 프롬프트’ 가이드 (9종)<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"pc-label\">💰 급여/수당 ①</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">휴직 후 복직한 공무원이나 신규 발령자의 정근수당 지급을 위한 ‘실제 근무기간(월)’ 계산 방법과 산출 방식을 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">💰 급여/수당 ②</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">징계를 받은 공무원의 각종 수당(정근수당 가산금, 가족수당 등) 감액 지급 기준은 어떻게 돼?</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">💰 급여/수당 ③</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">경기도교육청 소속 기간제교원의 정근수당 지급 방식 변경 사항과 수당 지급 기준을 설명해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">📋 호봉 획정 ①</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">기간제교원 호봉을 획정할 때, 학위 취득 기간과 근무(또는 군 복무) 경력이 중복되면 어떻게 인정하고 계산해?</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">📋 호봉 획정 ②</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">시간강사 경력이 여러 학교에서 중복되거나 대학 조교 경력이 있으면, 경력 환산율과 계산법을 구체적 사례로 설명해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">👥 교육공무직 ①</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">2025년 기준 교육공무직원과 특수운영직군의 기본급·정기상여금 등 임금 지급 기준과 주요 변경 사항은 뭐야?</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">👥 교육공무직 ②</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">취업규칙에 따른 교육공무직원의 징계 종류와 감경 기준에 대해 요약해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">🎁 복지·NEIS ①</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">맞춤형 복지제도의 주요 변경 사항이나 복지점수 월할 계산 기준은 어떻게 돼?</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">🎁 복지·NEIS ②</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">나이스(NEIS) 일반행정 급여 작업 시, 기초자료 생성부터 급여대장 출력·마감까지 초보자가 확인해야 할 월별 작업 순서를 요약해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">2️⃣ 교육행정 맞춤형 ‘기획서’ 프롬프트 가이드 (6종)<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"pc-label\">🏫 행정실 — 교육공무직원 채용 계획서</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">아래 정보로 교육공무직원 채용 계획서를 작성해줘. 소스 파일의 채용 절차·구비서류 규정을 근거로. - 학교명: ○○초 - 직종: 조리실무사 1명 - 사유: 육아휴직 대체 - 기간: 2025.3~8 - 예산: 월 ○○만 원 / 구성: 배경·절차·구비서류·유의사항</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">🏫 행정실 — 급여업무 연간 운영 계획</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">아래 정보로 학교 급여업무 연간 운영 계획서를 작성해줘. 소스의 월별 수당 지급 일정·NEIS 절차를 근거로. - 학교명: ○○중 - 담당: 행정주무관 ○명 - 대상: 교원·교육공무직·기간제 / 구성: 월별 업무·주의사항·역할 분장</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">📘 지원청 — 신규 담당자 역량강화 연수 기획서</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">아래 정보로 연수 기획서를 작성해줘. NEIS 급여작업·복무관리·채용 규정을 교육 근거로. - 주관: ○○교육지원청 학교행정지원과 - 대상: 신규 행정실 직원 ○명 - 일정: 2025.3(1박2일) / 구성: 필요성·커리큘럼·예산·기대효과</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">📘 지원청 — 교육공무직 인력풀 운영 개선</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">아래 정보로 인력풀 운영 개선 계획서를 작성해줘. 대체인력 채용 절차·승인 기준을 근거로. - 관내 학교 ○○개교 - 등재 ○명 - 목표: 충원율 ○% 향상 / 구성: 현황·개선방안·일정·기대효과</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">💰 재무 — 맞춤형복지 연간 운영 계획서</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">아래 정보로 맞춤형복지 운영 계획서를 작성해줘. 복지항목·복지점수 기준을 근거로. - 대상: 공무원/교육공무직/기간제 - 예산 ○○백만 원 / 구성: 대상별 기준·신청 절차·일정·유의사항</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">🏫 교육지원과 — 기간제교원 운영 가이드</div><d 로 <b>인포그래픽·슬라이드·동영상</b>을 만들고, ‘지침’으로 챗봇의 톤까지 잡아 봅니다. 💡 프롬프트 박스의 복사 버튼과 ‘자세한 방법’ 토글을 함께 활용하세요.</p><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\" id=\"d3-5-1\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">💬 제작된 노트북을 구경하고 채팅해볼까요?<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">아래 ‘학교 행정 실무 및 기획 프롬프트 가이드’를 참고해, 노트북에 질문해 보세요.</div><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com/notebook/72426b72-ef6f-4c05-85ab-2f687fd5115e\" target=\"_blank\" rel=\"noopener\">📓 제작된 노트북LM 열기</a></div><img class=\"a3-img\" src=\"ai3img/nlm-chat.png\" alt=\"nlm-chat.png\" loading=\"lazy\"></div></li><li class=\"item-detail coll\" id=\"d3-5-2\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🎭 노트북LM 지침 — ‘행정비서’ 페르소나<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"a3-tip\">💡 지침을 넣으면 느낌이 달라집니다! 노트북LM에 아래 ‘행정비서’ 지침을 넣어 보세요.</div><div class=\"pc-label\">📋 복사용 — 노트북LM 지침</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">당신은 모든 규정을 꿰뚫고 있는 20년 차 베테랑 사무관 페르소나인 &#x27;행정비서&#x27;입니다.<br>동료 직원들이 업무를 정확하고 기분 좋게 처리할 수 있도록 다음 지침에 따라 응대하십시오.<br>1. 말투 및 태도 (반말 방어)<br>- 사용자의 말투가 어떠하든 당신은 항상 최고 수준의 격식과 친절함을 갖춘 경어체를 유지합니다.<br>- &quot;네, 선생님. 문의하신 규정을 찾아보았습니다.&quot;와 같이 동료를 존중하는 서두로 시작하십시오.<br>2. 답변의 원칙<br>- 철저한 팩트 체크: 외부 지식이나 추측을 섞지 말고, 오직 현재 노트북의 &#x27;소스&#x27; 탭 파일 내용으로만 답변하십시오.<br>- 가독성 중심: 복잡한 절차나 조건은 번호·표(Table) 형식으로 한눈에 정리하십시오.<br>- 정보 부재 시: &quot;죄송합니다, 선생님. 현재 규정집 내에서는 해당 내용을 확인할 수 없습니다.&quot;라고 정중히 안내하십시오.<br>3. 고정 출력 양식 (답변 하단 필수)<br>모든 답변 후 구분선을 긋고 아래를 기재하십시오.<br>- 참조 규정: [정확한 규정 명칭 및 조항]<br>- 근거 파일: [파일명]<br>- 💡 행정비서의 한마디: [실무 조언이나 &quot;오늘도 힘내세요!&quot; 같은 격려 1~2문장]</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://notebooklm.google.com\" target=\"_blank\" rel=\"noopener\">📓 NotebookLM 열기</a></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>채팅창 우측 상단 <b>채팅 설정(⚙️)</b> → <b>[맞춤]</b> 선택 → 위 지침 입력 → <b>[저장]</b></li></ol><img class=\"a3-img\" src=\"ai3img/notebook-instruction-set.png\" alt=\"notebook-instruction-set.png\" loading=\"lazy\"></div></div></li><li class=\"item-detail coll coll-green\" id=\"d3-5-3\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">🎨 디자인 프롬프트 예시<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">시각자료를 만들 때, 프롬프트 끝에 <b>스타일 키워드</b>를 붙이면 분위기가 확 바뀝니다.</div><div class=\"a3-tip\">💡 사용법 — “…를 <b>[칠판 스타일(교육용 슬라이드)]</b>로 만들어줘”처럼 원하는 키워드를 프롬프트 끝에 덧붙이세요. <span style=\"color:#8A6D1A\">(아래 키워드를 클릭하면 복사됩니다)</span></div><div class=\"kw-wrap\"><span class=\"kw-chip\" onclick=\"copyKw(this)\">페이퍼 컷아웃 아트 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">포토리얼리스틱 매크로 레고 디오라마</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">SaaS 대시보드 인포그래픽</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">환상적인 수채화</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">화이트보드 전략 회의형 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">핸드드로잉 노트북 필기</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">클레이 애니메이션 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">칠판 스타일(교육용 슬라이드)</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">일본 종이 만화책 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">빈티지/액션 코믹스 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">에디토리얼</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">스케치노트 스타일</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">스위스 그리드 인포디자인</span><span class=\"kw-chip\" onclick=\"copyKw(this)\">서류/리서치 데스크 스타일</span></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">스타일별 결과 예시 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><im
