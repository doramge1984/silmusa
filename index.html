v><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">예시 기본 · 만화 스타일 쉽게 만들기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"item-lead\"><b>예시 기본 · 학생 대상(만화 스타일) — 쉽게 만들기</b></div><div class=\"pc-label\">📋 복사용 프롬프트</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">학생들이 학교시설을 대여할 수 있는지에 대한 내용과 절차에 대한 슬라이드를 만들어줘.<br>[전체 디자인 설정]<br>- 톤: 꿈, 소년 만화, 반짝임<br>- 배경색: #FFFFFF / 텍스트: #000000 / 강조: 스크린 톤 그레이<br>- 이미지 스타일: 70-80년대 소년 만화 / 눈: 별이 들어간 큰 눈<br>- 타이포(제목): 둥근 고딕 또는 앤틱체 / 장식적이고 귀여움<br>학생들이 좋아할 만한 70-80년대 만화 스타일로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">▼ 결과 예시</div><img class=\"a3-img\" src=\"ai3img/slide-easy-result.png\" alt=\"slide-easy-result.png\" loading=\"lazy\"><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>소스 선택 → <b>[슬라이드 자료] ▸</b> → 형식 선택 → 설명에 프롬프트 입력 → <b>[생성]</b><img class=\"a3-img\" src=\"ai3img/slide-easy1.png\" alt=\"slide-easy1.png\" loading=\"lazy\"></li><li>완성!<img class=\"a3-img\" src=\"ai3img/slide-easy2.png\" alt=\"slide-easy2.png\" loading=\"lazy\"></li></ol><div class=\"a3-tip\">💡 단, 만들기 전 내용을 미리 보고 편집할 수 없습니다. 내용을 확인 후 편집하려면 아래 <b>심화 버전</b> 추천.</div></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">예시 심화 · 채팅으로 확인 후 만들기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><div class=\"item-lead\"><b>예시 심화 · 채팅으로 내용 확인 후에 만들기</b></div><div class=\"pc-label\">📋 복사용 프롬프트 ①</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">학생들이 학교시설을 대여할 수 있는지에 대한 내용과 절차를 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"pc-label\">📋 복사용 프롬프트 ②</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">학생들이 좋아할 만한 70-80년대 만화 스타일로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">▼ 결과 예시 (이미지를 누르면 슬라이드로 이동)</div><a href=\"https://notebooklm.google.com/notebook/547c5f2c-717a-45bb-9ac3-a8887a60a481/artifact/89abb973-f5bf-4b0b-a044-df8dcfa40e25\" target=\"_blank\" rel=\"noopener\" class=\"a3-imglink\"><img class=\"a3-img\" src=\"ai3img/slide-deep-result.png\" alt=\"slide-deep-result.png\" loading=\"lazy\"></a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>채팅 후 답변 → 메모에 저장 → 소스로 변환 → 해당 소스만 선택<img class=\"a3-img\" src=\"ai3img/slide-deep1.png\" alt=\"slide-deep1.png\" loading=\"lazy\"></li><li>선택 소스 → <b>[슬라이드 자료] ▸</b> → 발표자 슬라이드/자세한 자료 → 내용·디자인 프롬프트 → <b>[생성]</b><img class=\"a3-img\" src=\"ai3img/slide-deep2.png\" alt=\"slide-deep2.png\" loading=\"lazy\"></li><li>완성!<img class=\"a3-img\" src=\"ai3img/slide-deep3.png\" alt=\"slide-deep3.png\" loading=\"lazy\"></li></ol></div></div><div class=\"a3-sec\"><span class=\"a3-secn\">③</span><div><div class=\"a3-sectt\">동영상으로 만들기</div></div></div><div class=\"pc-label\">📋 복사용 — ① 내용 설명</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">휴직 후 복직한 공무원 및 신규 발령자의 정근수당 지급을 위한 &#x27;실제 근무기간(월)&#x27; 계산 방법을 설명해줘.<br>실제 근무기간 산정 기준, 직위해제 및 휴직 기간 포함 여부, 계산식 및 예시를 포함해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">▼ 결과 예시 (이미지를 누르면 동영상으로 이동)</div><a href=\"https://notebooklm.google.com/notebook/547c5f2c-717a-45bb-9ac3-a8887a60a481/artifact/dcd81c2f-e01c-4f29-adee-a685ddf0f156\" target=\"_blank\" rel=\"noopener\" class=\"a3-imglink\"><img class=\"a3-img\" src=\"ai3img/video-result.png\" alt=\"video-result.png\" loading=\"lazy\"></a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>소스 선택 → <b>[동영상 개요] ▸</b> → 형식 선택 → 프롬프트 입력 → <b>[생성]</b><img class=\"a3-img\" src=\"ai3img/video1.png\" alt=\"video1.png\" loading=\"lazy\"></li></ol></div></div></li></ul></div></div>", "c1": "<h2 class=\"s-title\">오늘부터 나도 디지털 에이스</h2><p class=\"s-sub\">크롬·구글 꿀팁과 확장 프로그램 활용법</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 로그인 제대로 하기 — 개인계정 · 기관계정 프로필 분리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>기본 중의 기본이지만 놓치기 쉬운 부분 — <b>보안</b>과 자료 관리에서 중요합니다</li><li><b>준비물: 개인계정과 기관계정 2개</b>를 미리 준비해 오세요</li><li>크롬 오른쪽 위 <b>프로필 아이콘</b> → <b>‘크롬(Chrome) 프로필 추가’</b>로 계정별 프로필 만들기<img class=\"doc-img\" src=\"login-profile-add.png\" alt=\"크롬 프로필 추가 → 새 Chrome 프로필 설정 화면\" loading=\"lazy\"></li><li>계정별 <b>프로필 사진 변경 / 테마 색상</b>으로 구분 → 어느 계정인지 한눈에<img class=\"doc-img\" src=\"login-taskbar.png\" alt=\"작업표시줄의 개인계정·기관계정 프로필 두 개\" loading=\"lazy\"><a class=\"link-btn faces-btn\" href=\"https://faces.notion.com/\" target=\"_blank\" rel=\"noopener\">🙂 프로필 사진 만들기 (Notion Faces)</a></li><li>계정별 <b>바탕화면 바로가기</b> 만들기<img class=\"doc-img\" src=\"login-shortcut.png\" alt=\"프로필 맞춤설정 · 아바타 선택 · 바탕화면 바로가기 만들기 화면\" loading=\"lazy\"></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 초간단 즐겨찾기 + 파비콘 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>미션</b>: 웹교안 · 제미나이 · 내가 자주 가는 사이트를 즐겨찾기 하고 <b>아이콘(파비콘)만</b> 3개 남기기</li><li>주소창 오른쪽 <b>별표(☆)</b>로 즐겨찾기 대신 <b>추파춥스(?)</b> 활용하기!</li><li>북마크에 <b>마우스 우클릭 → 수정 → 이름 지우기</b> → 아이콘(파비콘)만 남아 깔끔하고 빠르게 접속</li></ol><img class=\"doc-img\" src=\"bookmark-favicon.png\" alt=\"즐겨찾기 Before/After — 이름을 지우고 파비콘만 남긴 북마크\" loading=\"lazy\"></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 한방에 큐알코드 만들기 (크롬 / 엣지 다 가능)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>아직도 네이버 큐알 쓰시나요? <b>한방에 큐알코드 만드는 2가지 방법</b></li><li><b>방법 ① 마우스 우클릭</b> — 페이지에서 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·엣지 기본 기능)</li><li><b>방법 ② 크롬 확장 프로그램</b> — QR Code Generator 설치 후 클릭 한 번<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/qr-code-generator/afpbjjgbdimpioenaedcjgkaigggcdpp\" target=\"_blank\" rel=\"noopener\">🔳 QR Code Generator 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 캡처, 이렇게 하세요<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#c0392b\">(윈도우10은 안 돼요)</b></span></div></div><img class=\"doc-img\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\" style=\"margin-top:14px;\"><ol class=\"steps\"><li>캡처 <b>도구로 텍스트 복사</b>가 되는 거 아세요? — 캡처한 이미지 속 글자를 바로 복사<div class=\"cap-practice-label\">📄 아래 안내문의 글자를 <b>캡처 도구</b>로 복사해 보세요!</div><img class=\"doc-img\" src=\"notice-sample.png\" alt=\"캡처 연습용 안내문\" loading=\"lazy\" style=\"max-width:720px;margin:8px 0 6px;\"><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 캡처 도구에서 “모든 텍스트 복사” 위치 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"capture-text.png\" alt=\"캡처 도구 — 모든 텍스트 복사\" loading=\"lazy\" style=\"margin:6px 0 2px;\"><div class=\"cap-paste-label\">👇 복사한 텍스트를 여기에 붙여넣어 확인해 보세요</div><textarea class=\"cap-paste\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" spellcheck=\"false\"></textarea></div></details></li><li>더 편한 방법? → 다음 항목 <b>구글 렌즈</b>로 이어집니다</li></ol><button class=\"warmup-link\" onclick=\"showTab('warmup')\">🔥 워밍업 게임에서 직접 연습하기 →</button><div style=\"height:2.4em\"></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div></li><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④-1 (＋더 나아가기) 스크롤 캡처·편집이 편한 픽픽(PicPick)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">픽픽은 연수 중 <b>시간이 허락하면 설치해 실습</b>합니다.</div><ol class=\"steps\"><li>① <b>스크롤 캡처</b> — 긴 페이지를 한 장으로 쭉!</li><li>② <b>동영상 녹화</b> 가능</li><li>③ 캡처 이미지에 <b>모자이크 처리 · 번호 순서 자동 매기기</b> 등 다양한 편집 기능</li><li>설치 파일 내려받기 →<br><a class=\"link-btn\" href=\"https://picpick.app/ko/download/\" target=\"_blank\" rel=\"noopener\">🖼️ 픽픽(PicPick) 다운로드</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 구글 렌즈 — 화면 속 글자·이미지를 바로 활용 (엣지 X / 크롬 O)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">관련 내용(웹·이미지 등)을 <b>오른쪽 창</b>에서 바로 확인할 수 있어요.</div><ol class=\"steps\"><li><b>텍스트 복사</b> — 화면 속 글자를 복사 → <kbd>doc.new</kbd>로 구글 독스를 열어 붙여넣어 잘 됐는지 확인<div class=\"cap-practice-label\" style=\"margin-top:8px;\">📄 이 안내문의 글자를 캡처해서 복사해 보세요!</div><img class=\"doc-img\" src=\"notice-sample.png\" alt=\"캡처 연습용 안내문\" loading=\"lazy\" style=\"max-width:520px;margin:6px 0 4px;\"></li><li><b>이미지로 복사</b> — 복사한 이미지를 PPT·캔바 등 <b>어디든 붙여넣기</b>(캡처 불필요) → <kbd>slide.new</kbd>로 구글 슬라이드에서 확인<div style=\"margin-top:10px;\"><a class=\"yt-btn\" href=\"https://www.youtube.com\" target=\"_blank\" rel=\"noopener\">▶ 유튜브 홈 열기</a></div></li><li><b>번역</b> — 화면 속 외국어를 바로 번역<div class=\"cap-practice-label\" style=\"margin-top:8px;\">🌍 이 외국어 간판을 캡처해서 번역해 보세요!</div><img class=\"doc-img\" src=\"translate-sample.png\" alt=\"번역 실습 — 외국어 간판\" loading=\"lazy\" style=\"max-width:520px;margin:6px 0 4px;\"></li></ol><div class=\"item-note\">💡 <b>구글 렌즈가 안 뜨면?</b> ① 크롬인지 확인(크롬만 됩니다, 엣지 X) · ② ⋮ → 도움말 → Chrome 정보 → 최신으로 업데이트 · ③ 그래도 안 되면 ⋮ → 설정 → 검색엔진을 ‘Google’로</div><a class=\"gsearch-btn\" href=\"https://www.google.com/search?udm=2&amp;q=쇼파\" target=\"_blank\" rel=\"noopener\">🔍 “쇼파” 이미지 검색 결과 보기</a><div class=\"cap-practice-label\" style=\"margin-top:24px;\">📐 이 수학 문제를 캡처해서 <b>구글 렌즈·제미나이</b>로 풀어보세요!</div><img class=\"doc-img\" src=\"math-problem.png\" alt=\"수학 문제 (캡처 실습)\" loading=\"lazy\" style=\"max-width:600px;margin:8px 0 4px;\"></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 모바일 구글 렌즈<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"lens-note\">📱 이 기능은 <b>갤럭시(삼성)폰</b>에서 사용할 수 있어요.</div><ol class=\"steps\"><li>휴대폰 <b>구글 앱 · 크롬</b>에서 카메라/이미지로 글자·사물·번역을 바로 인식<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📱 휴대폰에서 구글 렌즈 쓰는 법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"lens-mobile.png\" alt=\"휴대폰 구글 렌즈 사용 예시\" loading=\"lazy\" style=\"margin:6px 0 2px;\"><img class=\"doc-img\" src=\"lens-mobile2.png\" alt=\"휴대폰 구글 렌즈 — 사물·장소 인식 결과\" loading=\"lazy\" style=\"margin:10px 0 2px;\"></div></details></li><li><b>스마트폰으로 QR코드를 촬영해보자!</b><br>① 갤러리에서 이미지 <b>꾹 눌러</b> 링크 들어가기<br>② 스마트폰에 저장된 <b>QR 이미지</b>로 링크 들어가기<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 QR 촬영해서 링크 여는 방법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"qr-scan.png\" alt=\"QR 코드 스캔 → 링크 열기\" loading=\"lazy\" style=\"max-width:560px;margin:6px 0 2px;\"></div></details></li></ol></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 전체 글 가져오기 (복사 허용)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>구글 렌즈는 <b>일부 글만</b> 잡히고 <b>전체 글은 안 긁히는</b> 단점이 있어요<br><a class=\"link-btn\" href=\"https://blog.naver.com/lifeofempress/224011371130\" target=\"_blank\" rel=\"noopener\" style=\"margin:8px 0 2px;\">📖 예시 글 열기 — 네이버 블로그(한강 소설 리뷰)</a></li><li><b>복사 허용(Allow Copy)</b> 확장 프로그램이면 복사가 막힌 사이트에서도 전체 글을 쏙 복사<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/%EB%B3%B5%EC%82%AC-%ED%97%88%EC%9A%A9-+/ajhbdcgfhlhhmocddefknjjkejcfpbnj?hl=ko\" target=\"_blank\" rel=\"noopener\">📋 복사 허용 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ 툴바 설정 (분할뷰 · 큐알코드 · 구글 렌즈 등)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>자주 쓰는 기능(분할뷰 · 큐알코드 · 구글 렌즈 등)을 <b>툴바에 꺼내두면</b> 클릭 한 번으로 사용<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🧰 툴바에 꺼내두는 방법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"toolbar-settings.png\" alt=\"크롬 툴바 설정 화면\" loading=\"lazy\" style=\"max-width:360px;margin:6px 0 2px;\"></div></details></li><li>설정: <b>크롬 맞춤설정 → 툴바</b> → 원하는 도구 켜기</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑨ 탭 그룹 활용 (업무별 탭 정리)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>여러 탭을 <b>업무별로 묶어</b> 색·이름으로 정리 — 예: ‘예산’ · ‘시설’ · ‘공문’ 그룹</li><li>만들기: 탭 <b>우클릭 → 새 그룹에 탭 추가</b> → 이름·색 지정</li><li>그룹을 <b>접으면</b> 화면이 깔끔, 다시 누르면 펼쳐져요 (저장 그룹으로 두면 창을 닫아도 유지)</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑩ 북마크바에 폴더 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>북마크바 <b>빈 곳에서 마우스 우클릭</b> → <b>폴더 추가</b></li><li>폴더 <b>이름 지정</b> (예: 업무 · 공문 · 자주 가는 사이트)</li><li>관련 사이트들을 <b>폴더 안으로 드래그</b>해 정리</li><li>💡 북마크바가 안 보이면 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd>로 켜기</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑪ 시크릿 모드 vs 게스트 모드<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>시크릿 모드 = ‘나’를 위한 보호</b> — 공용 PC에 내 흔적을 남기고 싶지 않을 때, 내가 만든 웹사이트 확인용<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🕵️ 새 시크릿 창 여는 방법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"incognito.png\" alt=\"크롬 새 시크릿 창 (Ctrl+Shift+N)\" loading=\"lazy\" style=\"max-width:560px;margin:6px 0 2px;\"></div></details></li><li><b>게스트 모드 = ‘남’을 위한 배려</b> — 내 컴퓨터를 학생·동료에게 잠시 빌려줄 때, 내 정보를 전혀 안 보여주고 빌려주기<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>👤 게스트 프로필 여는 방법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"guest-profile.png\" alt=\"크롬 게스트 프로필 열기\" loading=\"lazy\" style=\"max-width:360px;margin:6px 0 2px;\"></div></details></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑫ 내 계정 삭제 vs 원격으로 기기 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>상황: “내 컴퓨터가 아닌데 로그인하기가 꺼려져요” / “다른 기기 쓴 뒤 이 기기에서 제 아이디 완전 삭제해주세요”</li><li><b>내 계정 삭제</b>: 브라우저 프로필 → 크롬 프로필 관리 → <b>⋮(삼점)</b> → 삭제<details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🗑️ 크롬 프로필 삭제 방법 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"profile-delete.png\" alt=\"크롬 프로필 관리 → 삭제\" loading=\"lazy\" style=\"max-width:720px;margin:6px 0 2px;\"></div></details></li><li><b>원격으로 기기 관리</b>: 브라우저 프로필 → 구글 계정 관리 → 기기 → <b>로그아웃</b><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📲 구글 계정 → 기기에서 원격 로그아웃 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"device-manage.png\" alt=\"구글 계정 관리 → 기기 → 로그아웃\" loading=\"lazy\" style=\"max-width:720px;margin:6px 0 2px;\"><img class=\"doc-img\" src=\"device-list.png\" alt=\"내 기기 — 세션 선택 후 로그아웃\" loading=\"lazy\" style=\"max-width:760px;margin:10px 0 2px;\"></div></details></li></ol></div></li></ul></div></div>", "c2": "<h2 class=\"s-title\">구글폼 설문 1분 완성 · QR 배포</h2><p class=\"s-sub\">구글폼으로 행정실 설문 만들기</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① AI로 손쉽게 구글폼 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>주소창에 <kbd>form.new</kbd> 입력 → 새 구글폼 바로 열기</li><li><b>AI 모드</b>가 보이나요? 프롬프트 한 줄로 폼을 자동 생성</li><li>안 보이면 워크스페이스 랩스 가입(개인계정만 가능) — 무료 계정도 AI 기능 사용 가능<br><a class=\"link-btn\" href=\"https://workspace.google.com/experiments/\" target=\"_blank\" rel=\"noopener\">🔗 워크스페이스 랩스 가입하기</a><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🎬 워크스페이스 랩스 가입 방법 (이미지로 따라하기)</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"wslabs-1.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"><img class=\"doc-img\" src=\"wslabs-2.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"></div></details></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② AI로 설문 설계하기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이로 문항을 설계한 뒤 폼으로 옮기는 방법이에요. 아래 프롬프트를 <b>복사해서 바로</b> 써 보세요(상황에 맞게 바꿔도 좋아요).<div class=\"prompt-card\" style=\"margin-top:12px\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">이수증 취합 설문을 만들거야. 이름, 소속, 이수증 const unlocked={};for(var _k in P.open){unlocked[_k]=P.open[_k];}
let master=null;
function b64(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function dec(blob,pw){
 const salt=b64(blob.salt),iv=b64(blob.iv),ct=b64(blob.ct);
 const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:P.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
function isOpen(no){return unlocked[String(no)]!==undefined;}

 h+='<button class="tab" data-tab="home" onclick="showTab(\'home\')">🏠 홈</button>';

 return P.insHtml+P.padlet+P.sched;
}
async function renderDay(no){
 const panel=document.getElementById('panel');
 const back='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>';
 if(isOpen(no)){panel.innerHTML=back+unlocked[String(no)];return;}
 if(master!==null){try{unlocked[String(no)]=await dec(P.blobs[String(no)].master,master);panel.innerHTML=back+unlocked[String(no)];return;}catch(e){}}
 const m=P.meta.find(x=>x.no==no);
 panel.innerHTML=back+'<div class="lock-screen"><div class="big">🔒</div>'+
  '<h2>'+no+'일차 · '+m.title+'</h2><p>강사가 안내하는 <b>이번 일차 비밀번호</b>를 입력하면 열립니다.</p>'+
  '<div class="pw-row"><input id="pwi" type="password" placeholder="비밀번호" autocomplete="off" '+
  'onkeydown="if(event.key===\'Enter\')unlock('+no+')"><button onclick="unlock('+no+')">열기</button></div>'+
  '<div class="pw-err" id="pwe"></div></div>';
 setTimeout(()=>{const el=document.getElementById('pwi');if(el)el.focus();},50);
}
async function unlock(no){
 const inp=document.getElementById('pwi'),err=document.getElementById('pwe');
 const pw=inp.value.trim();if(!pw){err.textContent='비밀번호를 입력하세요.';return;}
 err.textContent='여는 중...';const b=P.blobs[String(no)];let plain=null,isM=false;
 try{plain=await dec(b.day,pw);}catch(e){}
 if(plain===null){try{plain=await dec(b.master,pw);isM=true;}catch(e){}}
 if(plain===null){err.textContent='비밀번호가 맞지 않습니다.';return;}
 unlocked[String(no)]=plain;if(isM)master=pw;renderDay(no);
}
function showTab(tab){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===String(tab)));
 const panel=document.getElementById('panel');
 const back='<span class="backhome" onclick="showTab(\'home\')">← 홈으로</span>';
 if(tab==='home'){panel.innerHTML=renderHome();}
 else if(tab==='gift'){panel.innerHTML=back+P.gift;}
 else if(tab==='setup'){panel.innerHTML=back+P.setup;}
 else if(tab==='warmup'){panel.innerHTML=back+P.warmup;initWarmup();}
 else if(tab==='c1'){panel.innerHTML=back+P.c1;}
 else if(tab==='gemini'){panel.innerHTML=back+P.gemini;}
 else if(tab==='c2'){panel.innerHTML=back+P.c2;}
 else if(tab==='hakwun'){panel.innerHTML=back+P.hakwun;}
 else if(tab==='notebook'){panel.innerHTML=back+P.notebook;}
 try{window.scrollTo(0,0);}catch(e){}
