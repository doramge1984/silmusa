s\"><li>채팅 후 답변 → 메모에 저장 → 소스로 변환 → 해당 소스만 선택<img class=\"a3-img\" src=\"ai3img/slide-deep1.png\" alt=\"slide-deep1.png\" loading=\"lazy\"></li><li>선택 소스 → <b>[슬라이드 자료] ▸</b> → 발표자 슬라이드/자세한 자료 → 내용·디자인 프롬프트 → <b>[생성]</b><img class=\"a3-img\" src=\"ai3img/slide-deep2.png\" alt=\"slide-deep2.png\" loading=\"lazy\"></li><li>완성!<img class=\"a3-img\" src=\"ai3img/slide-deep3.png\" alt=\"slide-deep3.png\" loading=\"lazy\"></li></ol></div></div><div class=\"a3-sec\"><span class=\"a3-secn\">③</span><div><div class=\"a3-sectt\">동영상으로 만들기</div></div></div><div class=\"pc-label\">📋 복사용 — ① 내용 설명</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">휴직 후 복직한 공무원 및 신규 발령자의 정근수당 지급을 위한 &#x27;실제 근무기간(월)&#x27; 계산 방법을 설명해줘.<br>실제 근무기간 산정 기준, 직위해제 및 휴직 기간 포함 여부, 계산식 및 예시를 포함해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"a3-subtt\">▼ 결과 예시 (이미지를 누르면 동영상으로 이동)</div><a href=\"https://notebooklm.google.com/notebook/547c5f2c-717a-45bb-9ac3-a8887a60a481/artifact/dcd81c2f-e01c-4f29-adee-a685ddf0f156\" target=\"_blank\" rel=\"noopener\" class=\"a3-imglink\"><img class=\"a3-img\" src=\"ai3img/video-result.png\" alt=\"video-result.png\" loading=\"lazy\"></a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">자세한 방법 — 토글을 열어주세요<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol class=\"steps\"><li>소스 선택 → <b>[동영상 개요] ▸</b> → 형식 선택 → 프롬프트 입력 → <b>[생성]</b><img class=\"a3-img\" src=\"ai3img/video1.png\" alt=\"video1.png\" loading=\"lazy\"></li></ol></div></div></li></ul></div></div>", "c1": "<div class=\"c1x\"><h2 class=\"s-title\">오늘부터 나도 디지털 에이스</h2><p class=\"s-sub\">크롬·구글 꿀팁과 확장 프로그램 활용법</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" style=\"color:#C0392B!important\" onclick=\"toggleItem(this)\">⓪ ⚙️ 시작 전 필수 — 크롬 최신으로<span class=\"hard-badge\">필수</span><span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hard-note\"><b>🔴 이것부터 하고 시작합니다.</b> <b>「✨ 크롬 속 제미나이」</b> 기능은 <b>최신 크롬</b>에서만 나타나요.</div><div class=\"a3-subtt\">삼점 ⋮ → 도움말 → Chrome 정보 → 최신 버전 확인</div><img class=\"a3-img\" src=\"chrome-update-1.png\" alt=\"크롬 삼점 메뉴에서 도움말 → Chrome 정보로 들어가 업데이트 후 다시 시작을 누르는 화면\" loading=\"lazy\"><div class=\"warn\">🔴 <b>［다시 시작］까지 꼭 누르세요.</b></div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">삼점 ⋮ → 설정 → 기본 브라우저 → Chrome으로</div><img class=\"a3-img\" src=\"chrome-default-2.png\" alt=\"크롬 설정에서 기본 브라우저를 Chrome으로 지정한 화면\" loading=\"lazy\"><div class=\"warn\">🔴 <b>“Chrome이 기본 브라우저로 설정되어 있습니다”</b>가 보이면 됩니다.</div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">삼점 ⋮ → 설정 → 검색엔진 → Google로</div><img class=\"a3-img\" src=\"chrome-search-3a.png\" alt=\"크롬 설정 검색엔진 화면에서 변경 버튼을 누르는 모습\" loading=\"lazy\"><img class=\"a3-img\" src=\"chrome-search-3b.png\" alt=\"검색엔진 목록에서 Google을 고르고 기본값으로 설정하는 모습\" loading=\"lazy\"><div class=\"warn\">🔴 <b>Google</b>을 고르고 <b>［기본값으로 설정］</b>까지 누르세요.</div><div class=\"a3-btns\" style=\"margin-top:14px\"><a class=\"link-btn\" style=\"background:#C0392B !important;border-color:#C0392B !important;color:#fff !important;font-size:16.5px\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 최신 버전 내려받기 &nbsp;→</a></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 로그인 제대로 하기 — 개인계정 · 기관계정 프로필 분리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>기본 중의 기본이지만 놓치기 쉬운 부분 — <b>보안</b>과 자료 관리에서 중요합니다</li><li><b>준비물: 개인계정과 기관계정 2개</b>를 미리 준비해 오세요</li><li>크롬 오른쪽 위 <b>프로필 아이콘</b> → <b>‘크롬(Chrome) 프로필 추가’</b>로 계정별 프로필 만들기<img class=\"doc-img\" src=\"login-profile-add.png\" alt=\"크롬 프로필 추가 → 새 Chrome 프로필 설정 화면\" loading=\"lazy\"></li><li style=\"margin-top:4.2em\"><b>⭐ 로그인할 때 “동기화 사용”을 꼭 켜세요</b> — 북마크·비밀번호·방문기록·확장 프로그램이 <b>구글 계정에 저장</b>돼요. 그래서 ① 어느 PC·기기에서든 <b>로그인만 하면 내 환경이 그대로 따라오고</b>, ② 실수로 지우거나 기기가 바뀌어도 <b>다시 로그인하면 복구</b>됩니다. <span style=\"color:#7b8494\">(로그인 직후 “동기화 사용” 안내가 뜨면 <b>［사용］</b> 클릭 · 이미 로그인돼 있으면 <b>프로필 아이콘 → 동기화 사용 켜기</b>)</span></li><li>계정별 <b>프로필 사진 변경 / 테마 색상</b>으로 구분 → 어느 계정인지 한눈에<img class=\"doc-img\" src=\"login-taskbar.png\" alt=\"작업표시줄의 개인계정·기관계정 프로필 두 개\" loading=\"lazy\"><a class=\"link-btn faces-btn\" href=\"https://faces.notion.com/\" target=\"_blank\" rel=\"noopener\">🙂 프로필 사진 만들기 (Notion Faces)</a><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 Notion Faces 사용법 보기 — 얼굴 꾸미고 저장하기</summary><div class=\"cap-help-body\"><p style=\"margin:6px 0 4px\">왼쪽에서 <b>피부톤 · 눈 · 눈썹 · 안경 · 코 · 입 · 머리카락 · 액세서리</b>를 차례로 골라 꾸민 뒤, 오른쪽 위 <b>［저장］</b>을 누르면 이미지로 내려받아져요. <span style=\"color:#7b8494\">(🔀 버튼을 누르면 무작위로 바꿔 줘요)</span></p><img class=\"doc-img\" src=\"notion-faces.png\" alt=\"Notion Faces 화면 — 왼쪽 메뉴에서 얼굴 부위를 고르고 오른쪽 위 저장 버튼 누르기\" loading=\"lazy\" style=\"max-width:760px;margin:6px 0 4px;\"><p style=\"margin:4px 0 0;color:#7b8494\">💡 저장한 이미지는 크롬 프로필 사진·구글 계정 사진으로 올리면, 개인·기관 계정을 한눈에 구분할 수 있어요.</p></div></details></li><li style=\"margin-top:4.2em\">계정별 <b>바탕화면 바로가기</b> 만들기<img class=\"doc-img\" src=\"login-shortcut.png\" alt=\"프로필 맞춤설정 · 아바타 선택 · 바탕화면 바로가기 만들기 화면\" loading=\"lazy\"></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 초간단 즐겨찾기 + 파비콘 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>미션</b>: 웹교안 · 제미나이 · 내가 자주 가는 사이트를 즐겨찾기 하고 <b>아이콘(파비콘)만</b> 3개 남기기</li><li>주소창 오른쪽 <b>별표(☆)</b>로 즐겨찾기 대신 <b>추파춥스(?)</b> 활용하기!</li><li>북마크에 <b>마우스 우클릭 → 수정 → 이름 지우기</b> → 아이콘(파비콘)만 남아 깔끔하고 빠르게 접속</li></ol><img class=\"doc-img\" src=\"bookmark-favicon.png\" alt=\"즐겨찾기 Before/After — 이름을 지우고 파비콘만 남긴 북마크\" loading=\"lazy\"><div style=\"height:2.6em\"></div><div class=\"goldbox\"><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">🔎 즐겨찾기바가 안 보이면 — 네 가지 방법<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ol class=\"steps\"><li><b>주소창에 붙여넣기 (가장 확실)</b> — 아래 주소를 주소창에 넣고 Enter → <b>［북마크바 표시］</b> 켜기<br><div class=\"prompt-card\" style=\"margin:10px 0 8px\"><span class=\"prompt-num\">🔗</span><span class=\"prompt-text\">chrome://settings/appearance</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><span style=\"color:#7b8494\">단축키도 메뉴 찾기도 필요 없어요.</span></li><li><b>새 탭 열어보기</b> — <kbd>Ctrl</kbd>+<kbd>T</kbd>. 크롬은 <b>새 탭 화면에서는 즐겨찾기바를 자동으로 보여줍니다.</b> 거기서 <b>우클릭 → ［북마크바 표시］</b>를 켜면 모든 화면에서 보여요</li><li><b>메뉴로</b> — 오른쪽 위 <b>⋮ → 북마크 및 목록 → ［북마크바 표시］</b><img class=\"doc-img\" src=\"bookmarkbar-menu.png\" alt=\"크롬 오른쪽 위 삼점 메뉴에서 북마크 및 목록을 거쳐 북마크바 표시를 누르는 화면\" loading=\"lazy\" style=\"max-width:720px;margin:10px 0 4px;\"><div style=\"color:#7b8494;font-size:14.5px\">▲ ① 오른쪽 위 <b>⋮</b> → ② <b>북마크 및 목록</b> → ③ <b>북마크바 표시</b> (빨간 네모 순서대로)</div></li><li><b>단축키</b> — <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> <span style=\"color:#7b8494\">(갤럭시북에서는 안 될 수 있어요 — 아래 참고)</span></li></ol><div class=\"item-note\">💡 <b>\"안 보인다\"는 분의 절반은 그냥 일반 페이지에 계신 겁니다.</b> 새 탭부터 한번 열어보시게 하세요.</div><div style=\"height:2.6em\"></div><details class=\"tiptog\"><summary>⌨️ <b>Ctrl+Shift+B를 눌러도 안 될 때</b> — 삼성 갤럭시북이라면</summary><div class=\"tiptog-body\"><div class=\"item-lead\">갤럭시북에는 <b>삼성 앱이 이 단축키를 먼저 가져가는</b> 경우가 있어요. 눌러도 즐겨찾기바는 안 나오고 <b>엉뚱한 창이 뜨거나 아무 반응이 없다면</b> 이 경우입니다.</div><div class=\"a3-subtt\">✅ 급할 땐 이것만 — 단축키를 안 쓰면 됩니다</div><ol class=\"steps\"><li>주소창 <b>바로 아래 빈 곳</b>에서 <b>마우스 우클릭 → ［북마크바 표시］</b></li><li>또는 오른쪽 위 <b>⋮ → 북마크 및 목록 → ［북마크바 표시］</b></li></ol><div class=\"warn\">🔴 <b>이 방법은 어느 노트북에서든 됩니다.</b> 연수 중이라면 여기까지만 하고 넘어가세요. 아래는 <b>연수 끝나고</b> 천천히 하시면 됩니다.</div><div class=\"a3-subtt\">1단계 · 범인부터 확인 (빅스비 잠시 끄기)</div><ol class=\"steps\"><li style=\"color:#C0392B\">화면 <b>우측 하단 작업 표시줄</b>(시계 옆)에서 <b>∧ (숨겨진 아이콘 표시)</b> 화살표 클릭</li><li style=\"color:#C0392B\">파란색 <b>Bixby 아이콘</b>을 <b>마우스 오른쪽 버튼</b>으로 클릭 → <b>［종료］</b> 선택</li><li>크롬으로 돌아가 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd>를 눌러 봅니다</li></ol><div class=\"item-note\">💡 <b>여기서 즐겨찾기바가 나왔다면 범인은 빅스비</b>입니다 → 2단계로 가세요.<br><b>그래도 안 되면 빅스비가 아닙니다.</b> 다른 삼성 앱일 수 있으니 붙들지 마시고 <b>위의 우클릭 방법</b>을 쓰세요.</div><div class=\"item-note\">💡 메뉴 이름이 <b>［종료］</b>가 아니라 <b>［끝내기］</b>로 보일 수도 있어요. 같은 뜻입니다.</div><div class=\"a3-subtt\">2단계 · 영구 해결 (시작 프로그램에서 제외)</div><ol class=\"steps\"><li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Esc</kbd>를 눌러 <b>작업 관리자</b>를 엽니다</li><li>왼쪽 메뉴에서 <b>［시작 앱］</b> 탭을 클릭합니다 <span style=\"color:#7b8494\">(속도계 모양 아이콘)</span></li><li>목록에서 <b>Bixby</b>를 찾아 <b>우클릭 → ［사용 안 함］</b></li><li>PC를 <b>다시 시작</b>하면 그다음부터는 충돌이 없습니다</li></ol><div class=\"warn\">⚠️ <b>시작 앱에서 끄면 빅스비 음성 호출도 안 됩니다.</b> 빅스비를 쓰신다면 <b>1단계만</b> 하시고, 필요할 때마다 종료해 주세요.</div><div class=\"item-note\">💡 <b>업무용 PC라 설정이 잠겨 있다면</b> 맨 위의 <b>우클릭 방법</b>을 쓰세요. 결과는 똑같습니다.</div></div></details></div></details></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 즐겨찾기 폴더로 정리 (업무별로 묶기)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">매일 들어가는 곳은 정해져 있죠 — 업무포털, 나이스, 교육청 홈페이지. <b>즐겨찾기바에 업무별 폴더</b>를 만들어 두면 그 안에 다 들어갑니다. <b>한 번 만들면 계속</b> 쓰고, <b>로그인만 하면 다른 PC에서도</b> 따라옵니다.</div><div class=\"a3-subtt\">즐겨찾기바 빈 곳 우클릭 → 폴더 추가 → 이름 입력 → 저장</div><img class=\"a3-img\" src=\"bm-folder-1.png\" alt=\"즐겨찾기바에서 우클릭 후 폴더 추가를 눌러 예산 폴더를 만드는 화면\" loading=\"lazy\"><div class=\"warn\">🔴 저장 위치는 <b>［북마크바］</b>로 두세요. 그래야 화면 위에 바로 보입니다.</div><div style=\"height:1.3em\"></div><div class=\"item-lead\">이렇게 <b>즐겨찾기바에 폴더가 생깁니다.</b></div><img class=\"a3-img\" style=\"max-width:220px;margin-left:0\" src=\"bm-folder-2.png\" alt=\"즐겨찾기바에 업무별 폴더가 만들어진 모습 (예시)\" loading=\"lazy\"><div class=\"item-note\">▲ 이런 식으로 <b>업무별 폴더</b>를 나란히 만들어 두고, 그 안에 사이트를 넣으면 됩니다.</div><ol class=\"steps\"><li>같은 방법으로 내 업무에 맞는 폴더 <b>2~3개</b>를 만듭니다 <span style=\"color:#7b8494\">(예: 업무 · 복무·연수 · 자료)</span></li><li>자주 가는 사이트를 연 뒤 주소창 오른쪽 <b>★(별표)</b> 클릭 → <b>폴더를 골라</b> 저장</li><li>이미 있는 즐겨찾기는 <b>마우스로 끌어다</b> 폴더에 넣으면 됩니다</li><li>폴더를 누르면 <b>그 안의 사이트가 쭉</b> 펼쳐집니다</li></ol><div class=\"tip\"><b>➕ 이렇게 묶어 보세요</b><b>업무</b> — 업무포털 · 나이스 · 교육청 홈페이지 · 내 직종에서 매일 쓰는 시스템<br><b>복무·연수</b> — 복무·취업규칙 자료 · 연수원 홈페이지 · 법제처<br><b>자료·AI</b> — 구글 드라이브 · 제미나이 · 오늘 연수 웹교안</div><div class=\"item-note\">💡 폴더 하나에 <b>10개 넘게</b> 들어가면 다시 찾기 어려워집니다. 많아지면 폴더 <b>안에 폴더</b>를 하나 더 만드세요.</div><div style=\"height:2.6em\"></div><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">📦 만든 즐겨찾기를 <b>다른 계정으로 옮기기</b> — 개인계정 ↔ 기관계정<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">즐겨찾기는 <b>계정마다 따로 놉니다.</b> ①에서 나눠 둔 <b>개인계정 프로필</b>과 <b>기관계정 프로필</b>은 서로 즐겨찾기가 안 보여요. <b>파일 하나로 통째로 옮기면</b> 됩니다.</div><div class=\"a3-subtt\">1단계 · 원래 계정에서 내보내기</div><ol class=\"steps\"><li>즐겨찾기가 있는 <b>그 프로필의 크롬</b>을 엽니다</li><li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> — <b>북마크 관리자</b>가 열립니다<br><span style=\"font-size:15px;color:#6B7688\">(또는 ⋮ → 북마크 및 목록 → 북마크 관리자)</span></li><li>관리자 화면 <b>오른쪽 위 ⋮</b> → <b>［북마크 내보내기］</b></li><li><b>바탕화면</b>에 저장 — <b>bookmarks_2026….html</b> 파일이 생깁니다</li></ol><div class=\"item-note\">💡 이 HTML 파일 하나에 <b>폴더 구조까지 통째로</b> 들어 있어요. 메일로 보내거나 USB에 담아도 됩니다.</div><div class=\"a3-subtt\">2단계 · 받을 계정에서 가져오기</div><ol class=\"steps\"><li>오른쪽 위 <b>프로필 아이콘</b>을 눌러 <b>받을 계정의 프로필로 전환</b></li><li>다시 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> → <b>오른쪽 위 ⋮</b> → <b>［북마크 가져오기］</b></li><li>방금 저장한 <b>HTML 파일</b>을 고르면 끝</li></ol><div class=\"warn\">⚠️ <b>가져온 즐겨찾기는 「가져온 북마크」 폴더 안에 들어갑니다.</b> 즐겨찾기바에 바로 안 보인다고 당황하지 마세요 — 그 폴더를 열어 <b>마우스로 끌어다</b> 북마크바로 옮기시면 됩니다.</div><div class=\"item-note\">💡 <b>같은 계정</b>을 다른 PC에서 쓰는 거라면 이 과정이 필요 없어요. 그 PC 크롬에 <b>로그인만 하면</b> 즐겨찾기가 따라옵니다. 이건 <b>계정이 다를 때</b> 쓰는 방법이에요.</div><div class=\"item-note\">🧹 두 번 가져오면 <b>똑같은 게 두 벌</b>이 됩니다. 중복이 생기면 북마크 관리자에서 지워 주세요.</div></div></div></details></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 한방에 큐알코드 만들기 (크롬 / 엣지 다 가능)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>아직도 네이버 큐알 쓰시나요? <b>한방에 큐알코드 만드는 2가지 방법</b></li><li><b>방법 ① 마우스 우클릭</b> — 페이지에서 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·엣지 기본 기능)</li><li><b>방법 ② 크롬 확장 프로그램</b> — QR Code Generator 설치 후 클릭 한 번<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/qr-code-generator/afpbjjgbdimpioenaedcjgkaigggcdpp\" target=\"_blank\" rel=\"noopener\">🔳 QR Code Generator 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 캡처, 이렇게 하세요<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#c0392b\">(윈도우10은 안 돼요)</b></span></div></div><img class=\"doc-img\" src=\"capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\" style=\"margin-top:14px;\"><ol class=\"steps\"><li>캡처 <b>도구로 텍스트 복사</b>가 되는 거 아세요? — 캡처한 이미지 속 글자를 바로 복사<div class=\"cap-practice-label\">📄 아래 안내문의 글자를 <b>캡처 도구</b>로 복사해 보세요!</div><img class=\"doc-img\" src=\"notice-sample.png\" alt=\"캡처 연습용 안내문\" loading=\"lazy\" style=\"max-width:720px;margin:8px 0 6px;\"><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 캡처 도구에서 “모든 텍스트 복사” 위치 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"capture-text.png\" alt=\"캡처 도구 — 모든 텍스트 복사\" loading=\"lazy\" style=\"margin:6px 0 2px;\"><div class=\"cap-paste-label\">👇 복사한 텍스트를 여기에 붙여넣어 확인해 보세요</div><textarea class=\"cap-paste\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" spellcheck=\"false\"></textarea></div></details></li><li>더 편한 방법? → 다음 항목 <b>구글 렌즈</b>로 이어집니다</li></ol><button class=\"warmup-link\" onclick=\"showTab('warmup')\">🔥 워밍업 게임에서 직접 연습하기 →</button><div style=\"height:2.4em\"></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div></li><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤-1 (＋더 나아가기) 스크롤 캡처·편집이 편한 픽픽(PicPick)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">픽픽은 연수 중 <b>시간이 허락하면 설치해 실습</b>합니다.</div><ol class=\"steps\"><li>① <b>스크롤 캡처</b> — 긴 페이지를 한 장으로 쭉!</li><li>② <b>동영상 녹화</b> 가능</li><li>③ 캡처 이미지에 <b>모자이크 처리 · 번호 순서 자동 매기기</b> 등 다양한 편집 기능</li><li>설치 파일 내려받기 →<br><a class=\"link-btn\" href=\"https://picpick.app/ko/download/\" target=\"_blank\" rel=\"noopener\">🖼️ 픽픽(PicPick) 다운로드</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 구글 렌즈 — 화면 속 글자·이미지를 바로 활용 (엣지 X / 크롬 O)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">🔬 <b>행정·영양·시설 선생님께!</b> 물품 라벨·기기 모델명·식재료 표시 — <b>찍기만 하면</b> 뭔지 알려줘요.</div><div class=\"item-lead\">관련 내용(웹·이미지 등)을 <b>오른쪽 창</b>에서 바로 확인할 수 있어요.</div><div class=\"a3-subtt\">1. 텍스트 복사</div><p>화면 속 글자를 복사 → <b>doc.new</b>로 구글 독스를 열어 붙여넣어 잘 됐는지 확인</p><div class=\"a3-tip\">📄 <b>이 안내문의 글자를 캡처해서 복사해 보세요!</b></div><img class=\"a3-img\" src=\"lens-notice.png\" alt=\"실습용 가정통신문 — 교직원 회의 안내\" loading=\"lazy\"><div class=\"a3-btns\" style=\"margin:12px 0 4px\"><a class=\"link-btn\" href=\"https://docs.new\" target=\"_blank\" rel=\"noopener\">📝 새 구글 문서 열기 (doc.new) — 복사한 글 붙여넣기</a></div><div style=\"color:#7b8494;font-size:14.5px;margin-bottom:6px\">▲ 버튼을 누르면 새 탭에 빈 구글 문서가 열려요 → <kbd>Ctrl</kbd>+<kbd>V</kbd>로 붙여넣기</div><div class=\"a3-subtt\" style=\"margin-top:18px\">2. 이미지로 복사</div><p>복사한 이미지를 PPT·캔바 등 <b>어디든 붙여넣기</b>(캡처 불필요) → <b>slide.new</b>로 구글 슬라이드에서 확인</p><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://www.youtube.com/\" target=\"_blank\" rel=\"noopener\">▶ 유튜브 홈 열기</a></div><div class=\"a3-subtt\" style=\"margin-top:18px\">3. 번역</div><p>화면 속 외국어를 바로 번역</p><div class=\"a3-tip\">🌍 <b>이 외국어 간판을 캡처해서 번역해 보세요!</b></div><img class=\"a3-img\" src=\"lens-sign.png\" alt=\"실습용 외국어 간판 사진\" loading=\"lazy\"><div class=\"item-note\">안 읽히는 글자도 있어요. 그럴 땐 <b>결국 사람이 확인해야 한다</b>는 것도 함께 알아두세요.</div><div class=\"warn\" style=\"margin-top:18px\">💡 <b>구글 렌즈가 안 뜨면?</b> ① 크롬인지 확인(크롬만 됩니다, 엣지 X) · ② ⋮ → 도움말 → Chrome 정보 → 최신으로 업데이트 · ③ 그래도 안 되면 ⋮ → 설정 → 검색엔진을 ‘Google’로</div><div class=\"a3-btns\" style=\"margin-top:14px\"><a class=\"link-btn\" href=\"https://www.google.com/search?udm=2&amp;q=%EC%87%BC%ED%8C%8C\" target=\"_blank\" rel=\"noopener\">🔍 “쇼파” 이미지 검색 — 물품 구매 전 모양·사양 찾아보기</a></div><div class=\"a3-tip\" style=\"margin-top:14px\">📐 <b>이 수학 문제를 캡처해서 구글 렌즈·제미나이로 풀어보세요!</b><br><span style=\"font-size:13.5px;color:#7a8091\">자녀가 가져온 문제도 이렇게 찍어서 풀이를 받아볼 수 있어요.</span></div><img class=\"a3-img\" src=\"lens-math.png\" alt=\"실습용 수학 문제 — 등차수열\" loading=\"lazy\"></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 모바일 구글 렌즈<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"warn\" style=\"margin-top:0\">📱 <b>아래 화면은 갤럭시(삼성)폰 기준</b>이에요. <b>아이폰도 다 됩니다</b> — 들어가는 길만 조금 달라서, 맨 아래 <b>［🍎 아이폰에서는 이렇게］</b>에 따로 정리해 뒀어요.</div><ol class=\"steps\"><li>휴대폰 <b>구글 앱 · 크롬</b>에서 카메라/이미지로 글자·사물·번역을 바로 인식<details class=\"tiptog\" open><summary>📱 휴대폰에서 구글 렌즈 쓰는 법 보기</summary><div class=\"tiptog-body\"><img class=\"a3-img\" src=\"lens-mobile-1.png\" alt=\"휴대폰에서 구글 렌즈를 실행해 사진을 검색하고 AI 개요 결과를 보는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>카메라·사진에서 바로</b> — 구글 앱 검색창의 <b>렌즈 아이콘</b>을 누르고 찍거나 사진을 고르면, 그 자리에서 <b>AI 개요</b>로 무엇인지 알려줍니다.</div><div style=\"height:1.3em\"></div><img class=\"a3-img\" src=\"lens-mobile-2.png\" alt=\"앱 화면에서 하단 검색 버튼을 눌러 화면 속 이미지를 구글 렌즈로 검색하는 3단계\" loading=\"lazy\"><div class=\"item-note\">▲ <b>지금 보고 있는 화면 그대로</b> — 앱을 벗어나지 않고 하단 <b>검색(렌즈) 버튼</b>을 누르면 화면 속 사물을 바로 찾아줍니다. 캡처해서 옮길 필요가 없어요.</div></div></details></li><li><b>스마트폰으로 QR코드를 촬영해보자!</b><br>① <b>갤러리에서 이미지 꾹 눌러</b> 링크 들어가기<br>② <b>스마트폰에 저장된 QR 이미지</b>로 링크 들어가기<details class=\"tiptog\" open><summary>📷 QR 촬영해서 링크 여는 방법 보기</summary><div class=\"tiptog-body\"><img class=\"a3-img\" src=\"qr-scan.png\" alt=\"휴대폰 카메라로 QR을 찍고, 화면을 꾹 눌러 뜬 링크를 여는 3단계\" loading=\"lazy\"><div class=\"item-note\">▲ ① 카메라로 <b>QR을 찍고</b> → ② 화면을 <b>꾹 누르면</b> → ③ <b>［링크 열기］</b>가 떠요.</div></div></details></li><li>현장 사진 속 글자 추출, 실물 번역 등 밖에서도 그대로 활용</li></ol><div class=\"tip\"><b>➕ 현장에서 이렇게 씁니다</b>물품·기기 <b>라벨이나 부품 사진</b>을 찍어 무엇인지 찾기 · 외국어 <b>안내문·라벨 번역</b> · 종이 서류 속 글자를 찍어 <b>텍스트로 꺼내기</b></div><div style=\"height:2.6em\"></div><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">🍎 아이폰에서는 이렇게 — 구글 렌즈 쓰는 3가지 길<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">아이폰에는 <b>갤럭시의 “화면 그대로 검색”</b> 버튼이 없어요. 대신 <b>구글 앱</b>과 <b>크롬 앱</b>으로 똑같이 할 수 있습니다. <b>앱스토어에서 「Google」과 「Chrome」을 먼저 설치</b>해 두세요.</div><div class=\"a3-subtt\">① 카메라로 바로 — 가장 많이 씁니다</div><ol class=\"steps\"><li><b>Google 앱</b>을 엽니다</li><li>검색창 오른쪽 <b>렌즈 아이콘(📷)</b>을 누릅니다</li><li>비추고 <b>촬영</b> → 글자·사물·번역 결과가 바로 나옵니다</li></ol><div class=\"item-note\">💡 <b>홈 화면에 Google 위젯</b>을 올려 두면 앱을 열 필요 없이 위젯의 렌즈 아이콘을 바로 누를 수 있어요.</div><img class=\"a3-img\" src=\"iphone-lens-1.png\" alt=\"아이폰 구글 앱에서 검색창의 렌즈 아이콘을 눌러 카메라로 바로 검색하는 화면\" loading=\"lazy\"><div class=\"a3-subtt\">② 사진첩에 있는 사진으로</div><ol class=\"steps\"><li>같은 <b>렌즈 아이콘</b>을 누릅니다</li><li>화면 아래 <b>사진 선택 도구</b>를 눌러 사진첩에서 고릅니다</li><li>공문·안내문을 찍어 둔 사진에서 <b>글자만 뽑아</b> 쓸 수 있어요</li></ol><div class=\"item-note\">💡 <b>화면을 캡처해서 쓰면 “화면 검색”이 됩니다.</b> 아이폰은 <b>전원 버튼 + 볼륨 위</b>를 동시에 눌러 캡처 → 그 사진을 위 방법으로 불러오면 돼요.</div><img class=\"a3-img\" src=\"iphone-lens-2.png\" alt=\"아이폰 구글 렌즈에서 스크린샷을 골라 화면 속 이미지를 검색하고 AI 개요 결과를 보는 화면\" loading=\"lazy\"><div class=\"a3-subtt\">③ 웹에서 본 이미지 바로</div><div class=\"a3-tip\"><b>크롬 앱</b>으로 웹을 보다가 이미지를 <b>꾹 길게 누르면</b> <b>［Google로 이미지 검색］</b>이 뜹니다. 캡처할 필요 없이 그 자리에서 검색돼요.</div><div class=\"warn\">⚠️ <b>아이폰 기본 브라우저(사파리)에서는 안 됩니다.</b> 구글 렌즈는 <b>Google 앱</b>이나 <b>크롬 앱</b> 안에서만 동작해요. 설치가 안 돼 있으면 먼저 받아 주세요.</div><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://apps.apple.com/app/id284815942\" target=\"_blank\" rel=\"noopener\">🍎 Google 앱 설치</a> <a class=\"link-btn\" href=\"https://apps.apple.com/app/id535886823\" target=\"_blank\" rel=\"noopener\">🍎 Chrome 앱 설치</a></div></div></div></details></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📱 제미나이 라이브 — 폰으로 실시간 대화·화면 공유<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이 앱에서 <b>말로 실시간 대화</b>하고, <b>카메라를 켜서 눈앞의 물건·화면을 함께 보며</b> 물어볼 수 있어요. 타이핑 없이 대화하듯 쓰는 기능입니다.</div><ol class=\"steps\"><li><b>제미나이 앱</b>을 열고, 입력창 오른쪽 끝의 <b>라이브 아이콘(‖ 물결 모양)</b>을 누릅니다</li><li><b>“듣는 중…”</b> 상태에서 그냥 <b>말로 질문</b>하면 제미나이가 음성으로 답합니다</li><li>화면 아래 <b>카메라 버튼</b>을 켜면, 카메라로 비추는 <b>실물·서류·화면을 함께 보며</b> 대화할 수 있어요</li></ol><img class=\"a3-img\" src=\"gemini-live.png\" alt=\"제미나이 앱에서 라이브 아이콘을 눌러 음성으로 대화하고 카메라를 켜서 눈앞의 사물을 보며 질문하는 3단계 화면\" loading=\"lazy\"><div class=\"item-note\">💡 <b>이럴 때 좋아요</b> — 손이 바쁠 때 말로 묻기 · 복잡한 서류를 카메라로 비추며 “이거 무슨 서류야?” · 기기·오류 화면을 보여주며 “어떻게 해결해?”</div><div class=\"warn\">⚠️ 개인정보(이름·주민번호·연락처)가 담긴 화면·서류는 비추지 마세요.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ 전체 글 가져오기 (복사 허용)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>구글 렌즈는 <b>일부 글만</b> 잡히고 <b>전체 글은 안 긁히는</b> 단점이 있어요</li><li><b>복사 허용(Allow Copy)</b> 확장 프로그램이면 복사가 막힌 사이트에서도 전체 글을 쏙 복사<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/%EB%B3%B5%EC%82%AC-%ED%97%88%EC%9A%A9-+/ajhbdcgfhlhhmocddefknjjkejcfpbnj?hl=ko\" target=\"_blank\" rel=\"noopener\">📋 복사 허용 설치</a></li><li><b>여기서 직접 해보세요</b> — 아래 글을 열고 <b>먼저 그냥 복사</b>해 보세요. 그다음 확장을 켜고 <b>다시 복사</b>해 보면 차이가 바로 느껴집니다<br><a class=\"link-btn\" style=\"background:#03C75A !important;border-color:#03C75A !important;color:#fff !important\" href=\"https://blog.naver.com/ss2ppl/224397528114\" target=\"_blank\" rel=\"noopener\">📄 실습용 글 열기 — 네이버 블로그 &nbsp;→</a></li></ol><div class=\"item-note\">💡 <b>복사가 되는 글도 있고 안 되는 글도 있어요.</b> 막혀 있으면 <b>확장 아이콘을 눌러 켠 뒤</b> 새로고침하고 다시 시도하세요.</div><div class=\"warn\">⚠️ <b>가져온 글은 참고용입니다.</b> 남이 쓴 글을 그대로 옮겨 쓰면 안 되고, <b>출처를 밝히거나 내 문장으로 바꿔</b> 쓰셔야 합니다.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑨ 툴바 설정 (분할뷰 · 큐알코드 · 구글 렌즈 등)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>자주 쓰는 기능(분할뷰 · 큐알코드 · 구글 렌즈 등)을 <b>툴바에 꺼내두면</b> 클릭 한 번으로 사용</li><li>설정: 툴바 빈 곳 <b>우클릭 → 도구 모음 맞춤설정</b>(또는 ⋮ 메뉴)에서 원하는 도구 켜기</li></ol><img class=\"a3-img\" src=\"chrome-toolbar-menu.png\" alt=\"크롬 도구 모음 맞춤설정 패널 — 탐색·내 Chrome·도구 및 작업 항목을 켜고 끄는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>켜 두면 좋은 것 네 가지</b> — <b>분할 보기에서 열기</b>(자료 보며 문서 작성) · <b>Google 렌즈로 이 탭 검색</b> · <b>번역</b> · <b>QR 코드 만들기</b>. 나머지는 꺼 두면 툴바가 깔끔해요.</div><div class=\"tip\"><b>➕ 순서도 바꿀 수 있어요</b>맨 아래 안내처럼 <b>툴바의 버튼을 마우스로 끌어</b> 자주 쓰는 것을 왼쪽으로 옮겨 두세요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑩ 탭 그룹 활용 (업무별 탭 정리)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>여러 탭을 <b>업무별로 묶어</b> 색·이름으로 정리 — 예: ‘업무’ · ‘연수’ · ‘자료’ 그룹</li><li>만들기: 탭 <b>우클릭 → 새 그룹에 탭 추가</b> → 이름·색 지정</li><li>그룹을 <b>접으면</b> 화면이 깔끔, 다시 누르면 펼쳐져요 (저장 그룹으로 두면 창을 닫아도 유지)</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑪ 시크릿 모드 vs 게스트 모드<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>시크릿 모드 = ‘나’를 위한 보호</b> — 공용 PC에 내 흔적을 남기고 싶지 않을 때, 내가 만든 웹사이트 확인용</li><li><b>게스트 모드 = ‘남’을 위한 배려</b> — 내 컴퓨터를 학생·동료에게 잠시 빌려줄 때, 내 정보를 전혀 안 보여주고 빌려주기</li></ol><div class=\"a3-subtt\">🕵️ 시크릿 모드 — 내 흔적을 안 남긴다</div><img class=\"a3-img\" src=\"mode-secret.jpg\" alt=\"시크릿 모드를 투명 망토에 비유한 이미지\" loading=\"lazy\"><img class=\"a3-img\" src=\"secret-window-open.png\" alt=\"크롬 ⋮ 메뉴에서 새 시크릿 창을 여는 화면과 단축키 Ctrl+Shift+N\" loading=\"lazy\"><div class=\"item-note\">▲ <b>여는 법</b> — 오른쪽 위 <b>⋮</b> → <b>［새 시크릿 창］</b>. 단축키는 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> 입니다.</div><div class=\"tip\"><b>➕ 업무에서 이럴 때</b>공용 PC에서 잠깐 검색할 때 · 내가 만든 <b>공고문·홈페이지가 남들 눈에 어떻게 보이는지</b> 로그인 안 한 상태로 확인할 때 · 같은 사이트에 <b>계정 두 개</b>로 동시에 들어갈 때</div><div class=\"warn\">⚠️ <b>시크릿 모드가 “익명”은 아닙니다.</b> 내 PC에 기록이 안 남을 뿐, <b>기관 네트워크와 접속한 사이트에는 그대로 남습니다.</b></div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">👤 게스트 모드 — 남에게 잠깐 빌려줄 때</div><img class=\"a3-img\" src=\"mode-guest.jpg\" alt=\"게스트 모드를 임시 출입증에 비유한 이미지\" loading=\"lazy\"><img class=\"a3-img\" src=\"guest-profile-open.png\" alt=\"크롬 프로필 아이콘을 눌러 게스트 프로필 열기를 선택하는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>여는 법</b> — 툴바 오른쪽 <b>프로필 아이콘</b> 클릭 → <b>［게스트 프로필 열기］</b>. 내 <b>북마크·비밀번호·검색 기록이 전혀 안 보입니다.</b></div><div class=\"tip\"><b>➕ 둘의 차이 한 줄</b><b>시크릿</b>은 <b>내가</b> 쓰면서 흔적을 안 남기는 것, <b>게스트</b>는 <b>남이</b> 쓰게 하면서 내 것을 안 보여주는 것. 민원인·학생에게 잠깐 빌려줄 땐 <b>게스트</b>가 맞습니다.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑫ 내 계정 삭제 vs 원격으로 기기 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>상황: “내 컴퓨터가 아닌데 로그인하기가 꺼려져요” / “다른 기기 쓴 뒤 이 기기에서 제 아이디 완전 삭제해주세요”</li><li><b>내 계정 삭제</b>: 브라우저 프로필 → 크롬 프로필 관리 → <b>⋮(삼점)</b> → 삭제</li><li><b>원격으로 기기 관리</b>: 브라우저 프로필 → 구글 계정 관리 → 기기 → <b>로그아웃</b></li></ol><img class=\"a3-img\" src=\"profile-delete.png\" alt=\"크롬 프로필 아이콘 → Chrome 프로필 관리 → 프로필 카드의 삼점 메뉴 → 삭제 순서\" loading=\"lazy\"><div class=\"item-note\">▲ <b>순서</b> — 툴바 오른쪽 <b>프로필 아이콘</b> 클릭 → 맨 아래 <b>［Chrome 프로필 관리］</b> → 지울 프로필 카드의 <b>⋮</b> → <b>［삭제］</b></div><div class=\"warn\">⚠️ <b>삭제하면 그 프로필의 북마크·기록이 이 PC에서 사라집니다.</b> 동기화를 켜 두셨다면 계정에는 남아 있어 다시 로그인하면 돌아오지만, <b>동기화를 안 켰다면 복구되지 않습니다.</b> 지우기 전에 한 번 확인하세요.</div><div class=\"tip\"><b>➕ 남의 PC에서 썼다면 이게 더 확실합니다</b>그 PC에서 프로필을 지우는 것과 별개로, 내 폰이나 다른 기기에서 <b>구글 계정 관리 → 보안 → 내 기기</b>로 들어가 <b>원격 로그아웃</b>까지 해 두세요.</div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">📱 원격으로 기기 관리 — 화면으로 보기</div><img class=\"a3-img\" src=\"device-manage-1.png\" alt=\"구글 계정 화면에서 기기 버튼을 누르는 모습\" loading=\"lazy\"><div class=\"item-note\">① 프로필 → <b>［Google 계정 관리］</b> → 검색창 아래 <b>［기기］</b>를 누릅니다.</div><img class=\"a3-img\" src=\"device-manage-2.png\" alt=\"기기 상세 화면에서 로그아웃 버튼을 누르는 모습\" loading=\"lazy\"><div class=\"item-note\">② 로그인돼 있는 기기 목록이 나옵니다. 지울 기기를 고르고 <b>［로그아웃］</b>. 그 기기에서 <b>내 계정이 바로 빠집니다.</b></div><div class=\"tip\"><b>➕ 여기서 같이 보면 좋은 것</b>기기마다 <b>마지막 접속 위치·시각</b>이 표시됩니다. <b>모르는 기기</b>가 있으면 <b>［모르는 기기/세션인가요?］</b>를 눌러 바로 조치하세요. 연수 끝나고 <b>한 번은 훑어보시길</b> 권합니다.</div><div class=\"warn\">⚠️ <b>공용 PC를 쓰셨다면 이게 마지막 안전장치입니다.</b> 그 자리에서 로그아웃을 깜빡했어도, 내 폰에서 이 화면으로 들어가 끊어 버리면 됩니다.</div></div></li></ul></div></div></div>", "c2": "<h2 class=\"s-title\">구글폼 설문 1분 완성 · QR 배포</h2><p class=\"s-sub\">내 업무에 바로 쓰는 설문, 제미나이와 함께 1분 만에</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① AI로 손쉽게 구글폼 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>주소창에 <kbd>form.new</kbd> 입력 → 새 구글폼 바로 열기</li><li><b>AI 모드</b>가 보이나요? 프롬프트 한 줄로 폼을 자동 생성</li><li>안 보이면 워크스페이스 랩스 가입(개인계정만 가능) — 무료 계정도 AI 기능 사용 가능<br><a class=\"link-btn\" href=\"https://workspace.google.com/experiments/\" target=\"_blank\" rel=\"noopener\">🔗 워크스페이스 랩스 가입하기</a><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🎬 워크스페이스 랩스 가입 방법 (이미지로 따라하기)</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"wslabs-1.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"><img class=\"doc-img\" src=\"wslabs-2.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"></div></details></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 간단한 폼 만들고 응답 받아보기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이로 문항을 설계한 뒤 폼으로 옮기는 방법이에요. 아래 프롬프트를 <b>복사해서 바로</b> 써 보세요(상황에 맞게 바꿔도 좋아요).<div class=\"prompt-card\" style=\"margin-top:12px\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">이수증 취합 설문을 만들거야. 이름, 소속, 이수증 업로드로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"item-lead\">의견 수합·등록증(사진) 수합, 어떻게 하세요? 이메일로 받으면 시간이 많이 걸려요.</div><ol class=\"steps\"><li><b>이름 · 소속 · 파일 첨부</b>로 아주 간단한 폼 먼저 만들어 보기 <i>(예시: 이수증취합)</i><img class=\"doc-img\" src=\"form-simple.png\" alt=\"구글폼 예시 — 이름·소속·파일 업로드 문항\" loading=\"lazy\"></li><li><b>구글시트 연동</b> — ‘응답’ 탭 → 구글시트로 연결하면 응답이 실시간으로 시트에 쌓이고 자동 집계</li><li><b>응답 폼 공유·확인</b> — ‘보내기’로 링크 공유 후, 시크릿 모드에서 응답자 화면 그대로 확인</li><li><span style=\"color:#c0392b\"><b>응답 모드로 확인</b> — 실제 응답이 어떻게 들어오는지 보기</span></li><li><b>취합 정보 확인</b> — 파일 업로드 응답은 <b>구글드라이브에 폴더가 자동 생성</b>돼 사진이 착착 정리 <i>(※ 응답자도 구글 로그인 필요)</i></li></ol></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" style=\"background:#C0392B!important;color:#fff!important;border-color:#C0392B!important\" onclick=\"toggleItem(this)\">③ 그대로 쓰는 설문 프롬프트 — 공통 + 내 직종<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">🏫 <b>행정실무사 선생님께!</b> <b>시설 보수 요청·강사 서류 수합</b>, 🧸 <b>돌봄·특수 선생님께!</b> <b>방학 돌봄 신청·체험학습 동의서</b> — 종이 걷는 일 이제 끝.</div><div class=\"item-lead\">카드의 <b>［복사］</b>를 누르고 제미나이(또는 구글폼 AI 모드)에 붙여넣으면 문항이 바로 나와요. <b>공통</b>에서 하나, <b>내 직종</b>에서 하나 골라 보세요.</div><div class=\"survey-cat\"><div class=\"survey-cat-title\">👥 공통 — 누구나 <span class=\"survey-cat-desc\">(직종 상관없이 해마다 하는 설문)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“교직원 법정 의무연수(안전교육 등) 이수증 제출”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“교직원 워크숍(또는 체육대회) 참석 여부 및 점심 메뉴 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“방학 중 근무 일정 및 비상 연락망 업데이트”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-ex-head\" style=\"margin:26px 0 12px;font-weight:800;font-size:17px;color:#23303f\">🧩 직종별 예시 — 내 직종 카드를 찾아 복사하세요</div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🏫 행정실무사 <span class=\"survey-cat-desc\">(늘봄·특수교육지원센터 행정 포함 · 시설·물품·서류)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“교내 시설물(교실, 특별실 등) 고장 및 보수 요청(사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“새 학기 부서별 필요 비품·소모품 구매 요구”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“늘봄·방과후 강사 제출 서류(자격증·경력증명서) 수합”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🤝 특수교육 <span class=\"survey-cat-desc\">(특수교육지도사·관련서비스지원가 · 동의·지원 요청)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“특수학급 현장체험학습 보호자 동의 및 참가 신청”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“치료지원(언어·감각 등) 일정 변경 및 결석 사전 알림”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🧸 돌봄·방과후 <span class=\"survey-cat-desc\">(초등보육전담사·유치원방과후전담사·방과후지원센터)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“방학 중 돌봄교실 참여 수요조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“방과후 프로그램 만족도 및 다음 학기 희망 프로그램 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">💬 상담·복지 <span class=\"survey-cat-desc\">(Wee·생활인권 상담사·임상심리사·사회복지사·교육복지사)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“교육복지 프로그램(체험활동·캠프) 참가 신청”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“상담 희망 날짜·시간 사전 예약(상담 내용은 받지 않음)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\" style=\"margin-top:6px\">⚠️ <b>상담 내용·가정 형편·건강 정보는 구글폼으로 받지 마세요.</b> 폼은 <b>신청·예약</b>까지만, 민감한 이야기는 대면으로.</div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🍚 영양·급식 <span class=\"survey-cat-desc\">(영양사)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“학생·교직원 선호 급식 메뉴 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“급식 만족도 및 개선 의견 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🧹 시설·미화 <span class=\"survey-cat-desc\">(특수운영직군)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“구역별 청소·미화 요청 접수(위치·사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">✏️ 내 것으로 바꿔 쓰기 <span class=\"survey-cat-desc\">(○○○ 자리에 내 설문 주제를 넣으세요)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“○○○”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"tip\"><b>➕ 결과가 밋밋하면 한 줄 더 붙이세요</b>“사진 첨부 문항을 넣어줘” · “학년·반은 드롭다운으로, 수량은 숫자만 받게 해줘” · “이름은 필수로, 나머지는 선택으로 해줘” · “응답자가 3분 안에 끝낼 수 있게 문항을 8개 이내로 줄여줘”</div><div class=\"warn\">⚠️ <b>개인정보는 꼭 필요한 것만.</b> 주민등록번호·계좌번호는 구글폼으로 받지 마세요. 학생·보호자 정보(이름·연락처 등)는 <b>업무에 필요한 만큼만</b> 받고, 설문 맨 앞에 <b>수집 목적과 보관 기간</b>을 한 줄 적어 두세요. 응답 시트는 <b>공유 범위</b>도 꼭 확인하세요.</div><details class=\"cap-help\" style=\"margin-top:18px;\"><summary>🤖 더 꼼꼼하게 — 사양까지 적어 주는 예시 (방학 중 돌봄교실 참여 신청)</summary><div class=\"cap-help-body\"><div class=\"item-lead\" style=\"margin-top:6px\">원하는 문항·형식·설정을 <b>한 번에 적어 주면</b> 제미나이가 그대로 폼을 설계해요. 제목·문항만 내 업무로 바꿔 쓰세요.</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">너는 학교 업무를 돕는 도우미야. 아래 사양 그대로 \"방학 중 돌봄교실 참여 신청\" 구글 설문지를 만들어 줘.<br>[폼 제목] 방학 중 돌봄교실 참여 신청<br>[폼 설명] 방학 중 돌봄교실 운영을 위해 참여 신청을 받습니다. 수집한 정보는 돌봄교실 운영에만 사용하고 운영 종료 후 파기합니다.<br>[섹션 1 · 학생 정보]<br>1) 학생 이름 — 단답형, 필수<br>2) 학년·반 — 단답형(예: 3학년 2반), 필수<br>[섹션 2 · 참여 신청]<br>3) 참여 희망 기간 — 체크박스(방학 1주차 ~ 4주차)<br>4) 참여 희망 요일 — 체크박스(월~금)<br>5) 점심 도시락 지참 여부 — 객관식(지참 / 미지참)<br>6) 귀가 방법 — 객관식(보호자 동행 / 혼자 귀가 / 학원 차량)<br>7) 귀가 시간 — 드롭다운(13시 / 14시 / 15시 / 16시 / 17시)<br>[섹션 3 · 보호자 확인]<br>8) 보호자 연락처 — 단답형(숫자만), 필수<br>9) 담당 선생님께 전할 말 — 장문형, 선택<br>10) 개인정보 수집·이용 동의 — 객관식(동의함), 필수<br>[설정] 응답을 새 스프레드시트(방학 돌봄 신청 명단)로 연결. 완성 후 편집 링크와 응답 링크를 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></details></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ ＋더 나아가 심화 기능<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>① 응답 검증</b> — 전화번호는 숫자만·이메일은 형식 맞게·금액은 숫자만 → 잘못 적어낸 자료 다시 받는 스트레스를 원천 차단</li><li><b>② 조건부 이동(섹션 분기)</b> — 답에 따라 다음 질문이 달라지게 (예: ‘돌봄교실 참여? → 예’면 요일·귀가 방법 질문이 뜨게)</li><li><b>③ 새로 들어온 최신 기능</b> — 구글폼 <b>응답 기한 설정</b> · 응답자 설정</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 재사용 · 함께 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>잘 만든 폼은 <b>복사해서 매년 재사용</b></li><li><b>공동 편집자</b>를 추가해 같은 업무 동료와 함께 관리 (다시 안 만들어도 돼요)</li></ol></div></li></ul><div class=\"practice\"><b>💻 실습</b><b>내 직종에서 실제로 쓸 설문 1개</b>를 만들어 보기 — ③에서 카드 하나 골라 문항 만들기 → 구글폼에 옮기기 → 구글시트 연동까지. 사진이 필요하면 <b>파일 업로드</b> 문항도 넣어 보세요.</div><div class=\"tip\"><b>➕ 한 걸음 더</b>완성한 폼은 <b>QR코드로 배포</b>해 보세요 — 응답 링크를 크롬으로 열고 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·구글 꿀팁 ④). 가정통신문·게시판에 붙이면 휴대폰으로 바로 응답해요.</div></div></div>", "hakwun": "<h2 class=\"s-title\">🗂️ 패들렛 — 사진·자료 한 벽에</h2><p class=\"s-sub\">회의자료·현장사진·안내문을 한 벽에 모아 링크·QR로 나누기 — 내 직종에 맞게 골라 쓰세요</p><div class=\"block open\" id=\"d2-c3\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-t\">📋 패들렛 — 사진·자료 한 벽에</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"background:#FBF6E7;border-left:4px solid #C8A951;border-radius:8px;padding:12px 15px;color:#7a5f14;font-size:15px;line-height:1.9;margin:0 0 18px\"><div style=\"font-weight:800;margin-bottom:6px;color:#8A6D1A\">📋 이럴 때 특히 좋아요</div>▸ <b>회의자료</b>를 미리 올려 두고 <b>회의 전에 링크로 배포</b> — 회의 땐 <b>다 같이 한 화면</b>으로 보기<br><br>▸ <b>공사현황·진도</b>를 사진과 함께 올려 <b>업체와도 간편하게 공유</b><br><br>▸ 행사·현장 <b>사진 아카이빙</b>도 한곳에 차곡차곡</div><ul class=\"block-ul\"><li class=\"item-detail coll coll-green pv1\" id=\"wa2-1\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 패들렛 예시 — 학교운영위원회 · 공사현황 진행 · 회의자료 배포<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">회의 안건·안내 자료를 종이 대신 <b>웹페이지로 만들어 QR·링크로 배포</b>하는 두 도구예요. 먼저 <b>예시</b>로 어떤 모습인지 보고, 아래 ③에서 직접 만들어 봐요.</div><ol class=\"steps\"><li><b>🧱 패들렛</b> <i>(제일 쉬움)</i> — 벽에 문서를 드래그로 올리고 <b>QR 즉시 생성</b>, 위원 의견·반응도 바로. 가볍게 자료 모으기에 딱<br><div style=\"margin-top:8px;font-weight:800;color:#16233F;font-size:15px\">🏛️ 학운위 안건 예시</div><a class=\"link-btn\" href=\"https://padlet.com/doramge1984/oo-gidx1ts8g8d3guw4\" target=\"_blank\" rel=\"noopener\">🧱 예시 패들렛 열기</a><iframe class=\"padlet-embed\" src=\"https://padlet.com/embed/gidx1ts8g8d3guw4\" loading=\"lazy\" title=\"예시 패들렛\" allow=\"clipboard-write\"></iframe><div style=\"margin-top:14px;font-weight:800;color:#16233F;font-size:15px\">🏗️ 공사현황 진행 예시</div><a class=\"link-btn\" href=\"https://padlet.com/openter2018/padlet-k3qncl8y1xxfu18m\" target=\"_blank\" rel=\"noopener\">🏗️ 공사현황 패들렛 열기</a><div style=\"margin-top:14px;font-weight:800;color:#16233F;font-size:15px\">📋 회의자료 배포 예시</div><a class=\"link-btn\" href=\"https://padlet.com ;border-left:5px solid #D98BA3\"><div class=\"act-h\" style=\"color:#D98BA3;filter:brightness(.75)\">🧸 돌봄·방과후</div><div class=\"act-d\">쓰기 좋은 서식: <b>담벼락</b></div><ol class=\"steps\"><li>돌봄교실 <b>활동사진 앨범</b></li><li>방과후 프로그램 안내·신청 QR 모음</li></ol></div><div class=\"act\" style=\"background:#EEF7F6;border-color:#5FA8A055;border-left:5px solid #5FA8A0\"><div class=\"act-h\" style=\"color:#5FA8A0;filter:brightness(.75)\">💬 상담·복지</div><div class=\"act-d\">쓰기 좋은 서식: <b>셸프</b></div><ol class=\"steps\"><li>교육복지 프로그램 <b>안내·신청 QR</b> 모음</li><li>학부모용 상담·복지 안내자료 벽 <span style=\"color:#a5372f\">(상담 내용은 절대 X)</span></li></ol></div><div class=\"act\" style=\"background:#FFF5E8;border-color:#E0A45855;border-left:5px solid #E0A458\"><div class=\"act-h\" style=\"color:#E0A458;filter:brightness(.75)\">🍚 영양·급식</div><div class=\"act-d\">쓰기 좋은 서식: <b>셸프 (요일별)</b></div><ol class=\"steps\"><li><b>주간 식단·급식 사진</b></li><li>위생점검 체크 사진</li></ol></div><div class=\"act\" style=\"background:#F3F7EC;border-color:#8DB06A55;border-left:5px solid #8DB06A\"><div class=\"act-h\" style=\"color:#8DB06A;filter:brightness(.75)\">🧹 시설·미화</div><div class=\"act-d\">쓰기 좋은 서식: <b>지도 · 타임라인</b></div><ol class=\"steps\"><li>구역별 <b>청소·보수 전후 사진</b></li><li>고장·요청 위치 표시</li></ol></div><div class=\"act\" style=\"background:#F4F4F2;border-color:#9A968C55;border-left:5px solid #9A968C\"><div class=\"act-h\" style=\"color:#9A968C;filter:brightness(.75)\">👥 공통</div><div class=\"act-d\">쓰기 좋은 서식: <b>셸프</b></div><ol class=\"steps\"><li>부서 <b>회의자료 배포</b></li><li>연수 자료 모음 · 행사 사진 아카이브</li></ol></div></div></div><div class=\"warn\">⚠️ <b>학생 사진·개인정보 주의</b> — 돌봄·특수교육·상담처럼 학생이 나오는 벽은 공유 설정을 <b>“비공개” 또는 “링크가 있는 사람만”</b>으로 두고, <b>얼굴이 드러난 사진·이름</b>은 올리지 않거나 가려 주세요.</div></div></li><li class=\"item-detail coll coll-green pv3\" id=\"wa2-3\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 패들렛 시작하기 — 가입·QR·단축URL·태블릿 바로가기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">패들렛을 <b>구글 계정으 function b64(b){const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function dec(blob,pw){
 const salt=b64(blob.salt),iv=b64(blob.iv),ct=b64(blob.ct);
 const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:P.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}

function fmt(ms){return (ms/1000).toFixed(2)+'초';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* --- 게임1: 복사·붙여넣기 (레벨1: 한 문장 / 레벨2: Ctrl+A 콤보) --- */
function g1setup(){
 if(G1.level===1){G1.tasks=shuffle(G1_POOL).slice(0,5).map(function(s){return {type:'cv',text:s};});}
 else{var cp=shuffle(G1_COPY),cl=shuffle(G1_CLEAR),t=[],ci=0,ki=0;for(var i=0;i<5;i++){if(i%2===0)t.push({type:'copyall',text:cp[ci++]});else t.push({type:'clearall',text:cl[ki++]});}G1.tasks=t;}
 G1.idx=0;
}
function g1fields(showSrc,srcVal,srcRO,showInp){
 var t=document.getElementById('g1t'),src=document.getElementById('g1src'),i=document.getElementById('g1i');
 var sL=document.getElementById('g1srcL'),iL=document.getElementById('g1iL');
 if(sL)sL.style.display=showSrc?'block':'none';
 if(src){src.style.display=showSrc?'block':'none';if(showSrc){src.value=srcVal;src.readOnly=!!srcRO;src.style.height='auto';src.style.height=(src.scrollHeight+6)+'px';}}
 if(iL)iL.style.display=showInp?'block':'none';
 if(i){i.style.display=showInp?'block':'none';if(showInp){i.value='';i.style.height='auto';i.style.height=(i.scrollHeight+4)+'px';}}
}
function g1show(){
 var task=G1.tasks[G1.idx],t=document.getElementById('g1t'),p=document.getElementById('g1p'),sL=document.getElementById('g1srcL');
 if(p)p.textContent='STAGE '+(G1.idx+1)+' / 5';dots('g1dots',G1.idx);
 if(task.type==='cv'){t.className='g1-target';t.textContent=task.text;g1fields(false,'',false,true);}
 else if(task.type==='copyall'){t.className='g1-target g1-inst';t.innerHTML='📋 <span class="stepnum">①</span> 원본 클릭 → <span class="stepnum">②</span> Ctrl+A <small>(전체선택)</small> → <span class="stepnum">③</span> Ctrl+C <small>(복사)</small> → <span class="stepnum">④</span> 아래 칸에 Ctrl+V <small>(붙여넣기)</small>';if(sL)sL.textContent='📋 원본 — 여기서 전체 복사';g1fields(true,task.text,true,true);}
 else{t.className='g1-target g1-inst';t.innerHTML='🧹 <span class="stepnum">①</span> 이 칸 클릭 → <span class="stepnum">②</span> Ctrl+A <small>(전체선택)</small> → <span class="stepnum">③</span> Delete <small>(전부 지우기)</small>';if(sL)sL.textContent='🧹 이 칸 — 전체 선택 후 삭제';g1fields(true,task.text,false,false);}

function g1norm(s){return (s||'').replace(/\r\n?/g,'\n').replace(/[ \t]+$/gm,'').trim();}
function g1paste(e){
 var task=G1.tasks[G1.idx];
 if(task.type!=='cv'&&task.type!=='copyall')return;
 if(G1.mode==='challenge'&&!G1.started)return;
 if(G1.await)return;
 e.preventDefault();
 var raw=(e.clipboardData||window.clipboardData).getData('text');
 var inp=document.getElementById('g1i');
 if(inp){inp.value=raw;inp.style.height='auto';inp.style.height=(inp.scrollHeight+4)+'px';}   // 붙여넣은 문장을 칸에 실제로 보여주기 + 높이 확장
 var txt=g1norm(raw);
 var expected=g1norm(task.type==='copyall'?document.getElementById('g1src').value:task.text);
 var r=document.getElementById('g1r');
 if(txt===expected){g1win();}
 else{r.className='game-result bad';r.textContent=(task.type==='copyall')?'❌ 전체가 안 됐어요! Ctrl+A로 전체 선택했는지 확인해요.':'❌ 앗, 문장이 달라요! 다시 복사해볼까요?';}
}

 if(G1.await)return;
 if(document.getElementById('g1src').value.trim()===''){g1win();}
}

function toggleBlock(head){head.parentElement.classList.toggle('open');}
function toggleItem(el){el.parentElement.classList.toggle('open');}
function fallbackCopy(t,done){try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){}}
function copyPrompt(btn){
 const t=btn.parentElement.querySelector('.prompt-text').innerText;
 const done=()=>{btn.textContent='복사됨 ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done');},1500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}
 else fallbackCopy(t,done);
